<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05080d">

<title>HANDLIGHT - HAND TRACKING</title>

<style>

:root{
    --bg:#05080d;
    --white:#ffffff;
    --muted:rgba(255,255,255,.55);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#05080d;
}

body{
    font-family:Arial,sans-serif;
    color:white;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05080d;
}

/* =========================
   CAMERA
========================= */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    filter:
        brightness(.78)
        contrast(1.05)
        saturate(.92);

    z-index:0;
}

/* =========================
   SKELETON CANVAS
========================= */

#skeleton{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:4;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.08) 70%,
            rgba(0,0,0,.45) 100%
        );
}

/* =========================
   TOP
========================= */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        max(20px,env(safe-area-inset-top))
        20px
        15px;

    font:9px monospace;

    letter-spacing:.17em;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:white;

    box-shadow:0 0 12px white;
}

.status{
    color:var(--muted);
}

/* =========================
   START
========================= */

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    background:#05080d;

    transition:
        opacity .4s ease,
        visibility .4s ease;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);

    text-align:center;
}

.camera-icon{
    width:68px;
    height:68px;

    margin:0 auto 25px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.08);
}

.camera-icon span{
    width:21px;
    height:29px;

    border:
        2px solid white;

    border-radius:
        13px 13px 8px 8px;
}

.eyebrow{
    margin:0 0 12px;

    color:
        rgba(255,255,255,.6);

    font:10px monospace;

    letter-spacing:.2em;
}

h1{
    margin:0;

    font-size:
        clamp(30px,8vw,44px);

    line-height:1.02;

    letter-spacing:-.04em;
}

.desc{
    max-width:320px;

    margin:
        18px auto 27px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.start-button{
    border:0;

    padding:
        16px 25px;

    background:white;

    color:#05080d;

    font:
        800 11px Arial;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 30px
        rgba(255,255,255,.18);
}

.start-button:active{
    transform:scale(.96);
}

.error{
    display:none;

    margin-top:15px;

    color:
        rgba(255,255,255,.6);

    font-size:11px;

    line-height:1.5;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        15px
        20px
        max(24px,env(safe-area-inset-bottom));

    color:
        rgba(255,255,255,.5);

    font:9px monospace;

    letter-spacing:.08em;
}

.hint{
    display:flex;
    align-items:center;
    gap:8px;
}

.line{
    width:23px;
    height:1px;

    background:white;

    box-shadow:
        0 0 8px white;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .stage{
        max-width:430px;

        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }

}

</style>
</head>

<body>

<main class="stage">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="skeleton"></canvas>

    <div class="overlay"></div>


    <header class="top">

        <div class="logo">

            <span class="logo-dot"></span>

            HANDLIGHT

        </div>

        <div
            id="status"
            class="status">

            CAMERA OFF

        </div>

    </header>


    <!-- START -->

    <section
        id="start"
        class="start">

        <div class="start-content">

            <div class="camera-icon">

                <span></span>

            </div>

            <p class="eyebrow">
                HANDLIGHT
            </p>

            <h1>
                Khung xương<br>
                bàn tay
            </h1>

            <p class="desc">

                Đưa hai bàn tay vào camera.
                Hệ thống sẽ theo dõi từng
                khớp ngón tay theo thời gian thực.

            </p>

            <button
                id="startButton"
                class="start-button">

                BẬT CAMERA

            </button>

            <div
                id="error"
                class="error">
            </div>

        </div>

    </section>


    <div class="bottom">

        <div class="hint">

            <span class="line"></span>

            <span id="hint">
                CHỜ BÀN TAY
            </span>

        </div>

        <div id="gesture">
            READY
        </div>

    </div>

</main>


<!-- MEDIAPIPE -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("skeleton");

const ctx =
    canvas.getContext("2d");

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");

const hint =
    document.getElementById("hint");

const gesture =
    document.getElementById("gesture");


/* =====================================================
   CANVAS SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;


function resize(){

    W =
        canvas.clientWidth;

    H =
        canvas.clientHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;


/* =====================================================
   21 KHỚP XƯƠNG BÀN TAY
=====================================================

   0  = cổ tay

   NGÓN CÁI
   1  2  3  4

   NGÓN TRỎ
   5  6  7  8

   NGÓN GIỮA
   9  10 11 12

   NGÓN ÁP ÚT
   13 14 15 16

   NGÓN ÚT
   17 18 19 20

===================================================== */


/* =====================================================
   CÁC ĐƯỜNG XƯƠNG
===================================================== */

const connections = [

    /* CỔ TAY -> NGÓN TRỎ */

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* CỔ TAY -> NGÓN TRỎ */

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* CỔ TAY -> NGÓN GIỮA */

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    /* CỔ TAY -> NGÓN ÁP ÚT */

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    /* CỔ TAY -> NGÓN ÚT */

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    /* LÒNG BÀN TAY */

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   ĐIỂM ĐẶC BIỆT
===================================================== */

const THUMB_TIP = 4;

const INDEX_TIP = 8;

const PINKY_TIP = 20;


/* =====================================================
   MÀU KHUNG XƯƠNG
===================================================== */

const boneColor =
    "rgba(255,255,255,.82)";

const jointColor =
    "rgba(255,255,255,.95)";


/* =====================================================
   SMOOTHING
===================================================== */

const SMOOTH = .42;


/*
   Lưu vị trí đã làm mượt
*/

let smoothedHands = [];


function smoothLandmarks(
    oldPoints,
    newPoints
){

    if(!oldPoints){

        return newPoints.map(
            p => ({
                x:p.x,
                y:p.y
            })
        );

    }


    return newPoints.map(
        (p,i) => {

            const old =
                oldPoints[i];

            if(!old){

                return {
                    x:p.x,
                    y:p.y
                };

            }

            return {

                x:
                    old.x +
                    (p.x-old.x) *
                    SMOOTH,

                y:
                    old.y +
                    (p.y-old.y) *
                    SMOOTH

            };

        }
    );

}


/* =====================================================
   CHUYỂN TỌA ĐỘ CAMERA -> CANVAS
===================================================== */

function convertPoint(p){

    return {

        /*
           Camera đang mirror
           nên canvas cũng mirror.
        */

        x:
            (1-p.x) * W,

        y:
            p.y * H

    };

}


/* =====================================================
   VẼ MỘT BÀN TAY
===================================================== */

function drawHand(
    landmarks,
    handNumber
){

    /*
       Chuyển toàn bộ 21 điểm
       sang tọa độ màn hình.
    */

    const points =
        landmarks.map(
            convertPoint
        );


    /* =================================================
       XÁC ĐỊNH MÀU
    ================================================= */

    /*
       Tay trái / tay phải
       dùng cùng màu để nhìn
       giống khung xương thật.
    */

    ctx.save();


    /* =================================================
       VẼ XƯƠNG
    ================================================= */

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    for(
        const connection
        of connections
    ){

        const a =
            points[
                connection[0]
            ];

        const b =
            points[
                connection[1]
            ];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        /*
           Đường xương nhỏ.
        */

        ctx.strokeStyle =
            boneColor;

        ctx.lineWidth =
            1.25;

        ctx.shadowColor =
            "rgba(255,255,255,.45)";

        ctx.shadowBlur =
            4;

        ctx.stroke();

    }


    /* =================================================
       VẼ TỪNG KHỚP
    ================================================= */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];


        /*
           Điểm đầu ngón
           hơi lớn hơn.
        */

        const isTip =
            i === 4 ||
            i === 8 ||
            i === 12 ||
            i === 16 ||
            i === 20;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,

            isTip
                ? 3
                : 2,

            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            jointColor;

        ctx.shadowColor =
            "white";

        ctx.shadowBlur =
            isTip
                ? 8
                : 4;

        ctx.fill();

    }


    /* =================================================
       ĐÁNH DẤU NGÓN CÁI
    ================================================= */

    drawSpecialPoint(
        points[THUMB_TIP],
        "THUMB"
    );


    /* =================================================
       ĐÁNH DẤU NGÓN TRỎ
    ================================================= */

    drawSpecialPoint(
        points[INDEX_TIP],
        "INDEX"
    );


    /* =================================================
       ĐÁNH DẤU NGÓN ÚT
    ================================================= */

    drawSpecialPoint(
        points[PINKY_TIP],
        "PINKY"
    );


    ctx.restore();

}


/* =====================================================
   ĐIỂM ĐẶC BIỆT
===================================================== */

function drawSpecialPoint(
    p,
    type
){

    /*
       Vòng tròn rất nhỏ.
       Không tạo glow to.
    */

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        5,
        0,
        Math.PI*2
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.75)";

    ctx.lineWidth =
        1;


    ctx.shadowColor =
        "rgba(255,255,255,.5)";

    ctx.shadowBlur =
        6;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   NHẬN DIỆN TAY
===================================================== */

function processResults(
    result
){

    const detected =
        result.multiHandLandmarks || [];


    /*
       Không có tay
    */

    if(
        detected.length === 0
    ){

        smoothedHands = [];

        hint.textContent =
            "ĐƯA BÀN TAY VÀO";

        gesture.textContent =
            "WAITING";

        return;

    }


    /*
       Tối đa 2 tay
    */

    const handsNow =
        detected.slice(0,2);


    /*
       Làm mượt từng bàn tay
    */

    const output = [];


    for(
        let i=0;
        i<handsNow.length;
        i++
    ){

        const current =
            handsNow[i];


        const previous =
            smoothedHands[i];


        const smooth =
            smoothLandmarks(
                previous,
                current
            );


        output.push(
            smooth
        );

    }


    smoothedHands =
        output;


    /*
       Hiện khung xương
    */

    for(
        let i=0;
        i<output.length;
        i++
    ){

        drawHand(
            output[i],
            i
        );

    }


    /*
       Trạng thái
    */

    if(
        output.length === 1
    ){

        hint.textContent =
            "ĐÃ THẤY 1 BÀN TAY";

        gesture.textContent =
            "1 HAND";

    }
    else{

        hint.textContent =
            "ĐÃ THẤY 2 BÀN TAY";

        gesture.textContent =
            "2 HANDS";

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(result){

    /*
       Xóa frame cũ
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    processResults(
        result
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking)
        return;


    const now =
        performance.now();


    /*
       Khoảng 24 FPS.
    */

    if(
        hands &&
        video.readyState >= 2 &&
        now-lastSend >= 42
    ){

        lastSend =
            now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.log(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    if(
        !window.Hands
    ){

        showError(
            "Không tải được hệ thống nhận diện bàn tay."
        );

        return;

    }


    hands =
        new Hands({

            locateFile:
                file =>
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    + file

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.6,

        minTrackingConfidence:.6

    });


    hands.onResults(
        onResults
    );


    tracking =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    text
){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        text;

    startButton.disabled =
        false;

}


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
        true;

    errorBox.style.display =
        "none";

    status.textContent =
        "ĐANG XIN QUYỀN";


    /*
       Camera bắt buộc HTTPS
    */

    if(
        !window.isSecureContext
    ){

        showError(
            "Website phải chạy bằng HTTPS hoặc GitHub Pages."
        );

        status.textContent =
            "HTTPS ERROR";

        return;

    }


    /*
       Kiểm tra browser
    */

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "Trình duyệt không hỗ trợ Camera."
        );

        return;

    }


    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:"user"
                        },

                        width:{
                            ideal:640
                        },

                        height:{
                            ideal:480
                        },

                        frameRate:{
                            ideal:24,
                            max:30
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        /*
           Ẩn màn hình bắt đầu
        */

        start.classList.add(
            "hide"
        );


        status.textContent =
            "HAND TRACKING";


        resize();


        /*
           Bắt đầu nhận diện
        */

        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        status.textContent =
            "CAMERA ERROR";


        startButton.disabled =
            false;


        if(
            error.name ===
            "NotAllowedError"
        ){

            showError(
                "Camera đang bị chặn. Hãy cho phép Camera rồi tải lại trang."
            );

        }

        else if(
            error.name ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera."
            );

        }

        else if(
            error.name ===
            "NotReadableError"
        ){

            showError(
                "Camera đang được chương trình khác sử dụng."
            );

        }

        else{

            showError(
                "Không thể mở Camera: "
                + error.message
            );

        }

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        tracking =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>

</body>
</html>
