<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* CAMERA */
#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;
    filter:
        brightness(.82)
        contrast(1.05)
        saturate(1.05);
}

/* CANVAS */
#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:10;
    pointer-events:none;
}

/* START */
#startScreen{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#02040a;
    color:white;
    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:16px;
}

.startBox p{
    color:rgba(255,255,255,.62);
    font-size:14px;
    line-height:1.7;
}

#startButton{
    margin-top:25px;
    padding:16px 30px;
    border:0;
    border-radius:10px;
    background:white;
    color:#02040a;
    font-weight:800;
    font-size:11px;
    letter-spacing:.15em;
    cursor:pointer;
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:14px;
    color:#ff6578;
    font-size:12px;
}

/* DARK UI */
#darkUI{
    position:absolute;
    inset:0;
    z-index:20;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.48);

    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
}

/* MAIN PANEL */
#panel{
    position:relative;

    width:min(86vw,430px);
    min-height:330px;

    padding:38px 24px 28px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,24,35,.90),
            rgba(3,5,12,.90)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);

    text-align:center;

    transform:scale(.96);
    opacity:0;

    transition:
        transform .35s ease,
        opacity .35s ease;
}

#darkUI.active #panel{
    transform:scale(1);
    opacity:1;
}

#panelTitle{
    color:white;
    font-size:24px;
    font-weight:800;
    letter-spacing:-.03em;
}

#panelSub{
    margin-top:8px;
    color:rgba(255,255,255,.45);
    font-size:12px;
}

/* SOCIAL BUTTONS */
.socialGrid{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:35px;
}

.socialButton{
    position:relative;

    height:105px;

    border-radius:20px;

    border:1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.socialButton.active{
    transform:scale(1.08);

    background:
        rgba(255,255,255,.14);

    box-shadow:
        0 0 30px
        rgba(255,255,255,.12);
}

.socialIcon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:rgba(255,255,255,.10);

    font-size:25px;
    font-weight:900;
}

.socialName{
    margin-top:9px;
    font-size:10px;
    color:rgba(255,255,255,.7);
}

/* HOME */
#homeButton{
    margin-top:25px;

    width:100%;
    height:45px;

    border-radius:12px;

    border:1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color:white;

    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
}

/* POINTER */
#pointer{
    position:absolute;

    width:22px;
    height:22px;

    margin-left:-11px;
    margin-top:-11px;

    border-radius:50%;

    border:2px solid white;

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(0,234,255,.8);

    z-index:50;

    pointer-events:none;

    opacity:0;

    transform:scale(.75);

    transition:
        opacity .15s,
        transform .15s;
}

#pointer.show{
    opacity:1;
    transform:scale(1);
}

/* LOADING */
#loading{
    position:absolute;
    inset:0;

    z-index:60;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.20);

    pointer-events:none;
}

.loaderBox{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.loader{
    width:75px;
    height:75px;

    border-radius:50%;

    border:3px solid
        rgba(255,255,255,.12);

    border-top-color:white;

    animation:
        spin .8s linear infinite;
}

#loadingText{
    margin-top:15px;

    color:white;

    font-size:11px;
    letter-spacing:.12em;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* INSTRUCTION */
#hint{
    position:absolute;

    left:0;
    right:0;
    bottom:25px;

    z-index:30;

    text-align:center;

    color:rgba(255,255,255,.75);

    font-size:12px;

    text-shadow:
        0 2px 12px black;

    pointer-events:none;
}

/* MOBILE */
@media(max-width:600px){

    #panel{
        width:88vw;
        min-height:315px;
    }

    .socialGrid{
        gap:10px;
    }

    .socialButton{
        height:95px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- CAMERA -->
    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <!-- TRACKING CANVAS -->
    <canvas id="canvas"></canvas>

    <!-- POINTER -->
    <div id="pointer"></div>

    <!-- HINT -->
    <div id="hint">
        GIƠ NGÓN TRỎ LÊN ĐỂ MỞ MENU
    </div>

    <!-- LOADING -->
    <div id="loading">

        <div class="loaderBox">

            <div class="loader"></div>

            <div id="loadingText">
                ĐANG NHẬN DIỆN...
            </div>

        </div>

    </div>

    <!-- DARK UI -->
    <div id="darkUI">

        <div id="panel">

            <div id="panelTitle">
                HANDLIGHT
            </div>

            <div id="panelSub">
                Di chuyển ngón trỏ để chọn
            </div>

            <div class="socialGrid">

                <div
                    class="socialButton"
                    data-name="Facebook"
                    data-url="https://www.facebook.com">

                    <div class="socialIcon">
                        f
                    </div>

                    <div class="socialName">
                        FACEBOOK
                    </div>

                </div>


                <div
                    class="socialButton"
                    data-name="TikTok"
                    data-url="https://www.tiktok.com">

                    <div class="socialIcon">
                        ♪
                    </div>

                    <div class="socialName">
                        TIKTOK
                    </div>

                </div>


                <div
                    class="socialButton"
                    data-name="Instagram"
                    data-url="https://www.instagram.com">

                    <div class="socialIcon">
                        ◎
                    </div>

                    <div class="socialName">
                        INSTAGRAM
                    </div>

                </div>

            </div>

            <button id="homeButton">
                ← HOME
            </button>

        </div>

    </div>


    <!-- START -->
    <div id="startScreen">

        <div class="startBox">

            <h1>
                HANDLIGHT
            </h1>

            <p>
                Cho phép camera để bắt đầu.<br><br>

                Sau đó đưa một bàn tay vào camera
                và giơ ngón trỏ lên.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>
"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const darkUI =
    document.getElementById("darkUI");

const panel =
    document.getElementById("panel");

const pointer =
    document.getElementById("pointer");

const loading =
    document.getElementById("loading");

const hint =
    document.getElementById("hint");

const homeButton =
    document.getElementById("homeButton");

const buttons =
    [...document.querySelectorAll(".socialButton")];


/* =====================================================
   CANVAS SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   TRACKING
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;


/* =====================================================
   POINTER SMOOTHING
===================================================== */

let pointerX = W / 2;
let pointerY = H / 2;

let targetX = W / 2;
let targetY = H / 2;


/*
    Smoothing rất cao nhưng vẫn bám nhanh.
*/

const SMOOTHING = 0.42;


/* =====================================================
   MENU STATE
===================================================== */

let menuOpen = false;

let loadingStarted = false;

let gestureStart = 0;

let lastGesture = false;


/*
    Thời gian giữ ngón trỏ
    trước khi mở menu.
*/

const GESTURE_TIME = 650;


/* =====================================================
   TOUCH / HOVER
===================================================== */

let selectedButton = null;

let buttonHoverStart = 0;

const BUTTON_ACTIVATE_TIME = 180;


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* =====================================================
   SCREEN POINT

   Camera đang mirror nên đảo X.
===================================================== */

function screenPoint(p){

    return {
        x:(1 - p.x) * W,
        y:p.y * H
    };
}


/* =====================================================
   HAND SIZE
===================================================== */

function handSize(hand){

    return Math.max(
        distance(
            hand[0],
            hand[9]
        ),
        .0001
    );
}


/* =====================================================
   INDEX UP

   Kiểm tra ngón trỏ đang dựng lên.
===================================================== */

function isIndexUp(hand){

    const wrist = hand[0];

    const indexMCP = hand[5];

    const indexPIP = hand[6];

    const indexDIP = hand[7];

    const indexTIP = hand[8];


    /*
        Ngón trỏ phải cao hơn
        khớp MCP rõ ràng.
    */

    const vertical =
        indexTIP.y <
        indexPIP.y &&
        indexPIP.y <
        indexMCP.y;


    /*
        Khoảng cách đủ lớn
        để ngón trỏ thật sự duỗi.
    */

    const length =
        distance(
            indexTIP,
            indexMCP
        );


    const size =
        handSize(hand);


    const longEnough =
        length / size > .55;


    /*
        Các ngón còn lại
        phải tương đối cụp.
    */

    const middleClosed =
        hand[12].y >
        hand[10].y;

    const ringClosed =
        hand[16].y >
        hand[14].y;

    const pinkyClosed =
        hand[20].y >
        hand[18].y;


    return (
        vertical &&
        longEnough &&
        middleClosed &&
        ringClosed &&
        pinkyClosed
    );
}


/* =====================================================
   FALLBACK GESTURE

   Nếu camera góc khác,
   dùng điều kiện đơn giản hơn.
===================================================== */

function isIndexUpSimple(hand){

    const tip =
        hand[8];

    const pip =
        hand[6];

    const mcp =
        hand[5];

    const wrist =
        hand[0];


    return (
        tip.y < pip.y &&
        pip.y < mcp.y &&
        tip.y < wrist.y - .05
    );
}


/* =====================================================
   FINAL GESTURE
===================================================== */

function detectGesture(hand){

    return (
        isIndexUp(hand) ||
        isIndexUpSimple(hand)
    );
}


/* =====================================================
   POINTER TARGET
===================================================== */

function updatePointer(hand){

    const point =
        screenPoint(
            hand[8]
        );

    targetX = point.x;
    targetY = point.y;


    /*
        Smoothing theo frame.
    */

    pointerX +=
        (targetX - pointerX)
        * SMOOTHING;

    pointerY +=
        (targetY - pointerY)
        * SMOOTHING;


    pointer.style.left =
        pointerX + "px";

    pointer.style.top =
        pointerY + "px";


    pointer.classList.add("show");
}


/* =====================================================
   HIDE POINTER
===================================================== */

function hidePointer(){

    pointer.classList.remove(
        "show"
    );
}


/* =====================================================
   BUTTON HIT TEST
===================================================== */

function checkButtons(){

    if(!menuOpen){

        selectedButton = null;

        buttons.forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );

        return;
    }


    let found = null;


    for(
        const button of buttons
    ){

        const rect =
            button.getBoundingClientRect();


        /*
            Tăng vùng nhận diện
            xung quanh nút.
        */

        const padding = 22;


        if(
            pointerX >=
                rect.left - padding &&

            pointerX <=
                rect.right + padding &&

            pointerY >=
                rect.top - padding &&

            pointerY <=
                rect.bottom + padding
        ){

            found = button;

            break;
        }
    }


    buttons.forEach(
        b => {

            b.classList.toggle(
                "active",
                b === found
            );

        }
    );


    if(found !== selectedButton){

        selectedButton = found;

        buttonHoverStart =
            performance.now();

        return;
    }


    if(found){

        const now =
            performance.now();


        if(
            now -
            buttonHoverStart
            >=
            BUTTON_ACTIVATE_TIME
        ){

            activateButton(found);

            buttonHoverStart =
                now + 100000;

        }

    }

}


/* =====================================================
   ACTIVATE SOCIAL
===================================================== */

function activateButton(button){

    const url =
        button.dataset.url;


    /*
        Mở website sau khi
        ngón trỏ giữ nhẹ trên nút.
    */

    window.open(
        url,
        "_blank"
    );
}


/* =====================================================
   OPEN MENU
===================================================== */

function openMenu(){

    if(menuOpen)
        return;


    menuOpen = true;

    loading.style.display =
        "none";

    darkUI.style.display =
        "flex";


    requestAnimationFrame(
        () => {

            darkUI.classList.add(
                "active"
            );

        }
    );


    hint.textContent =
        "DI CHUYỂN NGÓN TRỎ ĐỂ CHỌN";


    hidePointer();

}


/* =====================================================
   CLOSE MENU
===================================================== */

function closeMenu(){

    menuOpen = false;

    darkUI.classList.remove(
        "active"
    );


    setTimeout(
        () => {

            if(!menuOpen){

                darkUI.style.display =
                    "none";

            }

        },
        300
    );


    buttons.forEach(
        b =>
            b.classList.remove(
                "active"
            )
    );


    selectedButton = null;

    buttonHoverStart = 0;

    hint.textContent =
        "GIƠ NGÓN TRỎ LÊN ĐỂ MỞ MENU";
}


/* =====================================================
   START LOADING
===================================================== */

function startGestureLoading(){

    if(loadingStarted)
        return;


    loadingStarted = true;

    loading.style.display =
        "flex";

    gestureStart =
        performance.now();

    hint.textContent =
        "GIỮ NGÓN TRỎ LÊN...";
}


/* =====================================================
   CANCEL LOADING
===================================================== */

function cancelGestureLoading(){

    loadingStarted = false;

    loading.style.display =
        "none";

    gestureStart = 0;

    hint.textContent =
        "GIƠ NGÓN TRỎ LÊN ĐỂ MỞ MENU";
}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(detected){

    /*
        Không có tay.
    */

    if(
        !detected ||
        detected.length === 0
    ){

        if(
            loadingStarted
        ){

            cancelGestureLoading();

        }

        hidePointer();

        lastGesture = false;

        return;
    }


    /*
        Lấy bàn tay lớn nhất.
    */

    let hand =
        detected[0];


    if(
        detected.length > 1
    ){

        const sizeA =
            handSize(
                detected[0]
            );

        const sizeB =
            handSize(
                detected[1]
            );


        if(sizeB > sizeA){

            hand =
                detected[1];

        }

    }


    /*
        Nếu menu đang mở:
        dùng ngón trỏ làm pointer.
    */

    if(menuOpen){

        updatePointer(hand);

        checkButtons();

        return;
    }


    /*
        Nhận diện gesture.
    */

    const gesture =
        detectGesture(hand);


    if(gesture){

        /*
            Gesture vừa bắt đầu.
        */

        if(!lastGesture){

            startGestureLoading();

        }


        lastGesture = true;


        /*
            Nếu giữ đủ lâu.
        */

        if(
            loadingStarted &&
            performance.now()
            -
            gestureStart
            >=
            GESTURE_TIME
        ){

            openMenu();

        }

    }
    else{

        if(lastGesture){

            cancelGestureLoading();

        }

        lastGesture = false;

    }

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(results){

    /*
        Canvas được clear liên tục.
        Không vẽ skeleton.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    processHands(
        detected
    );
}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    hands =
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +
                    file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.5,

        minTrackingConfidence:.55

    });


    hands.onResults(
        onResults
    );


    tracking = true;


    requestAnimationFrame(
        trackingLoop
    );
}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking)
        return;


    const now =
        performance.now();


    if(
        now - lastSend >= 30 &&
        video.readyState >= 2
    ){

        lastSend = now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;

    errorBox.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy mở bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;
    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(error);


        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message ||
                "Unknown error"
            );


        startButton.disabled =
            false;

    }

}


/* =====================================================
   HOME BUTTON
===================================================== */

homeButton.addEventListener(
    "click",
    function(){

        closeMenu();

    }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        tracking = false;


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>

</body>
</html>
