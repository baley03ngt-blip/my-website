<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* ================= CAMERA ================= */

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.82)
        contrast(1.05)
        saturate(1.05);
}

/* ================= CANVAS ================= */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}

/* ================= DEBUG ================= */

#debug{

    position:absolute;

    top:12px;
    left:12px;

    z-index:30;

    width:320px;

    padding:13px 15px;

    background:
        rgba(0,0,0,.62);

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:10px;

    color:white;

    font:
        11px/1.8
        Consolas,
        monospace;

    backdrop-filter:blur(12px);
}

.debugTitle{

    margin-bottom:5px;

    color:#4de4ff;

    font-weight:bold;

    letter-spacing:.08em;
}

.ok{
    color:#59e889;
}

.no{
    color:#ff6578;
}

.wait{
    color:#ffe45b;
}

/* ================= STATUS ================= */

#windowStatus{

    position:absolute;

    top:12px;
    right:12px;

    z-index:30;

    padding:9px 12px;

    border-radius:8px;

    background:
        rgba(0,0,0,.62);

    color:#ff6578;

    font:
        bold 10px
        Consolas,
        monospace;
}

/* ================= FILTER ================= */

#filterName{

    position:absolute;

    left:50%;
    bottom:58px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 16px;

    border-radius:20px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(255,255,255,.18);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity .25s;
}

/* ================= INSTRUCTION ================= */

#instruction{

    position:absolute;

    left:0;
    right:0;

    bottom:18px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px #000;
}

/* ================= START ================= */

#startScreen{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#02040a;

    color:white;

    text-align:center;
}

.startBox{

    width:min(88vw,420px);
}

.startBox h1{

    font-size:42px;

    letter-spacing:-.05em;

    margin-bottom:15px;
}

.startBox p{

    color:
        rgba(255,255,255,.6);

    font-size:14px;

    line-height:1.65;
}

#startButton{

    margin-top:25px;

    padding:16px 28px;

    border:0;

    border-radius:3px;

    background:white;

    color:#02040a;

    font-weight:800;

    font-size:11px;

    letter-spacing:.15em;

    cursor:pointer;
}

#startButton:active{

    transform:scale(.96);
}

#error{

    margin-top:14px;

    color:#ff6578;

    font-size:12px;

    line-height:1.5;
}

@media(max-width:600px){

    #debug{

        width:285px;

        font-size:9px;
    }

    #windowStatus{

        font-size:8px;
    }
}

</style>
</head>

<body>

<div id="app">

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>


<!-- ================= DEBUG ================= -->

<div id="debug">

    <div class="debugTitle">
        HANDLIGHT TRACKING
    </div>

    <div id="count">
        HAI TAY: ---
    </div>

    <div id="leftInfo">
        TAY TRÁI: ---
    </div>

    <div id="rightInfo">
        TAY PHẢI: ---
    </div>

    <div id="gestureInfo">
        GESTURE: ---
    </div>

    <div id="colorInfo">
        COLOR: RAINBOW
    </div>

</div>


<!-- ================= WINDOW STATUS ================= -->

<div id="windowStatus">
    WINDOW: OFF
</div>


<!-- ================= FILTER NAME ================= -->

<div id="filterName">
    RAINBOW
</div>


<!-- ================= INSTRUCTION ================= -->

<div id="instruction">
    ĐƯA HAI BÀN TAY VÀO CAMERA
</div>


<!-- ================= START ================= -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            HANDLIGHT
        </h1>

        <p>

            Đưa hai bàn tay vào camera.

            <br><br>

            Chạm
            <b>ngón trỏ + ngón cái</b>
            ở cả hai tay để mở khung.

            <br><br>

            Sau đó chạm
            <b>ngón út + ngón cái</b>
            ở cả hai tay để đổi màu.

        </p>

        <button id="startButton">
            BẬT CAMERA
        </button>

        <div id="error"></div>

    </div>

</div>

</div>


<!-- ================= MEDIAPIPE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const countInfo =
    document.getElementById("count");

const leftInfo =
    document.getElementById("leftInfo");

const rightInfo =
    document.getElementById("rightInfo");

const gestureInfo =
    document.getElementById("gestureInfo");

const colorInfo =
    document.getElementById("colorInfo");

const windowStatus =
    document.getElementById("windowStatus");

const instruction =
    document.getElementById("instruction");

const filterName =
    document.getElementById("filterName");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   HAND SKELETON
===================================================== */

const BONES = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   7 BỘ MÀU
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",
        colors:[
            "#ff0055",
            "#ff7700",
            "#fff000",
            "#00ff77",
            "#00eaff",
            "#3970ff",
            "#c000ff"
        ]
    },

    {
        name:"AURORA",
        colors:[
            "#00fff0",
            "#00ff9d",
            "#66ff00",
            "#00aaff",
            "#7700ff",
            "#ff00dd"
        ]
    },

    {
        name:"NEON DREAM",
        colors:[
            "#ff007f",
            "#ff00ff",
            "#8000ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",
        colors:[
            "#1600ff",
            "#6500ff",
            "#bd00ff",
            "#ff00aa",
            "#ff0055",
            "#00d5ff"
        ]
    },

    {
        name:"SUNSET",
        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9900",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",
        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",
        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;


/* =====================================================
   COLOR STATE
===================================================== */

let colorGestureHeld = false;

let lastFilterChange = 0;

const COLOR_COOLDOWN = 700;


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;


/* =====================================================
   WINDOW POINTS
===================================================== */

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   MIRROR POINT
===================================================== */

function screenPoint(p){

    return {

        x:(1 - p.x) * W,

        y:p.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function handSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.001

    );

}


/* =====================================================
   INDEX + THUMB
===================================================== */

function indexThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[8]
        )

        /

        handSize(hand)

    );

}


/*
    Ngưỡng chạm trỏ + cái.

    Nếu camera nhận quá khó:
    tăng 0.55 -> 0.60

    Nếu nhận nhầm:
    giảm 0.55 -> 0.50
*/

function indexThumbTouch(hand){

    return (

        indexThumbRatio(hand)
        < 0.55

    );

}


/* =====================================================
   PINKY + THUMB
===================================================== */

function pinkyThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[20]
        )

        /

        handSize(hand)

    );

}


/*
    Ngưỡng út + cái.

    Chỉ READY khi thật sự
    đưa út về gần cái.
*/

function pinkyThumbTouch(hand){

    return (

        pinkyThumbRatio(hand)
        < 0.72

    );

}


/* =====================================================
   DRAW SKELETON
===================================================== */

function drawSkeleton(hand){

    const points =
        hand.map(screenPoint);

    ctx.save();

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /* BONE */

    for(const bone of BONES){

        const a =
            points[bone[0]];

        const b =
            points[bone[1]];

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.65)";

        ctx.lineWidth =
            1.4;

        ctx.shadowColor =
            "rgba(255,255,255,.5)";

        ctx.shadowBlur =
            4;

        ctx.stroke();

    }


    /* JOINTS */

    for(let i=0;i<points.length;i++){

        const p =
            points[i];

        const tip =
            (
                i === 4 ||
                i === 8 ||
                i === 12 ||
                i === 16 ||
                i === 20
            );

        ctx.beginPath();

        ctx.arc(

            p.x,
            p.y,

            tip ? 3.8 : 2.1,

            0,
            Math.PI * 2

        );

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur =
            tip ? 8 : 3;

        ctx.fill();

    }

    ctx.restore();

}


/* =====================================================
   TOUCH INDICATOR
===================================================== */

function drawIndexTouch(
    hand,
    touching
){

    const thumb =
        screenPoint(hand[4]);

    const index =
        screenPoint(hand[8]);

    const color =
        touching
        ? "#59e889"
        : "#00eaff";

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        thumb.x,
        thumb.y
    );

    ctx.lineTo(
        index.x,
        index.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        touching ? 3 : 1;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        touching ? 16 : 6;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   WINDOW TARGET
===================================================== */

function setWindowTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(left[8]);

    targetPoints.tr =
        screenPoint(right[8]);

    targetPoints.br =
        screenPoint(right[4]);

    targetPoints.bl =
        screenPoint(left[4]);

}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );

    for(const key of [
        "tl",
        "tr",
        "br",
        "bl"
    ]){

        windowPoints[key] =
            {
                ...targetPoints[key]
            };

    }

    windowOpen =
        true;

    windowStatus.textContent =
        "WINDOW: ON";

    windowStatus.style.color =
        "#59e889";

    filterName.textContent =
        FILTERS[filterIndex].name;

    filterName.style.opacity =
        "1";

    instruction.textContent =
        "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );

    const smooth =
        0.45;

    for(const key of [
        "tl",
        "tr",
        "br",
        "bl"
    ]){

        windowPoints[key].x +=
            (
                targetPoints[key].x -
                windowPoints[key].x
            ) * smooth;

        windowPoints[key].y +=
            (
                targetPoints[key].y -
                windowPoints[key].y
            ) * smooth;

    }

}


/* =====================================================
   GRADIENT
===================================================== */

function makeGradient(){

    const p =
        windowPoints;

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;

    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;

    const colors =
        FILTERS[filterIndex].colors;

    const t =
        performance.now() * 0.0003;

    const moveX =
        Math.cos(t) *
        W * .35;

    const moveY =
        Math.sin(t * 1.3) *
        H * .35;

    const gradient =
        ctx.createLinearGradient(

            centerX - W * .8 + moveX,
            centerY - H * .6 + moveY,

            centerX + W * .8 - moveX,
            centerY + H * .6 - moveY

        );

    for(
        let i=0;
        i<colors.length;
        i++
    ){

        gradient.addColorStop(

            i / (colors.length - 1),

            colors[i]

        );

    }

    return gradient;

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen){
        return;
    }

    const p =
        windowPoints;


    /* CLIP */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /* COLOR */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .28;

    ctx.fillStyle =
        makeGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* LIGHT */

    ctx.globalAlpha =
        .12;

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;

    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;

    const glow =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H) * .7

        );

    glow.addColorStop(
        0,
        "rgba(255,255,255,.18)"
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.restore();


    /* BORDER */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        makeGradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /* WHITE INNER LINE */

    ctx.shadowBlur =
        5;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth =
        1.2;

    ctx.stroke();

    ctx.restore();


    /* CORNERS */

    for(const key of [
        "tl",
        "tr",
        "br",
        "bl"
    ]){

        const point =
            p[key];

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            point.x,
            point.y,
            4.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            "#00eaff";

        ctx.shadowBlur =
            14;

        ctx.fill();

        ctx.restore();

    }

}


/* =====================================================
   NEXT FILTER
===================================================== */

function nextFilter(){

    const now =
        performance.now();

    if(
        now - lastFilterChange <
        COLOR_COOLDOWN
    ){
        return;
    }

    lastFilterChange =
        now;

    filterIndex++;

    if(
        filterIndex >= FILTERS.length
    ){

        filterIndex = 0;

    }

    const filter =
        FILTERS[filterIndex];

    filterName.textContent =
        filter.name;

    colorInfo.innerHTML =
        "COLOR: <span class='ok'>" +
        filter.name +
        "</span>";

    filterName.style.opacity =
        "1";

    clearTimeout(
        nextFilter.timer
    );

    nextFilter.timer =
        setTimeout(
            function(){

                filterName.style.opacity =
                    "0";

            },
            1200
        );

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    /* ================= 0 HAND ================= */

    if(
        detected.length === 0
    ){

        countInfo.innerHTML =
            "HAI TAY: <span class='no'>0 / 2</span>";

        leftInfo.textContent =
            "TAY TRÁI: ---";

        rightInfo.textContent =
            "TAY PHẢI: ---";

        gestureInfo.textContent =
            "GESTURE: WAITING";

        instruction.textContent =
            "ĐƯA HAI BÀN TAY VÀO CAMERA";

        return;

    }


    /* ================= DRAW SKELETON ================= */

    for(
        const hand of detected
    ){

        drawSkeleton(hand);

    }


    /* ================= 1 HAND ================= */

    if(
        detected.length === 1
    ){

        countInfo.innerHTML =
            "HAI TAY: <span class='wait'>1 / 2</span>";

        leftInfo.textContent =
            "TAY TRÁI: ---";

        rightInfo.textContent =
            "TAY PHẢI: ---";

        gestureInfo.textContent =
            "GESTURE: WAITING";

        instruction.textContent =
            "ĐƯA BÀN TAY THỨ HAI VÀO";

        return;

    }


    /* ================= 2 HANDS ================= */

    const handA =
        detected[0];

    const handB =
        detected[1];


    const xA =
        screenPoint(handA[9]).x;

    const xB =
        screenPoint(handB[9]).x;


    let left;
    let right;


    if(xA < xB){

        left =
            handA;

        right =
            handB;

    }
    else{

        left =
            handB;

        right =
            handA;

    }


    /* ================= GESTURES ================= */

    const leftIndex =
        indexThumbTouch(left);

    const rightIndex =
        indexThumbTouch(right);

    const leftPinky =
        pinkyThumbTouch(left);

    const rightPinky =
        pinkyThumbTouch(right);


    /* ================= DEBUG ================= */

    countInfo.innerHTML =
        "HAI TAY: <span class='ok'>2 / 2</span>";


    leftInfo.innerHTML =
        "TRÁI — TRỎ+CÁI: " +

        (
            leftIndex

            ?

            "<span class='ok'>TOUCH</span>"

            :

            "<span class='no'>OPEN</span>"
        )

        +

        " | ÚT+CÁI: "

        +

        (
            leftPinky

            ?

            "<span class='ok'>READY</span>"

            :

            "<span class='no'>OPEN</span>"
        );


    rightInfo.innerHTML =
        "PHẢI — TRỎ+CÁI: " +

        (
            rightIndex

            ?

            "<span class='ok'>TOUCH</span>"

            :

            "<span class='no'>OPEN</span>"
        )

        +

        " | ÚT+CÁI: "

        +

        (
            rightPinky

            ?

            "<span class='ok'>READY</span>"

            :

            "<span class='no'>OPEN</span>"
        );


    /* ================= INDEX TOUCH VISUAL ================= */

    drawIndexTouch(
        left,
        leftIndex
    );

    drawIndexTouch(
        right,
        rightIndex
    );


    /* ================= OPEN WINDOW ================= */

    if(!windowOpen){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );

            gestureInfo.innerHTML =
                "GESTURE: <span class='ok'>WINDOW OPEN</span>";

        }
        else{

            gestureInfo.innerHTML =
                "GESTURE: <span class='wait'>TRỎ + CÁI Ở 2 TAY</span>";

        }

        return;

    }


    /* ================= UPDATE WINDOW ================= */

    updateWindow(
        left,
        right
    );


    /* ================= COLOR ================= */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if(bothPinky){

        if(!colorGestureHeld){

            nextFilter();

            colorGestureHeld =
                true;

            gestureInfo.innerHTML =
                "GESTURE: <span class='ok'>COLOR CHANGED</span>";

            instruction.textContent =
                "🌈 ĐÃ ĐỔI MÀU — MỞ ÚT RA RỒI CHẠM LẠI";

        }
        else{

            gestureInfo.innerHTML =
                "GESTURE: <span class='ok'>ÚT+CÁI — GIỮ</span>";

        }

    }
    else{

        colorGestureHeld =
            false;

        gestureInfo.innerHTML =
            "GESTURE: <span class='ok'>WINDOW ACTIVE</span>";

        instruction.textContent =
            "ÚT + CÁI 2 TAY = ĐỔI MÀU";

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(results){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const detected =
        results.multiHandLandmarks || [];

    processHands(
        detected
    );

    drawWindow();

}


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking =
    false;

let lastSend =
    0;


async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands"
        );

    }


    hands =
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +
                    file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.5,

        minTrackingConfidence:.5

    });


    hands.onResults(
        onResults
    );


    tracking =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking){
        return;
    }


    const now =
        performance.now();


    if(
        now - lastSend >= 33 &&
        video.readyState >= 2
    ){

        lastSend =
            now;

        try{

            await hands.send({

                image:video

            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;

    errorBox.textContent =
        "";


    if(!window.isSecureContext){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(error);

        errorBox.textContent =
            "Không mở được camera: " +
            (
                error.message ||
                "Unknown error"
            );

        startButton.disabled =
            false;

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        tracking =
            false;

        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }

    }
);

</script>
