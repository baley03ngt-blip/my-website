<body>

<div id="login">
    <h2>🔒 Nhập mật khẩu</h2>

    <input type="password" id="password" placeholder="Nhập mật khẩu">

    <button onclick="checkPassword()">Đăng nhập</button>
</div>

<div id="website">
    <h1>Website của tôi</h1>
    <p>Xin chào!</p>
</div>

</body>
<head>
    <style>
    #website {
        display: none;
    }
</style>    
<body>
    <script>
function checkPassword() {
    let password = document.getElementById("password").value;

    if (password === "123") {
        document.getElementById("login").style.display = "none";
        document.getElementById("website").style.display = "block";
    } else {
        alert("Sai mật khẩu!");
    }
}
</script>
<head>
    <style>
        #login {
    text-align: center;
    margin-top: 150px;
}
#login input {
    padding: 12px;
    width: 80%;
    max-width: 250px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
#login button {
    padding: 12px 20px;
    margin-left: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
