<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<meta name="theme-color" content="#050b10">

<title>Handlight v2</title>

<style>
:root{
    --bg:#050b10;
    --white:#f5f8ef;
    --muted:rgba(245,248,239,.65);
    --lime:#d9fa68;
    --cyan:#69e8dd;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
}

body{
    color:var(--white);
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#050b10;
}

/* CAMERA */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#050b10;

    filter:
        brightness(.82)
        contrast(1.04)
        saturate(.92);

    z-index:0;
}

/* EFFECT CANVAS */

#effects{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* CAMERA OVERLAY */

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.12) 65%,
            rgba(0,0,0,.58) 100%
        );

}

/* TOP BAR */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:5;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        max(22px,env(safe-area-inset-top))
        20px
        15px;

    font-family:monospace;
    font-size:10px;

    letter-spacing:.14em;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;

    font-weight:bold;
}

.logo-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--lime);

    box-shadow:
        0 0 12px var(--lime),
        0 0 25px rgba(217,250,104,.45);
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    color:var(--muted);
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#e1a44e;
}

.status-dot.live{
    background:var(--lime);

    box-shadow:
        0 0 10px var(--lime);
}

/* START SCREEN */

.start-screen{
    position:absolute;

    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at center,
            rgba(105,232,221,.06),
            transparent 45%
        ),
        #050b10;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

.start-screen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.card{
    width:min(90vw,390px);

    text-align:center;
}

.camera-icon{
    width:68px;
    height:68px;

    margin:0 auto 28px;

    border:
        1px solid
        rgba(217,250,104,.5);

    border-radius:50%;

    display:grid;
    place-items:center;

    box-shadow:
        0 0 35px
        rgba(217,250,104,.12);

    animation:
        iconPulse 2.5s ease-in-out infinite;
}

.camera-icon span{
    width:22px;
    height:29px;

    border:
        2px solid
        var(--lime);

    border-radius:
        13px 13px 9px 9px;

    position:relative;
}

.camera-icon span:after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--lime);

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 12px var(--lime);
}

@keyframes iconPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

.eyebrow{
    margin:0 0 13px;

    color:var(--lime);

    font-family:monospace;

    font-size:10px;

    letter-spacing:.2em;
}

h1{
    margin:0;

    font-size:
        clamp(29px,8vw,42px);

    line-height:1.05;

    letter-spacing:-.04em;
}

.description{
    max-width:320px;

    margin:17px auto 27px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.start-button{
    position:relative;

    border:0;

    padding:
        17px 25px;

    min-width:170px;

    color:#111b12;

    background:var(--lime);

    font:
        800 11px Arial,sans-serif;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 30px
        rgba(217,250,104,.2);

    transition:
        transform .2s,
        box-shadow .2s;
}

.start-button:active{
    transform:scale(.96);
}

.start-button:disabled{
    opacity:.55;
}

.error{
    margin-top:16px;

    color:rgba(245,248,239,.48);

    font-size:11px;

    line-height:1.5;

    display:none;
}

/* CENTER STATUS */

.center-status{
    position:absolute;

    left:50%;
    top:50%;

    z-index:4;

    transform:
        translate(-50%,-50%);

    text-align:center;

    pointer-events:none;

    opacity:0;

    transition:opacity .4s;
}

.center-status.show{
    opacity:1;
}

.center-ring{
    width:90px;
    height:90px;

    border:
        1px solid
        rgba(217,250,104,.35);

    border-radius:50%;

    animation:
        scanRing 2s linear infinite;
}

@keyframes scanRing{

    0%{
        transform:scale(.8);
        opacity:.2;
    }

    50%{
        transform:scale(1);
        opacity:.8;
    }

    100%{
        transform:scale(1.2);
        opacity:0;
    }

}

/* BOTTOM */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:5;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        15px 20px
        max(25px,env(safe-area-inset-bottom));

    font-family:monospace;

    font-size:9px;

    letter-spacing:.08em;

    color:rgba(245,248,239,.48);
}

.hint{
    display:flex;
    align-items:center;
    gap:9px;
}

.hint-line{
    width:24px;
    height:1px;

    background:var(--lime);

    box-shadow:
        0 0 8px var(--lime);
}

.gesture{
    text-align:right;
}

/* FLASH */

.flash{
    position:absolute;

    inset:0;

    z-index:8;

    background:white;

    opacity:0;

    pointer-events:none;
}

/* PERFORMANCE */

@media(max-width:500px){

    #camera{
        filter:
            brightness(.84)
            contrast(1.02)
            saturate(.9);
    }

}

@media(min-width:700px){

    .stage{
        max-width:430px;
        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }

}
</style>

<body>

<main class="stage">

    <!-- CAMERA -->
    <video
        id="camera"
        autoplay

        playsinline>
    </video>

    <!-- EFFECTS -->
    <canvas id="effects"></canvas>

    <!-- CAMERA OVERLAY -->

    <!-- FLASH -->

    <!-- TOP -->

            </div>

            </p>

            </span>

        </div>

    </div>

</main>


<!-- MEDIAPIPE -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

(() => {

"use strict";


/* ==========================
   ELEMENTS
========================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("effects");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const statusDot =
    document.getElementById("statusDot");

const errorBox =
    document.getElementById("error");

const description =
    document.getElementById("description");

const gesture =
    document.getElementById("gesture");

const hintText =
    document.getElementById("hintText");

const centerStatus =
    document.getElementById("centerStatus");

const flash =
    document.getElementById("flash");


/* ==========================
   VARIABLES
========================== */

let stream = null;

let hands = null;

let tracking = false;

let lastSend = 0;

let lastFlash = 0;

let particles = [];

let width = 0;

let height = 0;


/* ==========================
   PERFORMANCE SETTINGS
========================== */

/*
    45ms ≈ 22 FPS nhận diện.
    Nhẹ hơn rất nhiều so với việc
    gửi hình ảnh liên tục.
*/

const SEND_INTERVAL = 45;


/*
    Giới hạn particle.
*/

const MAX_PARTICLES = 90;


/* ==========================
   RESIZE
========================== */

function resize(){

    width =
        canvas.clientWidth;

    height =
        canvas.clientHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    canvas.width =
        Math.floor(
            width*dpr
        );

    canvas.height =
        Math.floor(
            height*dpr
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* ==========================
   SCREEN POINT
========================== */

function point(p){

    return {

        x:
            (1-p.x)*width,

        y:
            p.y*height

    };

}


/* ==========================
   DISTANCE
========================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* ==========================
   FINGER UP
========================== */

function fingerUp(
    hand,
    tip,
    joint
){

    return (
        hand[tip].y <
        hand[joint].y-.025
    );

}


/* ==========================
   PARTICLES
========================== */

function spawnParticles(
    p,
    amount,
    color
){

    if(
        particles.length >
        MAX_PARTICLES
    ){

        return;

    }


    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:p.x,

            y:p.y,

            vx:
                (Math.random()-.5)
                *1.2,

            vy:
                -Math.random()*1.3,

            life:1,

            size:
                1+
                Math.random()*2,

            color

        });

    }

}


/* ==========================
   DRAW PARTICLES
========================== */

function drawParticles(){

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .012;

        p.life -= .025;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);

            continue;

        }


        ctx.globalAlpha =
            p.life;


        ctx.fillStyle =
            p.color;


        ctx.shadowColor =
            p.color;

        ctx.shadowBlur =
            8;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* ==========================
   GLOW
========================== */

function glow(
    p,
    color,
    size=1
){

    const radius =
        14*size;


    const gradient =
        ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            radius*3
        );


    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        .2,
        color+"bb"
    );

    gradient.addColorStop(
        1,
        color+"00"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        color;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        16;


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        3*size,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur = 0;

}


/* ==========================
   FRAME
========================== */

function drawFrame(a,b){

    const left =
        Math.min(a.x,b.x);

    const right =
        Math.max(a.x,b.x);

    const top =
        Math.min(a.y,b.y);

    const bottom =
        Math.max(a.y,b.y);


    const w =
        right-left;

    const h =
        bottom-top;


    if(
        w<80 ||
        h<80
    ){

        return;

    }


    ctx.save();


    ctx.strokeStyle =
        "rgba(217,250,104,.9)";

    ctx.lineWidth = 1.5;

    ctx.shadowColor =
        "#d9fa68";

    ctx.shadowBlur = 14;

    ctx.setLineDash([
        4,
        8
    ]);


    ctx.strokeRect(
        left+18,
        top+18,
        w-36,
        h-36
    );


    ctx.restore();


    const center = {

        x:(left+right)/2,

        y:(top+bottom)/2

    };


    glow(
        center,
        "#69e8dd",
        Math.min(
            1.3,
            w/200
        )
    );


    spawnParticles(
        center,
        1,
        "#69e8dd"
    );


    if(
        performance.now()-lastFlash >
        900
    ){

        lastFlash =
            performance.now();

        triggerFlash();

    }

}


/* ==========================
   FLASH
========================== */

function triggerFlash(){

    flash.animate(
        [
            {
                opacity:0
            },
            {
                opacity:.18
            },
            {
                opacity:0
            }
        ],
        {
            duration:260,
            easing:"ease-out"
        }
    );

}


/* ==========================
   MEDIAPIPE RESULTS
========================== */

function results(result){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const detected =
        result.multiHandLandmarks || [];


    if(
        detected.length === 0
    ){

        gesture.textContent =
            "CHỜ BÀN TAY";

        hintText.textContent =
            "ĐƯA NGÓN TAY VÀO KHUNG HÌNH";

        drawParticles();

        return;

    }


    gesture.textContent =
        detected.length +
        " BÀN TAY";


    const handsScreen =
        detected.map(
            hand =>
                hand.map(point)
        );


    const tips =
        handsScreen.map(
            hand =>
                hand[8]
        );


    tips.forEach(
        (p,index) => {

            const hand =
                handsScreen[index];


            if(
                fingerUp(
                    hand,
                    8,
                    6
                )
            ){

                const color =
                    index===0
                    ? "#d9fa68"
                    : "#69e8dd";


                glow(
                    p,
                    color,
                    1
                );


                spawnParticles(
                    {
                        x:p.x,
                        y:p.y+4
                    },
                    1,
                    color
                );

            }

        }
    );


    /* TWO INDEX FINGERS */

    if(
        detected.length === 2
    ){

        const d =
            distance(
                tips[0],
                tips[1]
            );


        if(
            d <
            Math.min(
                width,
                height
            )*.22
        ){

            drawFrame(
                tips[0],
                tips[1]
            );


            hintText.textContent =
                "GIỮ HAI NGÓN TRỎ";

        }

    }


    drawParticles();

}


/* ==========================
   TRACKING
========================== */

async function trackingLoop(){

    if(!tracking){

        return;

    }


    const now =
        performance.now();


    if(
        hands &&
        video.readyState >= 2 &&
        now-lastSend >= SEND_INTERVAL
    ){

        lastSend = now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.warn(
                "Hand tracking:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* ==========================
   START MEDIAPIPE
========================== */

async function startTracking(){

    if(
        !window.Hands
    ){

        status.textContent =
            "CAMERA ĐANG CHẠY";

        gesture.textContent =
            "CAMERA OK";

        return;

    }


    try{

        hands =
            new Hands({

                locateFile:
                    file =>
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +file

            });


        hands.setOptions({

            /*
                1 hand mặc định
                giúp điện thoại nhẹ hơn.
            */

            maxNumHands:1,

            /*
                Model 0 nhẹ nhất.
            */

            modelComplexity:0,

            /*
                Confidence vừa phải
                để tăng tốc.
            */

            minDetectionConfidence:.55,

            minTrackingConfidence:.55

        });


        hands.onResults(
            results
        );


        tracking = true;

        requestAnimationFrame(
            trackingLoop
        );


    }
    catch(error){

        console.warn(
            "MediaPipe failed:",
            error
        );

        status.textContent =
            "CAMERA ĐANG CHẠY";

        gesture.textContent =
            "CAMERA OK";

    }

}


/* ==========================
   ERROR
========================== */

function showError(
    title,
    text
){

    description.innerHTML =
        "<b>"+title+"</b><br><br>"+text;


    errorBox.style.display =
        "block";


    errorBox.textContent =
        "Hãy kiểm tra quyền Camera của trình duyệt.";


    startButton.disabled =
        false;

}


/* ==========================
   CAMERA
========================== */

async function openCamera(){

    startButton.disabled =
        true;


    status.textContent =
        "ĐANG XIN QUYỀN";


    errorBox.style.display =
        "none";


    /* HTTPS */

    if(
        !window.isSecureContext
    ){

        showError(
            "Trang chưa chạy bằng HTTPS.",
            "Hãy mở website bằng link GitHub Pages hoặc HTTPS."
        );

        return;

    }


    /* API */

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "Thiết bị không hỗ trợ Camera.",
            "Hãy thử Chrome hoặc Safari mới nhất."
        );

        return;

    }


    try{

        /*
            CAMERA TRƯỚC
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:24,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        resize();


        /*
            CAMERA ĐÃ CHẠY
        */

        startScreen.classList.add(
            "hide"
        );


        centerStatus.classList.add(
            "show"
        );


        setTimeout(
            () =>
                centerStatus.classList.remove(
                    "show"
                ),
            900
        );


        status.textContent =
            "ĐANG THEO DÕI";


        statusDot.classList.add(
            "live"
        );


        await startTracking();


    }
    catch(error){

        console.error(
            error
        );


        status.textContent =
            "CAMERA LỖI";


        statusDot.classList.remove(
            "live"
        );


        const type =
            error.name;


        if(
            type ===
            "NotAllowedError" ||
            type ===
            "PermissionDeniedError"
        ){

            showError(
                "Camera đang bị chặn.",
                "Hãy vào quyền của trình duyệt và chọn Cho phép Camera."
            );

        }

        else if(
            type ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera.",
                "Thiết bị không có camera hoặc camera đang gặp vấn đề."
            );

        }

        else if(
            type ===
            "NotReadableError"
        ){

            showError(
