<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;

    touch-action:none;
}

    position:relative;
    width:100vw;
    height:100svh;

    position:absolute;
    inset:0;
    width:100%;
    height:100%;

        brightness(.82)

}

    border:0;
    border-radius:8px;
    background:white;
    color:#02040a;
    font-weight:800;
    font-size:11px;
    letter-spacing:.15em;

}

}

#error{

<video

</video>

<canvas id="canvas"></canvas>

<div id="startScreen">

    <div class="startBox">

            Chạm ngón trỏ + ngón cái

<!-- ==============================
     MEDIAPIPE HANDS
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<!-- ==============================
     MEDIAPIPE FACE MESH
================================ -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>
"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d",{
        alpha:true,
        desynchronized:true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");


/* =========================================================
   SIZE
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize,
    {passive:true}
);


/* =========================================================
   BONES
   Chỉ dùng nội bộ.
   KHÔNG VẼ RA MÀN HÌNH.
========================================================= */

const BONES = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
];


/* =========================================================
   FILTERS
========================================================= */

const FILTERS = [

{
    name:"RAINBOW",
    colors:[
        "#ff006e",
        "#ff4d00",
        "#ffe600",
        "#00ff88",
        "#00eaff",
        "#3867ff",
        "#b000ff"
    ]
},

{
    name:"AURORA",
    colors:[
        "#00fff0",
        "#00ff9d",
        "#70ff00",
        "#00aaff",
        "#7b00ff",
        "#ff00d4"
    ]
},

{
    name:"NEON DREAM",
    colors:[
        "#ff0080",
        "#ff00ff",
        "#8a00ff",
        "#0055ff",
        "#00eaff"
    ]
},

{
    name:"COSMIC",
    colors:[
        "#1600ff",
        "#5c00ff",
        "#b900ff",
        "#ff00aa",
        "#ff0055",
        "#00cfff"
    ]
},

{
    name:"SUNSET",
    colors:[
        "#ff003c",
        "#ff4800",
        "#ff9700",
        "#ffe000",
        "#ff00a8",
        "#7200ff"
    ]
},

{
    name:"OCEAN",
    colors:[
        "#001eff",
        "#006eff",
        "#00c8ff",
        "#00fff0",
        "#00ff9d",
        "#64ff00"
    ]
},

{
    name:"CRYSTAL",
    colors:[
        "#ffffff",
        "#9fffff",
        "#789dff",
        "#c78cff",
        "#ff9edb",
        "#ffffff"
    ]
}

];

let filterIndex = 0;


/* =========================================================
   BASIC MATH
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function screenPoint(p){

    return {
        x:(1-p.x)*W,
        y:p.y*H
    };
}


function getHandSize(hand){

    return Math.max(
        distance(
            hand[0],
            hand[9]
        ),
        .0001
    );
}


function indexThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[8]
        )
        /
        getHandSize(hand)
    );
}


function pinkyThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[20]
        )
        /
        getHandSize(hand)
    );
}


function indexTouch(hand){

    return indexThumbRatio(hand) < .82;
}


function pinkyTouch(hand){

    return pinkyThumbRatio(hand) < 1.05;
}


/* =========================================================
   WINDOW
========================================================= */

let windowOpen = false;

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =========================================================
   ULTRA SMOOTH TRACKING
========================================================= */

const velocity = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/*
    Đây là phần quan trọng.

    Không dùng smoothing đơn giản kiểu:

        point += difference * .3

    vì khi tay di chuyển nhanh
    nó sẽ bị trễ.

    Ta kết hợp:
    - smoothing
    - velocity
    - prediction
*/

function updatePoint(
    current,
    target,
    vel
){

    const dx =
        target.x-current.x;

    const dy =
        target.y-current.y;

    /*
       Velocity được cập nhật rất nhẹ.
    */

    vel.x =
        vel.x*.55 +
        dx*.45;

    vel.y =
        vel.y*.55 +
        dy*.45;

    /*
       Prediction nhỏ giúp khung
       đi trước một chút khi tay nhanh.
    */

    const prediction = .10;

    const predictedX =
        target.x +
        vel.x*prediction;

    const predictedY =
        target.y +
        vel.y*prediction;

    /*
       Adaptive smoothing.

       Tay càng xa mục tiêu
       thì bám càng nhanh.
    */

    const speed =
        Math.hypot(dx,dy);

    let factor;

    if(speed > 120){

        factor = .92;

    }
    else if(speed > 60){

        factor = .82;

    }
    else{

        factor = .68;

    }

    current.x +=
        (predictedX-current.x)
        *factor;

    current.y +=
        (predictedY-current.y)
        *factor;
}


/* =========================================================
   LEFT / RIGHT LOCK
========================================================= */

let lockedLeft = null;
let lockedRight = null;


/*
   Không xác định trái/phải lại
   một cách ngẫu nhiên mỗi frame.
*/

function sortHands(hands){

    if(hands.length < 2){

        return null;
    }

    const a =
        hands[0];

    const b =
        hands[1];

    const ax =
        screenPoint(a[9]).x;

    const bx =
        screenPoint(b[9]).x;


    /*
       Nếu chưa có lock
       thì xác định lần đầu.
    */

    if(
        lockedLeft === null ||
        lockedRight === null
    ){

        if(ax < bx){

            lockedLeft = a;
            lockedRight = b;

        }
        else{

            lockedLeft = b;
            lockedRight = a;

        }

        return {
            left:lockedLeft,
            right:lockedRight
        };
    }


    /*
       Tính khoảng cách từng tay
       tới vị trí cũ.

       Giúp tránh việc 2 tay
       đổi vai cho nhau.
    */

    const oldLeftX =
        screenPoint(
            lockedLeft[9]
        ).x;

    const oldRightX =
        screenPoint(
            lockedRight[9]
        ).x;


    const costNormal =
        Math.abs(ax-oldLeftX)
        +
        Math.abs(bx-oldRightX);


    const costSwap =
        Math.abs(ax-oldRightX)
        +
        Math.abs(bx-oldLeftX);


    if(costSwap < costNormal){

        /*
           Chỉ swap nếu sự khác biệt
           thực sự lớn.

           Tránh đảo chiều khi tay
           đang gần nhau.
        */

        if(
            costNormal-costSwap
            > 35
        ){

            lockedLeft = b;
            lockedRight = a;
        }

    }
    else{

        lockedLeft = a;
        lockedRight = b;
    }


    return {

        left:lockedLeft,
        right:lockedRight

    };
}


/* =========================================================
   WINDOW TARGET
========================================================= */

function setTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(left[8]);

    targetPoints.tr =
        screenPoint(right[8]);

    targetPoints.br =
        screenPoint(right[4]);

    targetPoints.bl =
        screenPoint(left[4]);
}


/* =========================================================
   OPEN WINDOW
========================================================= */

function createWindow(
    left,
    right
){

    setTargets(
        left,
        right
    );


    for(
        const key of
        ["tl","tr","br","bl"]
    ){

        windowPoints[key].x =
            targetPoints[key].x;

        windowPoints[key].y =
            targetPoints[key].y;

        velocity[key].x = 0;
        velocity[key].y = 0;
    }


    windowOpen = true;
}


/* =========================================================
   UPDATE WINDOW
========================================================= */

function updateWindow(
    left,
    right
){

    setTargets(
        left,
        right
    );


    updatePoint(
        windowPoints.tl,
        targetPoints.tl,
        velocity.tl
    );

    updatePoint(
        windowPoints.tr,
        targetPoints.tr,
        velocity.tr
    );

    updatePoint(
        windowPoints.br,
        targetPoints.br,
        velocity.br
    );

    updatePoint(
        windowPoints.bl,
        targetPoints.bl,
        velocity.bl
    );
}


/* =========================================================
   GRADIENT
========================================================= */

function makeGradient(){

    const p =
        windowPoints;

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;


    const g =
        ctx.createLinearGradient(
            cx-W*.7,
            cy-H*.7,
            cx+W*.7,
            cy+H*.7
        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    colors.forEach(
        (color,i)=>{

            g.addColorStop(
                i/(colors.length-1),
                color
            );

        }
    );


    return g;
}


/* =========================================================
   DRAW WINDOW
========================================================= */

function drawWindow(){

    if(!windowOpen){

        return;
    }


    const p =
        windowPoints;


    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /*
       Lớp kính rất nhẹ.
       Camera vẫn nhìn thấy rõ.
    */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha = .20;

    ctx.fillStyle =
        makeGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Highlight chuyển động.
    */

    const t =
        performance.now()*.00025;

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;


    const moving =
        ctx.createRadialGradient(
            cx+
            Math.cos(t)*W*.3,
            cy+
            Math.sin(t)*H*.3,
            0,
            cx,
            cy,
            Math.max(W,H)*.75
        );


    moving.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    moving.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle =
        moving;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /*
       BORDER
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        makeGradient();

    ctx.lineWidth = 4;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur = 16;

    ctx.stroke();


    ctx.shadowBlur = 4;

    ctx.strokeStyle =
        "rgba(255,255,255,.85)";

    ctx.lineWidth = 1.2;

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   COLOR
========================================================= */

let colorHeld = false;

let lastColorChange = 0;

function nextFilter(){

    const now =
        performance.now();


    if(
        now-lastColorChange
        < 700
    ){

        return;
    }


    lastColorChange =
        now;


    filterIndex++;

    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;
    }
}


/* =========================================================
   HAND PROCESSING
========================================================= */

function processHands(
    detected
){

    if(
        detected.length < 2
    ){

        /*
           Không reset window.
           Giúp khung không nhấp nháy
           khi MediaPipe mất tay 1 frame.
        */

        return;
    }


    const sorted =
        sortHands(
            detected
        );


    if(!sorted){

        return;
    }


    const left =
        sorted.left;

    const right =
        sorted.right;


    const leftIndex =
        indexTouch(left);

    const rightIndex =
        indexTouch(right);


    const leftPinky =
        pinkyTouch(left);

    const rightPinky =
        pinkyTouch(right);


    /*
       MỞ KHUNG
    */

    if(!windowOpen){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );
        }

        return;
    }


    /*
       KHUNG BÁM TAY
    */

    updateWindow(
        left,
        right
    );


    /*
       ĐỔI MÀU
    */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if(bothPinky){

        if(!colorHeld){

            nextFilter();

            colorHeld = true;
        }

    }
    else{

        colorHeld = false;
    }
}


/* =========================================================
   HAND MEDIAPIPE
========================================================= */

let hands = null;

let handBusy = false;

let lastHandTime = 0;

const HAND_INTERVAL = 25;


function setupHands(){

    hands =
        new Hands({

            locateFile:
            file =>
                "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                +file
        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.60

    });


    hands.onResults(
        results => {

            const detected =
                results.multiHandLandmarks
                || [];

            processHands(
                detected
            );
        }
    );
}


/* =========================================================
   FACE / BLINK
========================================================= */

let faceMesh = null;

let faceBusy = false;

let lastFaceTime = 0;

const FACE_INTERVAL = 65;


/*
   Face landmarks:

   mắt trái:
   159 / 145

   mắt phải:
   386 / 374
*/


function eyeRatio(
    landmarks,
    top,
    bottom,
    left,
    right
){

    const vertical =
        distance(
            landmarks[top],
            landmarks[bottom]
        );

    const horizontal =
        distance(
            landmarks[left],
            landmarks[right]
        );


    return (
        vertical /
        Math.max(horizontal,.0001)
    );
}


/* =========================================================
   BLINK STATE
========================================================= */

let eyesClosed = false;

let blinkTimes = [];

let maskActive = false;

let maskStartTime = 0;

let maskFade = 0;


/*
   Ngưỡng có hysteresis.

   Đóng < .19
   Mở  > .23
*/

function processFace(
    landmarks
){

    if(!landmarks){

        return;
    }


    const leftEye =
        eyeRatio(
            landmarks,
            159,
            145,
            33,
            133
        );


    const rightEye =
        eyeRatio(
            landmarks,
            386,
            374,
            362,
            263
        );


    const eyeClosedNow =
        leftEye < .19 &&
        rightEye < .19;


    /*
       Chỉ tính một blink
       tại thời điểm mắt chuyển
       từ mở -> đóng.
    */

    if(
        eyeClosedNow &&
        !eyesClosed
    ){

        const now =
            performance.now();


        blinkTimes.push(now);


        /*
           Chỉ giữ blink trong
           khoảng 2.5 giây.
        */

        blinkTimes =
            blinkTimes.filter(
                t =>
                    now-t < 2500
            );


        if(
            blinkTimes.length >= 3
        ){

            activateMask();

            blinkTimes = [];
        }
    }


    /*
       Chỉ cho phép blink tiếp
       khi mắt mở lại.
    */

    if(
        !eyeClosedNow
    ){

        eyesClosed = false;

    }
    else{

        eyesClosed = true;
    }


    /*
       Nếu mắt mở lâu,
       loại blink quá cũ.
    */

    const now =
        performance.now();


    blinkTimes =
        blinkTimes.filter(
            t =>
                now-t < 2500
        );
}


/* =========================================================
   ACTIVATE MASK
========================================================= */

function activateMask(){

    /*
       Không kích hoạt liên tục.
    */

    if(maskActive){

        return;
    }


    maskActive = true;

    maskStartTime =
        performance.now();

    maskFade = 0;


    setTimeout(
        ()=>{

            maskActive = false;

        },
        9000
    );
}


/* =========================================================
   DRAW SPIDER-MAN MASK
========================================================= */

function drawSpiderMask(
    landmarks
){

    if(
        !maskActive ||
        !landmarks
    ){

        return;
    }


    /*
       Lấy các điểm khuôn mặt.
    */

    const forehead =
        screenPoint(
            landmarks[10]
        );

    const chin =
        screenPoint(
            landmarks[152]
        );

    const leftFace =
        screenPoint(
            landmarks[234]
        );

    const rightFace =
        screenPoint(
            landmarks[454]
        );

    const leftEar =
        screenPoint(
            landmarks[127]
        );

    const rightEar =
        screenPoint(
            landmarks[356]
        );


    const faceWidth =
        Math.abs(
            rightFace.x-leftFace.x
        );


    const faceHeight =
        Math.abs(
            chin.y-forehead.y
        );


    const cx =
        (
            leftFace.x+
            rightFace.x
        )/2;


    const cy =
        (
            forehead.y+
            chin.y
        )/2;


    /*
       Animation xuất hiện.
    */

    const elapsed =
        performance.now()
        -
        maskStartTime;


    const progress =
        Math.min(
            elapsed/650,
            1
        );


    const ease =
        1-
        Math.pow(
            1-progress,
            3
        );


    /*
       ===========================
       CAPE / BACK OF HEAD
       ===========================
    */

    ctx.save();

    ctx.globalAlpha =
        .55*ease;

    ctx.beginPath();


    const neckX =
        cx;

    const neckY =
        chin.y+
        faceHeight*.40;


    ctx.moveTo(
        neckX-faceWidth*.25,
        neckY
    );

    ctx.lineTo(
        neckX-faceWidth*.58,
        neckY+faceHeight*.80
    );

    ctx.lineTo(
        neckX-faceWidth*.42,
        neckY+faceHeight*1.10
    );

    ctx.lineTo(
        neckX,
        neckY+faceHeight*.85
    );

    ctx.lineTo(
        neckX+faceWidth*.42,
        neckY+faceHeight*1.10
    );

    ctx.lineTo(
        neckX+faceWidth*.58,
        neckY+faceHeight*.80
    );

    ctx.lineTo(
        neckX+faceWidth*.25,
        neckY
    );

    ctx.closePath();


    const capeGradient =
        ctx.createLinearGradient(
            cx,
            chin.y,
            cx,
            neckY+faceHeight
        );


    capeGradient.addColorStop(
        0,
        "rgba(150,0,0,.70)"
    );

    capeGradient.addColorStop(
        .55,
        "rgba(50,0,0,.48)"
    );

    capeGradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        capeGradient;

    ctx.fill();


    ctx.restore();


    /*
       ===========================
       MASK
       ===========================
    */

    ctx.save();

    ctx.globalAlpha =
        ease;


    ctx.beginPath();


    const topY =
        forehead.y-
        faceHeight*.16;

    const bottomY =
        chin.y+
        faceHeight*.05;


    ctx.moveTo(
        cx,
        topY
    );


    ctx.bezierCurveTo(
        rightFace.x+faceWidth*.04,
        topY,
        rightFace.x+faceWidth*.10,
        cy,
        rightFace.x,
        bottomY-faceHeight*.12
    );


    ctx.bezierCurveTo(
        rightFace.x*.99,
        bottomY,
        cx+faceWidth*.20,
        bottomY+faceHeight*.05,
        cx,
        bottomY+faceHeight*.03
    );


    ctx.bezierCurveTo(
        cx-faceWidth*.20,
        bottomY+faceHeight*.05,
        leftFace.x*.99,
        bottomY,
        leftFace.x,
        bottomY-faceHeight*.12
    );


    ctx.bezierCurveTo(
        leftFace.x-faceWidth*.10,
        cy,
        leftFace.x-faceWidth*.04,
        topY,
        cx,
        topY
    );


    ctx.closePath();


    /*
       Đỏ đậm + đen.
    */

    const maskGradient =
        ctx.createLinearGradient(
            cx,
            topY,
            cx,
            bottomY
        );


    maskGradient.addColorStop(
        0,
        "#d80000"
    );

    maskGradient.addColorStop(
        .5,
        "#a00000"
    );

    maskGradient.addColorStop(
        1,
        "#480000"
    );


    ctx.fillStyle =
        maskGradient;

    ctx.shadowColor =
        "rgba(255,0,0,.55)";

    ctx.shadowBlur = 18;

    ctx.fill();


    /*
       ===========================
       WEB PATTERN
       ===========================
    */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "rgba(10,10,10,.82)";

    ctx.lineWidth =
        Math.max(
            1,
            faceWidth*.012
        );


    /*
       Dọc
    */

    for(
        let i=-4;
        i<=4;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            cx,
            topY
        );

        ctx.quadraticCurveTo(
            cx+
            i*faceWidth*.10,
            cy,
            cx+
            i*faceWidth*.22,
            bottomY
        );

        ctx.stroke();
    }


    /*
       Ngang cong
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        const yy =
            topY+
            faceHeight*
            (.15+i*.14);


        ctx.beginPath();

        ctx.moveTo(
            cx-faceWidth*.48,
            yy
        );

        ctx.quadraticCurveTo(
            cx,
            yy+
            faceHeight*.07,
            cx+faceWidth*.48,
            yy
        );

        ctx.stroke();
    }


    /*
       ===========================
       EYES
       ===========================
    */

    drawMaskEye(
        landmarks,
        33,
        133,
        159,
        145,
        true
    );

    drawMaskEye(
        landmarks,
        362,
        263,
        386,
        374,
        false
    );


    ctx.restore();
}


/* =========================================================
   MASK EYES
========================================================= */

function drawMaskEye(
    landmarks,
    outer,
    inner,
    top,
    bottom,
    leftSide
){

    const a =
        screenPoint(
            landmarks[outer]
        );

    const b =
        screenPoint(
            landmarks[inner]
        );

    const t =
        screenPoint(
            landmarks[top]
        );

    const d =
        screenPoint(
            landmarks[bottom]
        );


    const cx =
        (a.x+b.x)/2;

    const cy =
        (t.y+d.y)/2;


    const w =
        distance(a,b)*.52;

    const h =
        distance(t,d)*2.8;


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        cx-w,
        cy
    );

    ctx.lineTo(
        cx-w*.35,
        cy-h*.48
    );

    ctx.lineTo(
        cx+w*.55,
        cy-h*.30
    );

    ctx.lineTo(
        cx+w,
        cy+h*.05
    );

    ctx.lineTo(
        cx+w*.30,
        cy+h*.50
    );

    ctx.closePath();


    ctx.fillStyle =
        "#f4f4f4";

    ctx.shadowColor =
        "rgba(255,255,255,.8)";

    ctx.shadowBlur = 8;

    ctx.fill();


    ctx.strokeStyle =
        "#090909";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   FACE MEDIAPIPE
========================================================= */

function setupFace(){

    faceMesh =
        new FaceMesh({

            locateFile:
            file =>
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
                +file

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    faceMesh.onResults(
        results => {

            if(
                results.multiFaceLandmarks &&
                results.multiFaceLandmarks.length
            ){

                latestFace =
                    results.multiFaceLandmarks[0];

            }
            else{

                latestFace = null;
            }

        }
    );
}


let latestFace = null;


/* =========================================================
   TRACKING LOOP
========================================================= */

let running = false;


async function trackingLoop(){

    if(!running){

        return;
    }


    const now =
        performance.now();


    /*
       HANDS chạy nhanh.
    */

    if(
        hands &&
        !handBusy &&
        video.readyState >= 2 &&
        now-lastHandTime >= HAND_INTERVAL
    ){

        handBusy = true;

        lastHandTime = now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(e){

            console.warn(
                "Hands:",
                e
            );
        }


        handBusy = false;
    }


    /*
       FACE chạy chậm hơn.
       Không chặn hand tracking.
    */

    if(
        faceMesh &&
        !faceBusy &&
        video.readyState >= 2 &&
        now-lastFaceTime >= FACE_INTERVAL
    ){

        faceBusy = true;

        lastFaceTime = now;


        try{

            await faceMesh.send({
                image:video
            });

        }
        catch(e){

            console.warn(
                "Face:",
                e
            );
        }


        faceBusy = false;
    }


    /*
       Vẽ một lần mỗi frame.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawWindow();


    if(latestFace){

        drawSpiderMask(
            latestFace
        );
    }


    requestAnimationFrame(
        trackingLoop
    );
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    startButton.disabled = true;

    errorBox.textContent = "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled = false;

        return;
    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        /*
           Khởi tạo AI.
        */

        setupHands();

        setupFace();


        running = true;


        requestAnimationFrame(
            trackingLoop
        );

    }
    catch(error){

        console.error(error);


        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message ||
                "Unknown error"
            );


        startButton.disabled =
            false;
    }
}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        running = false;


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

    }
);

</script>
