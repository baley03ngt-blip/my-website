<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT TEST 3</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#05080d;

    font-family:Arial,sans-serif;
}

#app{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#05080d;
}


/* =====================================================
   CAMERA
===================================================== */

#video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;
}


/* =====================================================
   CANVAS
===================================================== */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   START
===================================================== */

#startScreen{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#05080d;

    color:white;

    text-align:center;
}

#startBox{

    width:min(90%,420px);

}

#startBox h1{

    font-size:34px;

    margin-bottom:15px;

}

#startBox p{

    color:#aaa;

    font-size:14px;

    line-height:1.6;

}

#startButton{

    margin-top:20px;

    padding:16px 28px;

    border:0;

    background:white;

    color:#05080d;

    font-weight:bold;

    cursor:pointer;

}

#startButton:active{

    transform:scale(.96);

}

#error{

    margin-top:15px;

    color:#ff7180;

}


/* =====================================================
   DEBUG
===================================================== */

#debug{

    position:absolute;

    left:12px;

    top:12px;

    z-index:20;

    width:290px;

    padding:13px;

    background:
        rgba(0,0,0,.72);

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:10px;

    color:white;

    font-family:Consolas,monospace;

    font-size:12px;

    line-height:1.7;

    backdrop-filter:blur(8px);

}

.debugTitle{

    color:#4de4ff;

    font-weight:bold;

    margin-bottom:6px;

}

.ok{

    color:#59e889;

}

.no{

    color:#ff6578;

}


/* =====================================================
   WINDOW STATUS
===================================================== */

#windowStatus{

    position:absolute;

    right:12px;

    top:12px;

    z-index:20;

    padding:9px 12px;

    background:
        rgba(0,0,0,.7);

    border-radius:8px;

    color:#ff6578;

    font:

        bold 11px

        Consolas,
        monospace;

}


/* =====================================================
   BOTTOM
===================================================== */

#instruction{

    position:absolute;

    left:0;

    right:0;

    bottom:22px;

    z-index:20;

    text-align:center;

    color:white;

    font-size:13px;

    text-shadow:
        0 2px 8px black;

}

</style>
</head>


<body>


<div id="app">


<!-- =====================================================
     CAMERA
===================================================== -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- =====================================================
     DRAW
===================================================== -->

<canvas
    id="canvas">
</canvas>


<!-- =====================================================
     DEBUG
===================================================== -->

<div id="debug">

    <div class="debugTitle">
        HANDLIGHT TRACKING
    </div>

    <div id="count">
        HAI TAY: ---
    </div>

    <div id="left">
        TAY TRÁI: ---
    </div>

    <div id="right">
        TAY PHẢI: ---
    </div>

    <div id="state">
        GESTURE: ---
    </div>

</div>


<!-- =====================================================
     WINDOW STATUS
===================================================== -->

<div id="windowStatus">
    WINDOW: OFF
</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

    <div id="startBox">

        <h1>
            HANDLIGHT
        </h1>

        <p>
            Đưa hai bàn tay vào camera.<br><br>

            Chạm ngón trỏ với ngón cái
            ở cả hai tay.
        </p>

        <button id="startButton">
            BẬT CAMERA
        </button>

        <div id="error"></div>

    </div>

</div>


<div id="instruction">
    Đưa hai bàn tay vào camera
</div>


</div>


<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const errorBox =
document.getElementById("error");

const countText =
document.getElementById("count");

const leftText =
document.getElementById("left");

const rightText =
document.getElementById("right");

const stateText =
document.getElementById("state");

const windowStatus =
document.getElementById("windowStatus");

const instruction =
document.getElementById("instruction");


/* =====================================================
   SIZE
===================================================== */

let W = 0;

let H = 0;

let DPR = 1;


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            W * DPR
        );

    canvas.height =
        Math.round(
            H * DPR
        );


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let running = false;

let lastFrame = 0;


/* =====================================================
   SKELETON
===================================================== */

const BONES = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   POINT
===================================================== */

function screenPoint(p){

    return {

        x:
            (1 - p.x) * W,

        y:
            p.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001

    );

}


/* =====================================================
   THUMB INDEX DISTANCE
===================================================== */

function getRatio(hand){

    const d =
        distance(
            hand[4],
            hand[8]
        );


    const size =
        getHandSize(
            hand
        );


    return d / size;

}


/* =====================================================
   TOUCH
===================================================== */

function isTouching(hand){

    const ratio =
        getRatio(
            hand
        );


    /*
       Ngưỡng rộng hơn bản cũ.

       Nếu số < 0.75
       coi như chạm.
    */

    return ratio < 0.75;

}


/* =====================================================
   DRAW SKELETON
===================================================== */

function drawSkeleton(hand){

    const points =
        hand.map(
            screenPoint
        );


    ctx.save();


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /* ==========================
       BONES
    ========================== */

    for(
        const bone
        of BONES
    ){

        const a =
            points[
                bone[0]
            ];

        const b =
            points[
                bone[1]
            ];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.strokeStyle =
            "rgba(255,255,255,.65)";

        ctx.lineWidth =
            1.5;

        ctx.stroke();

    }


    /* ==========================
       JOINTS
    ========================== */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];


        const tip =

            i === 4 ||
            i === 8 ||
            i === 12 ||
            i === 16 ||
            i === 20;


        ctx.beginPath();

        ctx.arc(

            p.x,
            p.y,

            tip ? 4 : 2.4,

            0,
            Math.PI * 2

        );


        ctx.fillStyle =
            "white";


        ctx.shadowColor =
            "white";


        ctx.shadowBlur =
            tip ? 8 : 3;


        ctx.fill();

    }


    /* ==========================
       THUMB + INDEX RINGS
    ========================== */

    drawRing(
        points[4],
        "#4de4ff"
    );

    drawRing(
        points[8],
        "#4de4ff"
    );


    ctx.restore();

}


/* =====================================================
   RING
===================================================== */

function drawRing(
    p,
    color
){

    ctx.save();


    ctx.beginPath();

    ctx.arc(

        p.x,
        p.y,

        8,

        0,
        Math.PI * 2

    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        1.5;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        10;


    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;


const windowPoints = {

    tl:{
        x:0,
        y:0
    },

    tr:{
        x:0,
        y:0
    },

    br:{
        x:0,
        y:0
    },

    bl:{
        x:0,
        y:0
    }

};


const targetPoints = {

    tl:{
        x:0,
        y:0
    },

    tr:{
        x:0,
        y:0
    },

    br:{
        x:0,
        y:0
    },

    bl:{
        x:0,
        y:0
    }

};


/* =====================================================
   SET WINDOW POINTS
===================================================== */

function setWindowPoints(
    left,
    right
){

    /*
       TRỎ TRÁI
       → TRÊN TRÁI
    */

    targetPoints.tl =
        screenPoint(
            left[8]
        );


    /*
       TRỎ PHẢI
       → TRÊN PHẢI
    */

    targetPoints.tr =
        screenPoint(
            right[8]
        );


    /*
       CÁI PHẢI
       → DƯỚI PHẢI
    */

    targetPoints.br =
        screenPoint(
            right[4]
        );


    /*
       CÁI TRÁI
       → DƯỚI TRÁI
    */

    targetPoints.bl =
        screenPoint(
            left[4]
        );

}


/* =====================================================
   OPEN WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowPoints(
        left,
        right
    );


    /*
       Đặt ngay lập tức.
       Không chờ animation.
    */

    windowPoints.tl = {
        ...targetPoints.tl
    };

    windowPoints.tr = {
        ...targetPoints.tr
    };

    windowPoints.br = {
        ...targetPoints.br
    };

    windowPoints.bl = {
        ...targetPoints.bl
    };


    windowOpen =
        true;


    windowStatus.textContent =
        "WINDOW: ON";


    windowStatus.style.color =
        "#59e889";


    instruction.textContent =
        "CỬA SỔ ĐÃ MỞ — DI CHUYỂN 4 NGÓN";


    stateText.innerHTML =
        "GESTURE: <span class='ok'>WINDOW OPEN</span>";

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowPoints(
        left,
        right
    );


    const smooth =
        0.35;


    windowPoints.tl.x +=
        (
            targetPoints.tl.x -
            windowPoints.tl.x
        ) * smooth;


    windowPoints.tl.y +=
        (
            targetPoints.tl.y -
            windowPoints.tl.y
        ) * smooth;


    windowPoints.tr.x +=
        (
            targetPoints.tr.x -
            windowPoints.tr.x
        ) * smooth;


    windowPoints.tr.y +=
        (
            targetPoints.tr.y -
            windowPoints.tr.y
        ) * smooth;


    windowPoints.br.x +=
        (
            targetPoints.br.x -
            windowPoints.br.x
        ) * smooth;


    windowPoints.br.y +=
        (
            targetPoints.br.y -
            windowPoints.br.y
        ) * smooth;


    windowPoints.bl.x +=
        (
            targetPoints.bl.x -
            windowPoints.bl.x
        ) * smooth;


    windowPoints.bl.y +=
        (
            targetPoints.bl.y -
            windowPoints.bl.y
        ) * smooth;

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(
        !windowOpen
    ){

        return;

    }


    const p =
        windowPoints;


    ctx.save();


    /*
       ==========================
       KHUNG
       ==========================
    */

    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    /*
       KÍNH TRONG SUỐT
    */

    ctx.fillStyle =
        "rgba(77,228,255,.045)";

    ctx.fill();


    /*
       GLOW
    */

    ctx.shadowColor =
        "#4de4ff";

    ctx.shadowBlur =
        18;


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;


    ctx.stroke();


    /*
       VIỀN XANH NHẸ
    */

    ctx.shadowBlur =
        0;

    ctx.strokeStyle =
        "rgba(77,228,255,.75)";

    ctx.lineWidth =
        1;


    ctx.stroke();


    ctx.restore();


    /*
       ==========================
       4 ĐIỂM
       ==========================
    */

    drawWindowCorner(
        p.tl
    );

    drawWindowCorner(
        p.tr
    );

    drawWindowCorner(
        p.br
    );

    drawWindowCorner(
        p.bl
    );

}


/* =====================================================
   WINDOW CORNER
===================================================== */

function drawWindowCorner(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(

        p.x,
        p.y,

        5,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "white";


    ctx.shadowColor =
        "#4de4ff";


    ctx.shadowBlur =
        12;


    ctx.fill();


    ctx.restore();

}


/* =====================================================
   PROCESS
===================================================== */

function processHands(
    detected
){

    /*
       ==========================
       0 TAY
       ==========================
    */

    if(
        detected.length === 0
    ){

        countText.innerHTML =
            "HAI TAY: <span class='no'>0 / 2</span>";

        leftText.textContent =
            "TAY TRÁI: ---";

        rightText.textContent =
            "TAY PHẢI: ---";

        stateText.textContent =
            "GESTURE: WAITING";

        instruction.textContent =
            "ĐƯA HAI BÀN TAY VÀO CAMERA";

        return;

    }


    /*
       VẼ XƯƠNG
    */

    for(
        const hand
        of detected
    ){

        drawSkeleton(
            hand
        );

    }


    /*
       ==========================
       1 TAY
       ==========================
    */

    if(
        detected.length === 1
    ){

        countText.innerHTML =
            "HAI TAY: <span class='no'>1 / 2</span>";

        instruction.textContent =
            "ĐƯA THÊM BÀN TAY THỨ HAI";

        return;

    }


    /*
       ==========================
       2 TAY
       ==========================
    */

    let handA =
        detected[0];

    let handB =
        detected[1];


    const xA =
        screenPoint(
            handA[9]
        ).x;


    const xB =
        screenPoint(
            handB[9]
        ).x;


    let left;
    let right;


    if(
        xA < xB
    ){

        left =
            handA;

        right =
            handB;

    }
    else{

        left =
            handB;

        right =
            handA;

    }


    /*
       ==========================
       TOUCH
       ==========================
    */

    const leftRatio =
        getRatio(
            left
        );


    const rightRatio =
        getRatio(
            right
        );


    const leftTouch =
        leftRatio < 0.75;


    const rightTouch =
        rightRatio < 0.75;


    /*
       DEBUG
    */

    countText.innerHTML =
        "HAI TAY: <span class='ok'>2 / 2</span>";


    leftText.innerHTML =
        "TRÁI: " +
        leftRatio.toFixed(3) +
        " → " +

        (
            leftTouch
            ? "<span class='ok'>TOUCH</span>"
            : "<span class='no'>OPEN</span>"
        );


    rightText.innerHTML =
        "PHẢI: " +
        rightRatio.toFixed(3) +
        " → " +

        (
            rightTouch
            ? "<span class='ok'>TOUCH</span>"
            : "<span class='no'>OPEN</span>"
        );


    /*
       ==========================
       CHƯA CÓ KHUNG
       ==========================
    */

    if(
        !windowOpen
    ){

        if(
            leftTouch &&
            rightTouch
        ){

            /*
               QUAN TRỌNG:

               MỞ NGAY.
               Không delay.
               Không hold.
            */

            createWindow(
                left,
                right
            );

        }
        else{

            stateText.textContent =
                "GESTURE: TOUCH BOTH HANDS";

            instruction.textContent =
                "CHẠM TRỎ + CÁI Ở CẢ HAI TAY";

        }

    }


    /*
       ==========================
       KHUNG ĐANG MỞ
       ==========================
    */

    if(
        windowOpen
    ){

        updateWindow(
            left,
            right
        );

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(
    results
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    processHands(
        detected
    );


    /*
       KHUNG VẼ CUỐI CÙNG
    */

    drawWindow();

}


/* =====================================================
   START TRACKING
===================================================== */

async function startTracking(){

    hands =
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    + file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.5,

        minTrackingConfidence:.5

    });


    hands.onResults(
        onResults
    );


    running =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   LOOP
===================================================== */

async function trackingLoop(){

    if(
        !running
    ){

        return;

    }


    const now =
        performance.now();


    if(
        now-lastFrame >= 33 &&
        video.readyState >= 2
    ){

        lastFrame =
            now;


        try{

            await hands.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;


    errorBox.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy chạy bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        instruction.textContent =
            "ĐƯA HAI BÀN TAY VÀO CAMERA";


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorBox.textContent =
            "Lỗi camera: " +
            error.message;


        startButton.disabled =
            false;

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        running =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }

    }
);

</script>

</body>
</html>
