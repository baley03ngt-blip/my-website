<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="viewport"
      content="width=device-width,

<title>HANDLIGHT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

#app {
    position: relative;
    width: 100vw;
    height: 100svh;
    overflow: hidden;
    background: #02040a;
}

/* =========================
   CAMERA
========================= */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 1;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(1.08);
}

/* =========================
   CANVAS
========================= */

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;

    z-index: 5;

    pointer-events: none;
}

/* =========================
   START SCREEN

<body>

<div id="app">

    <!-- CAMERA -->
    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <!-- EFFECT CANVAS -->
    <canvas id="canvas"></canvas>

    <!-- START -->
    <div id="startScreen">

        <div class="startBox">

            <h1>HANDLIGHT</h1>

            <p>
                Đưa hai bàn tay vào camera.
                <br><br>

                Chạm ngón trỏ + ngón cái
                ở cả hai tay để mở khung.
                <br><br>

                Sau đó chạm ngón út + ngón cái
                ở cả hai tay để đổi màu.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<!-- =========================
     MEDIAPIPE HANDS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>
"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;


function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   HAND LANDMARKS
   MediaPipe vẫn sử dụng đủ 21 điểm.
   Không vẽ chúng ra màn hình.
===================================================== */

const THUMB_TIP = 4;
const INDEX_TIP = 8;
const PINKY_TIP = 20;
const PALM_CENTER = 9;


/* =====================================================
   FILTERS
===================================================== */

const FILTERS = [

    {
        name: "RAINBOW",

        colors: [
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name: "AURORA",

        colors: [
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name: "NEON DREAM",

        colors: [
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name: "COSMIC",

        colors: [
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name: "SUNSET",

        colors: [
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name: "OCEAN",

        colors: [
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name: "CRYSTAL",

        colors: [
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];


let filterIndex = 0;


/* =====================================================
   COLOR GESTURE
===================================================== */

let colorGestureHeld = false;

let lastFilterChange = 0;

const COLOR_COOLDOWN = 800;


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;


/* =====================================================
   WINDOW POINTS
===================================================== */

const windowPoints = {

    tl: { x: 0, y: 0 },

    tr: { x: 0, y: 0 },

    br: { x: 0, y: 0 },

    bl: { x: 0, y: 0 }

};


const targetPoints = {

    tl: { x: 0, y: 0 },

    tr: { x: 0, y: 0 },

    br: { x: 0, y: 0 },

    bl: { x: 0, y: 0 }

};


/* =====================================================
   CAMERA POINT → SCREEN POINT

   Camera đang mirror bằng CSS.
   Vì vậy X được đảo lại.
===================================================== */

function screenPoint(point) {

    return {

        x: (1 - point.x) * W,

        y: point.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a, b) {

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand) {

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001

    );

}


/* =====================================================
   INDEX + THUMB
===================================================== */

function getIndexThumbRatio(hand) {

    return (

        distance(
            hand[THUMB_TIP],
            hand[INDEX_TIP]
        )

        /

        getHandSize(hand)

    );

}


function indexThumbTouch(hand) {

    return (

        getIndexThumbRatio(hand)

        < 0.82

    );

}


/* =====================================================
   PINKY + THUMB
===================================================== */

function getPinkyThumbRatio(hand) {

    return (

        distance(
            hand[THUMB_TIP],
            hand[PINKY_TIP]
        )

        /

        getHandSize(hand)

    );

}


function pinkyThumbTouch(hand) {

    return (

        getPinkyThumbRatio(hand)

        < 1.05

    );

}


/* =====================================================
   WINDOW TARGETS
===================================================== */

function setWindowTargets(left, right) {

    /*
        TRỎ TRÁI
        → góc trên trái
    */

    targetPoints.tl =
        screenPoint(
            left[INDEX_TIP]
        );


    /*
        TRỎ PHẢI
        → góc trên phải
    */

    targetPoints.tr =
        screenPoint(
            right[INDEX_TIP]
        );


    /*
        CÁI PHẢI
        → góc dưới phải
    */

    targetPoints.br =
        screenPoint(
            right[THUMB_TIP]
        );


    /*
        CÁI TRÁI
        → góc dưới trái
    */

    targetPoints.bl =
        screenPoint(
            left[THUMB_TIP]
        );

}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(left, right) {

    setWindowTargets(
        left,
        right
    );


    windowPoints.tl =
        { ...targetPoints.tl };

    windowPoints.tr =
        { ...targetPoints.tr };

    windowPoints.br =
        { ...targetPoints.br };

    windowPoints.bl =
        { ...targetPoints.bl };


    windowOpen = true;

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(left, right) {

    setWindowTargets(
        left,
        right
    );


    /*
        Làm mượt chuyển động.
    */

    const smooth = 0.38;


    const keys = [
        "tl",
        "tr",
        "br",
        "bl"
    ];


    for (const key of keys) {

        windowPoints[key].x +=
            (
                targetPoints[key].x -
                windowPoints[key].x
            ) * smooth;


        windowPoints[key].y +=
            (
                targetPoints[key].y -
                windowPoints[key].y
            ) * smooth;

    }

}


/* =====================================================
   GRADIENT
===================================================== */

function rainbowGradient() {

    const p = windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const gradient =
        ctx.createRadialGradient(

            centerX - W * 0.20,
            centerY - H * 0.20,
            0,

            centerX,
            centerY,

            Math.max(W, H) * 0.75

        );


    const colors =
        FILTERS[filterIndex].colors;


    for (
        let i = 0;
        i < colors.length;
        i++
    ) {

        gradient.addColorStop(

            i / (colors.length - 1),

            colors[i]

        );

    }


    return gradient;

}


/* =====================================================
   MOVING GRADIENT
===================================================== */

function movingGradient() {

    const p = windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const t =
        performance.now() * 0.00035;


    const moveX =
        Math.cos(t) *
        W *
        0.35;


    const moveY =
        Math.sin(t * 1.25) *
        H *
        0.35;


    const g =
        ctx.createLinearGradient(

            centerX -
            W * 0.70 +
            moveX,

            centerY -
            H * 0.70 +
            moveY,

            centerX +
            W * 0.70 -
            moveX,

            centerY +
            H * 0.70 -
            moveY

        );


    const colors =
        FILTERS[filterIndex].colors;


    for (
        let i = 0;
        i < colors.length;
        i++
    ) {

        g.addColorStop(

            i / (colors.length - 1),

            colors[i]

        );

    }


    return g;

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow() {

    if (!windowOpen) {
        return;
    }


    const p = windowPoints;


    /* =========================================
       WINDOW SHAPE
    ========================================= */

    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.clip();


    /* =========================================
       MULTICOLOR
    ========================================= */

    ctx.globalCompositeOperation =
        "screen";


    ctx.globalAlpha =
        0.25;


    ctx.fillStyle =
        rainbowGradient();


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =========================================
       MOVING COLORS
    ========================================= */

    ctx.globalAlpha =
        0.20;


    ctx.fillStyle =
        movingGradient();


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =========================================
       GLASS LIGHT
    ========================================= */

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const glass =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,

            Math.max(W, H) * 0.65

        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );


    glass.addColorStop(
        0.45,
        "rgba(255,255,255,.035)"
    );


    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle = glass;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /* =========================================
       NEON BORDER
    ========================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    ctx.strokeStyle =
        rainbowGradient();


    ctx.lineWidth = 6;

    ctx.lineJoin =
        "round";


    ctx.shadowColor =
        "#00eaff";


    ctx.shadowBlur =
        20;


    ctx.stroke();


    /* =========================================
       INNER WHITE BORDER
    ========================================= */

    ctx.shadowBlur = 7;


    ctx.strokeStyle =
        "rgba(255,255,255,.9)";


    ctx.lineWidth = 1.4;


    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   CHANGE FILTER
===================================================== */

function nextFilter() {

    const now =
        performance.now();


    if (
        now - lastFilterChange <
        COLOR_COOLDOWN
    ) {

        return;

    }


    lastFilterChange = now;


    filterIndex++;


    if (
        filterIndex >=
        FILTERS.length
    ) {

        filterIndex = 0;

    }

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(detected) {

    /*
        Không có tay.

        KHÔNG vẽ skeleton.
        KHÔNG có bảng debug.
        Chỉ giữ khung hiện tại.
    */

    if (
        detected.length === 0
    ) {

        return;

    }


    /*
        Chỉ cần 1 tay thì chưa mở cửa sổ.
    */

    if (
        detected.length === 1
    ) {

        return;

    }


    /*
        Lấy 2 tay.
    */

    let handA =
        detected[0];

    let handB =
        detected[1];


    /*
        Xác định tay trái / phải
        dựa vào vị trí trên màn hình.
    */

    const xA =
        screenPoint(
            handA[PALM_CENTER]
        ).x;


    const xB =
        screenPoint(
            handB[PALM_CENTER]
        ).x;


    let left;
    let right;


    if (xA < xB) {

        left = handA;
        right = handB;

    } else {

        left = handB;
        right = handA;

    }


    /* =========================================
       TRỎ + CÁI
    ========================================= */

    const leftIndex =
        indexThumbTouch(left);


    const rightIndex =
        indexThumbTouch(right);


    /* =========================================
       ÚT + CÁI
    ========================================= */

    const leftPinky =
        pinkyThumbTouch(left);


    const rightPinky =
        pinkyThumbTouch(right);


    /* =========================================
       OPEN WINDOW
    ========================================= */

    if (!windowOpen) {

        if (
            leftIndex &&
            rightIndex
        ) {

            createWindow(
                left,
                right
            );

        }

        return;

    }


    /* =========================================
       UPDATE WINDOW
    ========================================= */

    updateWindow(
        left,
        right
    );


    /* =========================================
       CHANGE COLOR
    ========================================= */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if (bothPinky) {

        if (!colorGestureHeld) {

            nextFilter();

            colorGestureHeld = true;

        }

    } else {

        colorGestureHeld = false;

    }

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(results) {

    /*
        Xóa canvas mỗi frame.

        LƯU Ý:
        Chúng ta KHÔNG vẽ 21 landmark
        và KHÔNG vẽ skeleton.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks || [];


    /*
        MediaPipe vẫn xử lý 21 điểm
        hoàn toàn bình thường.
    */

    processHands(
        detected
    );


    /*
        Chỉ vẽ cửa sổ.
    */

    drawWindow();

}


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;


async function startTracking() {

    if (!window.Hands) {

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    hands =
        new Hands({

            locateFile: function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                    file
                );

            }

        });


    hands.setOptions({

        maxNumHands: 2,

        modelComplexity: 1,

        minDetectionConfidence: 0.50,

        minTrackingConfidence: 0.50

    });


    hands.onResults(
        onResults
    );


    tracking = true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop() {

    if (!tracking) {
        return;
    }


    const now =
        performance.now();


    /*
        Khoảng 30 FPS.
    */

    if (
        now - lastSend >= 33 &&
        video.readyState >= 2
    ) {

        lastSend = now;


        try {

            await hands.send({

                image: video

            });

        }

        catch (error) {

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    startButton.disabled = true;

    errorBox.textContent = "";


    /*
        Camera trên điện thoại
        cần HTTPS.
    */

    if (!window.isSecureContext) {

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled = false;

        return;

    }


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }

    catch (error) {

        console.error(
            error
        );


        errorBox.textContent =
            "Không mở được camera: " +
            (
                error.message ||
                "Unknown error"
            );


        startButton.disabled =
            false;

    }

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        tracking = false;


        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(
                    function(track) {

                        track.stop();

                    }
                );

        }

    }
);

</script>

</body>
</html>
