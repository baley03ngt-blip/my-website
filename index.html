<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05080d;
}

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    filter:
        brightness(.78)
        contrast(1.05)
        saturate(.92);

    z-index:0;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.08) 70%,
            rgba(0,0,0,.45) 100%
        );
}

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        max(20px,env(safe-area-inset-top))
        20px
        15px;

    color:white;

    font:9px monospace;

    letter-spacing:.16em;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:white;

    box-shadow:0 0 12px white;
}

.status{
    color:rgba(255,255,255,.55);
}

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:10;

    display:flex;
    justify-content:space-between;

    padding:
        15px 20px
        max(24px,env(safe-area-inset-bottom));

    color:rgba(255,255,255,.55);

    font:9px monospace;

    letter-spacing:.08em;
}

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#05080d;

    transition:.4s;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);
    text-align:center;
}

.camera-icon{
    width:68px;
    height:68px;

    margin:0 auto 25px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;
}

.camera-icon span{
    width:21px;
    height:29px;

    border:2px solid white;

    border-radius:
        13px 13px 8px 8px;
}

.eyebrow{
    color:rgba(255,255,255,.55);

    font:10px monospace;

    letter-spacing:.2em;
}

h1{
    margin:0;

    font-size:
        clamp(30px,8vw,44px);

    line-height:1.03;
}

.desc{
    max-width:320px;

    margin:18px auto 27px;

    color:rgba(255,255,255,.55);

    font-size:14px;

    line-height:1.6;
}

button{
    border:0;

    padding:16px 25px;

    background:white;

    color:#05080d;

    font-weight:800;

    font-size:11px;

    letter-spacing:.14em;

    cursor:pointer;
}

.error{
    display:none;

    margin-top:15px;

    color:rgba(255,255,255,.6);

    font-size:11px;
}

@media(min-width:700px){

    .stage{
        max-width:430px;
        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }
}
</style>
</head>

<body>

<main class="stage">

<video
id="camera"
autoplay
muted
playsinline>
</video>

<canvas id="canvas"></canvas>

<div class="overlay"></div>

<header class="top">

<div class="logo">
<span class="dot"></span>
HANDLIGHT
</div>

<div id="status">
CAMERA OFF
</div>

</header>


<section id="start" class="start">

<div class="start-content">

<div class="camera-icon">
<span></span>
</div>

<div class="eyebrow">
HAND TRACKING
</div>

<h1>
Đưa hai bàn tay<br>
vào camera
</h1>

<p class="desc">
Khung xương sẽ bám trực tiếp
theo từng khớp bàn tay.
</p>

<button id="startButton">
BẬT CAMERA
</button>

<div id="error" class="error"></div>

</div>

</section>


<div class="bottom">

<div id="hint">
CHỜ HAI BÀN TAY
</div>

<div id="gesture">
READY
</div>

</div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const status =
document.getElementById("status");

const hint =
document.getElementById("hint");

const gesture =
document.getElementById("gesture");

const errorBox =
document.getElementById("error");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = canvas.clientWidth;
    H = canvas.clientHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let running = false;

let lastSend = 0;


/* =====================================================
   MEDIAPIPE HAND CONNECTIONS
===================================================== */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   LƯU KHUNG XƯƠNG
===================================================== */

let smoothHands = [];


/*
    Đây là phần quan trọng.

    Không tạo skeleton cố định.

    Mỗi frame:
    MediaPipe đưa ra 21 khớp mới.

    Skeleton cũ sẽ tiến gần
    đến đúng 21 khớp mới.
*/

const SMOOTH = 0.38;


function smoothHand(
    oldHand,
    newHand
){

    if(!oldHand){

        return newHand.map(p => ({
            x:p.x,
            y:p.y
        }));

    }

    return newHand.map(
        (p,i) => {

            const old =
                oldHand[i];

            if(!old){

                return {
                    x:p.x,
                    y:p.y
                };

            }

            return {

                x:
                    old.x +
                    (p.x-old.x)
                    * SMOOTH,

                y:
                    old.y +
                    (p.y-old.y)
                    * SMOOTH

            };

        }
    );
}


/* =====================================================
   CAMERA -> SCREEN
===================================================== */

function screenPoint(p){

    return {

        /*
            Vì camera đã mirror
            nên x cũng phải mirror.
        */

        x:
            (1-p.x) * W,

        y:
            p.y * H

    };
}


/* =====================================================
   VẼ KHUNG XƯƠNG
===================================================== */

function drawSkeleton(
    hand
){

    const points =
        hand.map(
            screenPoint
        );


    ctx.save();

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    /*
       =========================
       ĐƯỜNG XƯƠNG
       =========================
    */

    for(
        const line
        of connections
    ){

        const a =
            points[line[0]];

        const b =
            points[line[1]];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.75)";

        ctx.lineWidth =
            1.4;

        ctx.shadowColor =
            "rgba(255,255,255,.35)";

        ctx.shadowBlur =
            4;

        ctx.stroke();

    }


    /*
       =========================
       KHỚP
       =========================
    */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];


        /*
           Đầu ngón lớn hơn
        */

        const tip =
            (
                i===4 ||
                i===8 ||
                i===12 ||
                i===16 ||
                i===20
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,

            tip ? 3.3 : 2,

            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "white";

        ctx.shadowColor =
            "white";

        ctx.shadowBlur =
            tip ? 7 : 4;

        ctx.fill();

    }


    /*
       Vòng nhỏ tại 3 ngón
       mà chúng ta sẽ dùng
       ở bước điều khiển.
    */

    drawTarget(
        points[4]
    );

    drawTarget(
        points[8]
    );

    drawTarget(
        points[20]
    );


    ctx.restore();

}


/* =====================================================
   ĐIỂM ĐIỀU KHIỂN
===================================================== */

function drawTarget(p){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.5)";

    ctx.lineWidth =
        1;

    ctx.shadowColor =
        "white";

    ctx.shadowBlur =
        5;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   CHẠM TRỎ + CÁI
===================================================== */

function indexThumbTouch(
    hand
){

    if(!hand)
        return false;


    return (
        distance(
            hand[4],
            hand[8]
        ) < .075
    );

}


/* =====================================================
   CHẠM ÚT + CÁI
===================================================== */

function pinkyThumbTouch(
    hand
){

    if(!hand)
        return false;


    return (
        distance(
            hand[4],
            hand[20]
        ) < .075
    );

}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;


/*
    4 góc cửa sổ:

    TL = trỏ trái
    TR = trỏ phải
    BR = cái phải
    BL = cái trái
*/

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


const targetWindow = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


function smoothWindowPoint(
    current,
    target
){

    current.x +=
        (target.x-current.x)
        * .2;

    current.y +=
        (target.y-current.y)
        * .2;

}


/* =====================================================
   CẬP NHẬT CỬA SỔ
===================================================== */

function updateWindow(
    left,
    right
){

    targetWindow.tl =
        screenPoint(
            left[8]
        );

    targetWindow.tr =
        screenPoint(
            right[8]
        );

    targetWindow.br =
        screenPoint(
            right[4]
        );

    targetWindow.bl =
        screenPoint(
            left[4]
        );


    smoothWindowPoint(
        windowPoints.tl,
        targetWindow.tl
    );

    smoothWindowPoint(
        windowPoints.tr,
        targetWindow.tr
    );

    smoothWindowPoint(
        windowPoints.br,
        targetWindow.br
    );

    smoothWindowPoint(
        windowPoints.bl,
        targetWindow.bl
    );

}


/* =====================================================
   VẼ CỬA SỔ
===================================================== */

function drawWindow(){

    if(!windowOpen)
        return;


    const p =
        windowPoints;


    ctx.save();


    /*
       KHUNG
    */

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    /*
       KÍNH BÊN TRONG
    */

    ctx.fillStyle =
        "rgba(255,255,255,.035)";

    ctx.fill();


    /*
       VIỀN NGOÀI
    */

    ctx.shadowColor =
        "rgba(255,255,255,.8)";

    ctx.shadowBlur =
        14;

    ctx.strokeStyle =
        "rgba(255,255,255,.85)";

    ctx.lineWidth =
        2;

    ctx.stroke();


    /*
       VIỀN NHỎ BÊN TRONG
    */

    ctx.shadowBlur =
        0;

    ctx.strokeStyle =
        "rgba(255,255,255,.35)";

    ctx.lineWidth =
        1;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   XỬ LÝ HAI TAY
===================================================== */

function processHands(
    detected,
    handedness
){

    if(
        detected.length === 0
    ){

        hint.textContent =
            "ĐƯA HAI BÀN TAY VÀO";

        gesture.textContent =
            "WAITING";

        return;

    }


    /*
       Lấy tối đa 2 tay.
    */

    const data = [];


    for(
        let i=0;
        i<detected.length && i<2;
        i++
    ){

        data.push({

            landmarks:
                detected[i],

            label:
                handedness &&
                handedness[i]
                ? handedness[i].label
                : ""

        });

    }


    /*
       LÀM MƯỢT
    */

    const handsNow =
        data.map(
            (item,i) =>
            smoothHand(
                smoothHands[i],
                item.landmarks
            )
        );


    smoothHands =
        handsNow;


    /*
       VẼ SKELETON
    */

    for(
        const hand
        of handsNow
    ){

        drawSkeleton(
            hand
        );

    }


    /*
       CHƯA ĐỦ 2 TAY
    */

    if(
        handsNow.length < 2
    ){

        hint.textContent =
            "CẦN ĐỦ HAI BÀN TAY";

        gesture.textContent =
            "1 HAND";

        return;

    }


    /*
       =========================
       XÁC ĐỊNH TRÁI / PHẢI
       =========================

       Dùng vị trí trên màn hình,
       không phụ thuộc label của
       MediaPipe.
    */

    const converted =
        handsNow.map(
            hand => ({

                hand,

                center:
                    screenPoint(
                        hand[9]
                    )

            })
        );


    converted.sort(
        (a,b) =>
        a.center.x-b.center.x
    );


    const left =
        converted[0].hand;

    const right =
        converted[1].hand;


    /*
       =========================
       CỬA SỔ ĐANG ĐÓNG
       =========================
    */

    if(!windowOpen){

        const leftTouch =
            indexThumbTouch(
                left
            );

        const rightTouch =
            indexThumbTouch(
                right
            );


        if(
            leftTouch &&
            rightTouch
        ){

            windowOpen =
                true;


            /*
               Khởi tạo cửa sổ
               đúng theo bàn tay
            */

            targetWindow.tl =
                screenPoint(
                    left[8]
                );

            targetWindow.tr =
                screenPoint(
                    right[8]
                );

            targetWindow.br =
                screenPoint(
                    right[4]
                );

            targetWindow.bl =
                screenPoint(
                    left[4]
                );


            windowPoints.tl =
                {...targetWindow.tl};

            windowPoints.tr =
                {...targetWindow.tr};

            windowPoints.br =
                {...targetWindow.br};

            windowPoints.bl =
                {...targetWindow.bl};


            hint.textContent =
                "CỬA SỔ ĐÃ MỞ";

            gesture.textContent =
                "WINDOW OPEN";

        }
        else{

            hint.textContent =
                "TRỎ + CÁI Ở HAI TAY";

            gesture.textContent =
                "READY";

        }

    }


    /*
       =========================
       CỬA SỔ ĐANG MỞ
       =========================
    */

    if(windowOpen){

        /*
           Cập nhật liên tục.

           Vì vậy nếu bạn:
           - đưa trỏ lên
           - đưa trỏ xuống
           - đưa cái sang trái
           - đưa cái sang phải

           thì cửa sổ cũng biến dạng
           theo chính bàn tay.
        */

        updateWindow(
            left,
            right
        );


        /*
           Hiện cửa sổ
        */

        hint.textContent =
            "DI CHUYỂN BÀN TAY";

        gesture.textContent =
            "WINDOW ACTIVE";

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(result){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        result.multiHandLandmarks || [];


    const handedness =
        result.multiHandedness || [];


    processHands(
        detected,
        handedness
    );


    /*
       Cửa sổ vẽ sau skeleton
       để nó nằm phía trên.
    */

    drawWindow();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!running)
        return;


    const now =
        performance.now();


    if(
        hands &&
        video.readyState >= 2 &&
        now-lastSend >= 40
    ){

        lastSend =
            now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START HANDS
===================================================== */

async function startTracking(){

    hands =
        new Hands({

            locateFile:
            file =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
            + file

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.65,

        minTrackingConfidence:.65

    });


    hands.onResults(
        onResults
    );


    running =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    text
){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        text;

    startButton.disabled =
        false;

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
        true;

    status.textContent =
        "ĐANG XIN QUYỀN";


    if(
        !window.isSecureContext
    ){

        showError(
            "Hãy mở website bằng HTTPS hoặc GitHub Pages."
        );

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:24,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        start.classList.add(
            "hide"
        );


        status.textContent =
            "HAND TRACKING";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        status.textContent =
            "CAMERA ERROR";


        startButton.disabled =
            false;


        if(
            error.name ===
            "NotAllowedError"
        ){

            showError(
                "Camera bị chặn. Hãy cấp quyền Camera."
            );

        }
        else if(
            error.name ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera."
            );

        }
        else if(
            error.name ===
            "NotReadableError"
        ){

            showError(
                "Camera đang được ứng dụng khác sử dụng."
            );

        }
        else{

            showError(
                "Không thể mở Camera."
            );

        }

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        running =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        }

    }
);

</script>

</body>
</html>
