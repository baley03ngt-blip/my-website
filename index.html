<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<title>HANDLIGHT - STEP 2</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}


/* =========================
   START
========================= */

#startScreen{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#05080d;

    color:white;
    text-align:center;
}

#startBox{
    width:min(90%,420px);
}

#startBox h1{
    margin:0 0 15px;
    font-size:32px;
}

#startBox p{
    color:#aaa;
    line-height:1.6;
    font-size:14px;
}

#startButton{
    margin-top:15px;

    border:0;

    padding:15px 25px;

    background:white;

    color:#05080d;

    font-weight:bold;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.96);
}

#error{
    color:#ff7180;
}


/* =========================
   DEBUG
========================= */

#debug{

    position:absolute;

    top:15px;
    left:15px;

    z-index:10;

    width:280px;

    padding:13px;

    border-radius:10px;

    background:
        rgba(0,0,0,.72);

    border:
        1px solid
        rgba(255,255,255,.2);

    color:white;

    font-family:Consolas,monospace;

    font-size:12px;

    line-height:1.65;

    backdrop-filter:blur(8px);

}

.title{
    color:#4de4ff;
    font-weight:bold;
    margin-bottom:6px;
}

.ok{
    color:#59e889;
}

.no{
    color:#ff6b7a;
}


/* =========================
   BOTTOM
========================= */

#instruction{

    position:absolute;

    bottom:20px;

    left:0;
    right:0;

    z-index:10;

    text-align:center;

    color:white;

    font-size:13px;

}


/* =========================
   WINDOW INFO
========================= */

#windowState{

    position:absolute;

    top:15px;
    right:15px;

    z-index:10;

    padding:9px 12px;

    border-radius:8px;

    background:
        rgba(0,0,0,.65);

    color:white;

    font:
        11px monospace;

}

</style>
</head>


<body>


<div id="app">


<video
id="video"
autoplay
muted
playsinline>
</video>


<canvas
id="canvas">
</canvas>


<!-- DEBUG -->

<div id="debug">

<div class="title">
HAND TRACKING
</div>

<div id="handsCount">
Hai tay: ĐANG CHỜ
</div>

<div id="leftInfo">
TAY TRÁI: ---
</div>

<div id="rightInfo">
TAY PHẢI: ---
</div>

<div id="gestureInfo">
GESTURE: ---
</div>

</div>


<!-- WINDOW STATE -->

<div id="windowState">
WINDOW: OFF
</div>


<!-- START -->

<div id="startScreen">

<div id="startBox">

<h1>
HANDLIGHT
</h1>

<p>
Đưa hai bàn tay vào camera.<br>
Chạm ngón trỏ với ngón cái<br>
ở cả hai tay để tạo cửa sổ.
</p>

<button id="startButton">
BẬT CAMERA
</button>

<p id="error"></p>

</div>

</div>


<div id="instruction">
Đưa hai bàn tay vào camera
</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById(
    "video"
);

const canvas =
document.getElementById(
    "canvas"
);

const ctx =
canvas.getContext(
    "2d"
);

const startScreen =
document.getElementById(
    "startScreen"
);

const startButton =
document.getElementById(
    "startButton"
);

const errorText =
document.getElementById(
    "error"
);

const handsCount =
document.getElementById(
    "handsCount"
);

const leftInfo =
document.getElementById(
    "leftInfo"
);

const rightInfo =
document.getElementById(
    "rightInfo"
);

const gestureInfo =
document.getElementById(
    "gestureInfo"
);

const instruction =
document.getElementById(
    "instruction"
);

const windowState =
document.getElementById(
    "windowState"
);


/* =====================================================
   CANVAS
===================================================== */

let W=0;
let H=0;
let DPR=1;


function resizeCanvas(){

    W=window.innerWidth;

    H=window.innerHeight;

    DPR=Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width=
        Math.round(W*DPR);

    canvas.height=
        Math.round(H*DPR);

    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands=null;

let cameraRunning=false;

let lastFrame=0;


/* =====================================================
   HAND CONNECTIONS
===================================================== */

const connections=[

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   SCREEN POINT
===================================================== */

function screenPoint(p){

    return {

        x:(1-p.x)*W,

        y:p.y*H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.sqrt(

        Math.pow(
            a.x-b.x,
            2
        )

        +

        Math.pow(
            a.y-b.y,
            2
        )

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function handSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        .0001

    );

}


/* =====================================================
   THUMB + INDEX
===================================================== */

function thumbIndexRatio(hand){

    return (

        distance(
            hand[4],
            hand[8]
        )

        /

        handSize(hand)

    );

}


function touching(hand){

    return (
        thumbIndexRatio(hand)
        < .65
    );

}


/* =====================================================
   DRAW SKELETON
===================================================== */

function drawSkeleton(hand){

    const p =
        hand.map(
            screenPoint
        );


    ctx.save();

    ctx.lineCap="round";
    ctx.lineJoin="round";


    /*
       XƯƠNG
    */

    for(
        const line
        of connections
    ){

        const a=
            p[line[0]];

        const b=
            p[line[1]];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.72)";

        ctx.lineWidth=
            1.4;

        ctx.stroke();

    }


    /*
       KHỚP
    */

    for(
        let i=0;
        i<p.length;
        i++
    ){

        const point=
            p[i];

        const tip=
            (
                i===4 ||
                i===8 ||
                i===12 ||
                i===16 ||
                i===20
            );


        ctx.beginPath();

        ctx.arc(

            point.x,
            point.y,

            tip ? 4 : 2.3,

            0,
            Math.PI*2

        );

        ctx.fillStyle=
            "white";

        ctx.shadowColor=
            "white";

        ctx.shadowBlur=
            tip ? 8 : 3;

        ctx.fill();

    }


    /*
       ĐÁNH DẤU TRỎ + CÁI
    */

    drawTarget(
        p[4]
    );

    drawTarget(
        p[8]
    );


    ctx.restore();

}


/* =====================================================
   TARGET CIRCLE
===================================================== */

function drawTarget(p){

    ctx.save();

    ctx.beginPath();

    ctx.arc(

        p.x,
        p.y,

        7,

        0,
        Math.PI*2

    );

    ctx.strokeStyle=
        "#4de4ff";

    ctx.lineWidth=
        1.4;

    ctx.shadowColor=
        "#4de4ff";

    ctx.shadowBlur=
        9;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen=false;


/*
   4 góc:

   TL = trỏ trái
   TR = trỏ phải
   BR = cái phải
   BL = cái trái
*/

const current={

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


const target={

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   SMOOTH
===================================================== */

function smoothPoint(
    current,
    target
){

    current.x +=
        (
            target.x-
            current.x
        )*.28;

    current.y +=
        (
            target.y-
            current.y
        )*.28;

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    /*
       4 NGÓN
    */

    target.tl=
        screenPoint(
            left[8]
        );

    target.tr=
        screenPoint(
            right[8]
        );

    target.br=
        screenPoint(
            right[4]
        );

    target.bl=
        screenPoint(
            left[4]
        );


    smoothPoint(
        current.tl,
        target.tl
    );

    smoothPoint(
        current.tr,
        target.tr
    );

    smoothPoint(
        current.br,
        target.br
    );

    smoothPoint(
        current.bl,
        target.bl
    );

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen)
        return;


    const p=current;


    ctx.save();


    /*
       =========================
       VÙNG KÍNH
       =========================
    */

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    /*
       KÍNH TRONG SUỐT
    */

    ctx.fillStyle=
        "rgba(255,255,255,.035)";

    ctx.fill();


    /*
       =========================
       GLOW
       =========================
    */

    ctx.shadowColor=
        "rgba(77,228,255,.95)";

    ctx.shadowBlur=
        18;

    ctx.strokeStyle=
        "rgba(255,255,255,.95)";

    ctx.lineWidth=
        2;

    ctx.stroke();


    /*
       =========================
       VIỀN NHỎ BÊN TRONG
       =========================
    */

    ctx.shadowBlur=0;

    ctx.strokeStyle=
        "rgba(77,228,255,.5)";

    ctx.lineWidth=
        1;

    ctx.stroke();


    ctx.restore();


    /*
       =========================
       4 GÓC
       =========================
    */

    drawWindowPoint(
        p.tl
    );

    drawWindowPoint(
        p.tr
    );

    drawWindowPoint(
        p.br
    );

    drawWindowPoint(
        p.bl
    );

}


/* =====================================================
   WINDOW POINT
===================================================== */

function drawWindowPoint(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(

        p.x,
        p.y,

        5,

        0,
        Math.PI*2

    );

    ctx.fillStyle=
        "white";

    ctx.shadowColor=
        "#4de4ff";

    ctx.shadowBlur=
        10;

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   OPEN WINDOW
===================================================== */

function openWindow(
    left,
    right
){

    windowOpen=true;


    /*
       Lấy vị trí hiện tại
       làm vị trí ban đầu.
    */

    target.tl=
        screenPoint(
            left[8]
        );

    target.tr=
        screenPoint(
            right[8]
        );

    target.br=
        screenPoint(
            right[4]
        );

    target.bl=
        screenPoint(
            left[4]
        );


    current.tl={
        ...target.tl
    };

    current.tr={
        ...target.tr
    };

    current.br={
        ...target.br
    };

    current.bl={
        ...target.bl
    };


    windowState.textContent=
        "WINDOW: ON";

    windowState.style.color=
        "#59e889";

    instruction.textContent=
        "CỬA SỔ ĐÃ MỞ — DI CHUYỂN 4 NGÓN";

}


/* =====================================================
   GESTURE HOLD
===================================================== */

let holdStart=0;


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    /*
       Không có tay
    */

    if(
        detected.length===0
    ){

        handsCount.innerHTML=
            "Hai tay: <span class='no'>0 / 2</span>";

        leftInfo.textContent=
            "TAY TRÁI: ---";

        rightInfo.textContent=
            "TAY PHẢI: ---";

        gestureInfo.textContent=
            "GESTURE: WAITING";

        holdStart=0;

        return;

    }


    /*
       Vẽ skeleton
    */

    for(
        const hand
        of detected
    ){

        drawSkeleton(
            hand
        );

    }


    /*
       Chỉ có 1 tay
    */

    if(
        detected.length<2
    ){

        handsCount.innerHTML=
            "Hai tay: <span class='no'>1 / 2</span>";

        instruction.textContent=
            "ĐƯA THÊM BÀN TAY THỨ HAI";

        holdStart=0;

        return;

    }


    /*
       Tách trái / phải
    */

    const a=
        detected[0];

    const b=
        detected[1];


    const ax=
        screenPoint(
            a[9]
        ).x;

    const bx=
        screenPoint(
            b[9]
        ).x;


    let left;
    let right;


    if(ax<bx){

        left=a;
        right=b;

    }
    else{

        left=b;
        right=a;

    }


    /*
       Ratio
    */

    const leftRatio=
        thumbIndexRatio(
            left
        );

    const rightRatio=
        thumbIndexRatio(
            right
        );


    const leftTouch=
        touching(
            left
        );

    const rightTouch=
        touching(
            right
        );


    /*
       DEBUG
    */

    handsCount.innerHTML=
        "Hai tay: <span class='ok'>2 / 2</span>";


    leftInfo.innerHTML=
        "TRÁI: "+
        leftRatio.toFixed(3)+
        " → "+
        (
            leftTouch
            ? "<span class='ok'>TOUCH</span>"
            : "<span class='no'>OPEN</span>"
        );


    rightInfo.innerHTML=
        "PHẢI: "+
        rightRatio.toFixed(3)+
        " → "+
        (
            rightTouch
            ? "<span class='ok'>TOUCH</span>"
            : "<span class='no'>OPEN</span>"
        );


    /*
       ==========================
       MỞ CỬA SỔ
       ==========================
    */

    if(
        !windowOpen
    ){

        if(
            leftTouch &&
            rightTouch
        ){

            if(
                holdStart===0
            ){

                holdStart=
                    performance.now();

            }


            const held=
                performance.now()-
                holdStart;


            gestureInfo.textContent=
                "GESTURE: HOLD "+
                (
                    held/1000
                ).toFixed(1)+
                "s";


            instruction.textContent=
                "GIỮ NGUYÊN HAI CẶP NGÓN...";


            /*
               0.3 giây
            */

            if(
                held>=300
            ){

                openWindow(
                    left,
                    right
                );

                holdStart=0;

            }

        }
        else{

            holdStart=0;

            gestureInfo.textContent=
                "GESTURE: WAITING";

            instruction.textContent=
                "CHẠM TRỎ + CÁI Ở CẢ HAI TAY";

        }

    }


    /*
       ==========================
       CỬA SỔ ĐÃ MỞ
       ==========================
    */

    if(
        windowOpen
    ){

        updateWindow(
            left,
            right
        );

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(
    results
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected=
        results.multiHandLandmarks
        || [];


    processHands(
        detected
    );


    /*
       Vẽ cửa sổ sau cùng
       để nó nằm trên skeleton.
    */

    drawWindow();

}


/* =====================================================
   TRACKING
===================================================== */

async function trackingLoop(){

    if(
        !cameraRunning
    ){

        return;

    }


    const now=
        performance.now();


    if(
        now-lastFrame>=33 &&
        video.readyState>=2
    ){

        lastFrame=now;


        try{

            await hands.send({

                image:video

            });

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    hands=
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.5,

        minTrackingConfidence:.5

    });


    hands.onResults(
        onResults
    );


    cameraRunning=true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled=true;


    if(
        !window.isSecureContext
    ){

        errorText.textContent=
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled=false;

        return;

    }


    try{

        const stream=
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject=
            stream;


        await video.play();


        startScreen.style.display=
            "none";


        instruction.textContent=
            "ĐƯA HAI BÀN TAY VÀO CAMERA";


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorText.textContent=
            "Không mở được camera: "+
            error.message;


        startButton.disabled=false;

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        cameraRunning=false;


        if(
            video.srcObject
        ){

            video.srcObject
            .getTracks()
            .forEach(
                function(track){

                    track.stop();

                }
            );

        }

    }
);

</script>

</body>
</html>
