<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* =========================
   CAMERA
========================= */

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(1.08);
}

/* =========================
   CANVAS
========================= */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#02040a;

    color:white;
    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:15px;
}

.startBox p{
    color:rgba(255,255,255,.6);
    font-size:14px;
    line-height:1.65;
}

#startButton{
    margin-top:25px;

    padding:16px 28px;

    border:0;
    border-radius:6px;

    background:white;
    color:#02040a;

    font-weight:800;
    font-size:11px;

    letter-spacing:.15em;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:14px;

    color:#ff6578;

    font-size:12px;
    line-height:1.5;
}

/* =========================
   FILTER NAME
========================= */

#filterName{
    position:absolute;

    left:50%;
    bottom:55px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.50);

    border:1px solid
        rgba(255,255,255,.18);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity .25s;
}

/* =========================
   INSTRUCTION
========================= */

#instruction{
    position:absolute;

    left:0;
    right:0;

    bottom:18px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px #000;

    transition:opacity .2s;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #instruction{
        font-size:11px;
        bottom:16px;
    }

}
</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <!-- FILTER -->
    <div id="filterName">
        RAINBOW
    </div>

    <!-- INSTRUCTION -->
    <div id="instruction">
        ĐƯA HAI BÀN TAY VÀO CAMERA
    </div>

    <!-- START -->
    <div id="startScreen">

        <div class="startBox">

            <h1>
                HANDLIGHT
            </h1>

            <p>
                Đưa hai bàn tay vào camera.<br><br>

                Chạm ngón trỏ + ngón cái
                ở cả hai tay để mở khung.<br><br>

                Sau đó chạm ngón út + ngón cái
                ở cả hai tay để đổi màu.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const instruction =
    document.getElementById("instruction");

const filterName =
    document.getElementById("filterName");


/* =========================================================
   CANVAS SIZE
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   FILTERS
========================================================= */

const FILTERS = [

    {
        name:"RAINBOW",

        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",

        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",

        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",

        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",

        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",

        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",

        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;

let lastFilterChange = 0;

const COLOR_COOLDOWN = 850;


/* =========================================================
   WINDOW STATE
========================================================= */

let windowOpen = false;

let colorGestureHeld = false;


/* =========================================================
   WINDOW POINTS
========================================================= */

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =========================================================
   SMOOTHING SYSTEM
========================================================= */

/*
   Đây là phần quan trọng nhất.

   Không lấy trực tiếp tọa độ MediaPipe
   để vẽ khung.

   MediaPipe -> target
              -> lọc rung
              -> smoothing
              -> khung
*/

const smoothState = {

    tl:{
        x:0,
        y:0,
        vx:0,
        vy:0,
        initialized:false
    },

    tr:{
        x:0,
        y:0,
        vx:0,
        vy:0,
        initialized:false
    },

    br:{
        x:0,
        y:0,
        vx:0,
        vy:0,
        initialized:false
    },

    bl:{
        x:0,
        y:0,
        vx:0,
        vy:0,
        initialized:false
    }

};


/* =========================================================
   SMOOTHING PARAMETERS
========================================================= */

const SMOOTH = {

    /*
       Giá trị nhỏ:
       mượt hơn nhưng chậm hơn.

       Giá trị lớn:
       bám tay nhanh hơn.
    */

    slow:0.12,

    normal:0.22,

    fast:0.48,

    /*
       chống rung
    */

    deadZone:0.45,

    /*
       giới hạn tốc độ thay đổi
    */

    maxStep:55,

    /*
       giảm vận tốc
    */

    velocityDamping:0.72

};


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   SCREEN POINT
========================================================= */

function screenPoint(p){

    return {

        x:(1-p.x)*W,

        y:p.y*H

    };

}


/* =========================================================
   HAND SIZE
========================================================= */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001

    );

}


/* =========================================================
   INDEX + THUMB
========================================================= */

function getIndexThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[8]
        )

        /

        getHandSize(hand)

    );

}


function indexThumbTouch(hand){

    return (

        getIndexThumbRatio(hand)

        <

        0.82

    );

}


/* =========================================================
   PINKY + THUMB
========================================================= */

function getPinkyThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[20]
        )

        /

        getHandSize(hand)

    );

}


function pinkyThumbTouch(hand){

    return (

        getPinkyThumbRatio(hand)

        <

        1.05

    );

}


/* =========================================================
   ADVANCED SMOOTHING
========================================================= */

function smoothPoint(
    key,
    target
){

    const s =
        smoothState[key];

    /*
       Lần đầu tiên:
       đặt thẳng vào vị trí tay.
    */

    if(!s.initialized){

        s.x = target.x;
        s.y = target.y;

        s.vx = 0;
        s.vy = 0;

        s.initialized = true;

        return {
            x:s.x,
            y:s.y
        };

    }


    const dx =
        target.x - s.x;

    const dy =
        target.y - s.y;

    const dist =
        Math.hypot(dx,dy);


    /*
       Dead zone:

       Nếu tay chỉ rung rất nhẹ
       thì bỏ qua.
    */

    if(
        dist < SMOOTH.deadZone
    ){

        return {
            x:s.x,
            y:s.y
        };

    }


    /*
       Adaptive smoothing.

       Di chuyển chậm:
       smoothing mạnh.

       Di chuyển nhanh:
       smoothing nhẹ hơn
       để khung không bị tụt.
    */

    let amount;

    if(dist < 8){

        amount =
            SMOOTH.slow;

    }
    else if(dist < 30){

        amount =
            SMOOTH.normal;

    }
    else{

        amount =
            SMOOTH.fast;

    }


    /*
       Giới hạn bước nhảy.
    */

    const step =
        Math.min(
            dist * amount,
            SMOOTH.maxStep
        );


    /*
       Hướng di chuyển.
    */

    const nx =
        dx / dist;

    const ny =
        dy / dist;


    /*
       cập nhật velocity
    */

    s.vx =
        s.vx * SMOOTH.velocityDamping
        +
        nx * step * .25;

    s.vy =
        s.vy * SMOOTH.velocityDamping
        +
        ny * step * .25;


    /*
       cập nhật vị trí.
    */

    s.x +=
        nx * step
        +
        s.vx;

    s.y +=
        ny * step
        +
        s.vy;


    /*
       Không cho vượt quá target.
    */

    if(
        Math.abs(target.x-s.x) < 0.8
    ){

        s.x = target.x;
        s.vx *= .2;

    }

    if(
        Math.abs(target.y-s.y) < 0.8
    ){

        s.y = target.y;
        s.vy *= .2;

    }


    return {

        x:s.x,
        y:s.y

    };

}


/* =========================================================
   SET TARGETS
========================================================= */

function setWindowTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(left[8]);

    targetPoints.tr =
        screenPoint(right[8]);

    targetPoints.br =
        screenPoint(right[4]);

    targetPoints.bl =
        screenPoint(left[4]);

}


/* =========================================================
   CREATE WINDOW
========================================================= */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    for(
        const key of
        ["tl","tr","br","bl"]
    ){

        smoothState[key].initialized =
            false;

        const p =
            smoothPoint(
                key,
                targetPoints[key]
            );

        windowPoints[key].x =
            p.x;

        windowPoints[key].y =
            p.y;

    }


    windowOpen = true;


    instruction.textContent =
        "DI CHUYỂN 4 ĐẦU NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";


    showFilter();

}


/* =========================================================
   UPDATE WINDOW
========================================================= */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    for(
        const key of
        ["tl","tr","br","bl"]
    ){

        const p =
            smoothPoint(
                key,
                targetPoints[key]
            );

        windowPoints[key].x =
            p.x;

        windowPoints[key].y =
            p.y;

    }

}


/* =========================================================
   GRADIENT
========================================================= */

function createGradient(){

    const p =
        windowPoints;

    const centerX =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const centerY =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;


    const t =
        performance.now()*0.00035;


    const moveX =
        Math.cos(t)
        * W
        * .35;


    const moveY =
        Math.sin(t*1.25)
        * H
        * .35;


    const g =
        ctx.createLinearGradient(

            centerX-W*.7+moveX,
            centerY-H*.7+moveY,

            centerX+W*.7-moveX,
            centerY+H*.7-moveY

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        g.addColorStop(

            i/(colors.length-1),

            colors[i]

        );

    }


    return g;

}


/* =========================================================
   DRAW WINDOW
========================================================= */

function drawWindow(){

    if(!windowOpen){

        return;

    }


    const p =
        windowPoints;


    /*
       ============================
       CLIP WINDOW
       ============================
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /*
       ============================
       COLOR
       ============================
    */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .22;

    ctx.fillStyle =
        createGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       ============================
       GLASS LIGHT
       ============================
    */

    const centerX =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const centerY =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;


    const glass =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H)*.65

        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.09)"
    );

    glass.addColorStop(
        .5,
        "rgba(255,255,255,.025)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle =
        glass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /*
       ============================
       NEON BORDER
       ============================
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        createGradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
       lớp sáng trắng mảnh
    */

    ctx.shadowBlur = 6;

    ctx.strokeStyle =
        "rgba(255,255,255,.85)";

    ctx.lineWidth =
        1.3;

    ctx.stroke();


    ctx.restore();


    /*
       ============================
       CORNER LIGHT
       ============================
    */

    drawCorner(p.tl);
    drawCorner(p.tr);
    drawCorner(p.br);
    drawCorner(p.bl);

}


/* =========================================================
   DRAW CORNER
========================================================= */

function drawCorner(p){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        12;

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   FILTER CHANGE
========================================================= */

function showFilter(){

    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;

    filterName.style.opacity =
        "1";


    clearTimeout(
        showFilter.timer
    );


    showFilter.timer =
        setTimeout(
            ()=>{

                filterName.style.opacity =
                    "0";

            },
            1000
        );

}


function nextFilter(){

    const now =
        performance.now();


    if(
        now-lastFilterChange
        <
        COLOR_COOLDOWN
    ){

        return;

    }


    lastFilterChange =
        now;


    filterIndex++;


    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;

    }


    showFilter();

}


/* =========================================================
   PROCESS HANDS
========================================================= */

function processHands(
    detected
){

    /*
       Không có tay
    */

    if(
        detected.length === 0
    ){

        if(!windowOpen){

            instruction.textContent =
                "ĐƯA HAI BÀN TAY VÀO CAMERA";

        }

        return;

    }


    /*
       Chỉ có một tay
    */

    if(
        detected.length === 1
    ){

        if(!windowOpen){

            instruction.textContent =
                "ĐƯA BÀN TAY THỨ HAI VÀO";

        }

        return;

    }


    /*
       ============================
       2 TAY
       ============================
    */

    const handA =
        detected[0];

    const handB =
        detected[1];


    const xA =
        screenPoint(
            handA[9]
        ).x;


    const xB =
        screenPoint(
            handB[9]
        ).x;


    let left;
    let right;


    if(xA < xB){

        left = handA;
        right = handB;

    }
    else{

        left = handB;
        right = handA;

    }


    /*
       ============================
       GESTURE
       ============================
    */

    const leftIndex =
        indexThumbTouch(left);

    const rightIndex =
        indexThumbTouch(right);


    const leftPinky =
        pinkyThumbTouch(left);

    const rightPinky =
        pinkyThumbTouch(right);


    /*
       ============================
       OPEN WINDOW
       ============================
    */

    if(!windowOpen){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );

        }
        else{

            instruction.textContent =
                "CHẠM TRỎ + CÁI Ở CẢ HAI TAY";

        }

        return;

    }


    /*
       ============================
       UPDATE WINDOW
       ============================
    */

    updateWindow(
        left,
        right
    );


    /*
       ============================
       CHANGE COLOR
       ============================
    */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if(bothPinky){

        if(!colorGestureHeld){

            nextFilter();

            colorGestureHeld =
                true;

            instruction.textContent =
                "🌈 ĐÃ ĐỔI MÀU";

        }

    }
    else{

        colorGestureHeld =
            false;

        instruction.textContent =
            "ÚT + CÁI 2 TAY = ĐỔI MÀU";

    }

}


/* =========================================================
   MEDIAPIPE RESULTS
========================================================= */

function onResults(results){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    processHands(
        detected
    );


    drawWindow();

}


/* =========================================================
   MEDIAPIPE
========================================================= */

let hands = null;

let tracking = false;

let lastSend = 0;


async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands"
        );

    }


    hands =
        new Hands({

            locateFile:
            function(file){

                return (

                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +
                    file

                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.60

    });


    hands.onResults(
        onResults
    );


    tracking = true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =========================================================
   TRACKING LOOP
========================================================= */

async function trackingLoop(){

    if(!tracking){

        return;

    }


    const now =
        performance.now();


    /*
       khoảng 30 FPS
    */

    if(
        now-lastSend >= 33
        &&
        video.readyState >= 2
    ){

        lastSend = now;


        try{

            await hands.send({

                image:video

            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    startButton.disabled = true;

    errorBox.textContent = "";


    if(!window.isSecureContext){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled = false;

        return;

    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(error);


        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message
                ||
                "Không xác định"
            );


        startButton.disabled =
            false;

    }

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        tracking = false;


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>
