<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* =====================================================
   CAMERA
===================================================== */

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(1.08);
}

/* =====================================================
   CANVAS
===================================================== */

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    pointer-events:none;
}

/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#02040a;
    color:white;
    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:15px;
}

.startBox p{
    color:rgba(255,255,255,.6);
    font-size:14px;
    line-height:1.65;
}

#startButton{
    margin-top:25px;

    padding:16px 28px;

    border:0;
    border-radius:10px;

    background:white;
    color:#02040a;

    font-weight:800;
    font-size:11px;
    letter-spacing:.15em;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:14px;
    color:#ff6578;
    font-size:12px;
    line-height:1.5;
}

/* =====================================================
   INSTRUCTION
===================================================== */

#instruction{
    position:absolute;

    left:0;
    right:0;
    bottom:20px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px #000;

    pointer-events:none;

    transition:opacity .2s;
}

/* =====================================================
   FILTER NAME
===================================================== */

#filterName{
    position:absolute;

    left:50%;
    bottom:55px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:
        rgba(0,0,0,.50);

    border:
        1px solid
        rgba(255,255,255,.18);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity .25s;

    pointer-events:none;
}

/* =====================================================
   NEW DARK MENU
===================================================== */

#socialMenu{
    position:absolute;

    inset:0;

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.46);

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}

#socialPanel{
    width:min(88vw,440px);

    padding:32px 24px 24px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,24,35,.92),
            rgba(2,4,10,.94)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6),

        inset 0 1px 0
        rgba(255,255,255,.07);

    text-align:center;

    transform:scale(.92);
    opacity:0;

    transition:
        transform .28s ease,
        opacity .28s ease;
}

#socialMenu.open #socialPanel{
    transform:scale(1);
    opacity:1;
}

#socialTitle{
    color:white;
    font-size:23px;
    font-weight:800;
}

#socialSub{
    margin-top:7px;

    color:
        rgba(255,255,255,.48);

    font-size:11px;
}

.socialGrid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-top:30px;
}

.socialButton{
    height:105px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color:white;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    transition:
        transform .13s ease,
        background .13s ease,
        box-shadow .13s ease;
}

.socialButton.selected{
    transform:scale(1.08);

    background:
        rgba(255,255,255,.15);

    box-shadow:
        0 0 35px
        rgba(255,255,255,.13);
}

.socialIcon{
    width:46px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        rgba(255,255,255,.10);

    color:white;

    font-size:25px;
    font-weight:900;
}

.socialName{
    margin-top:9px;

    font-size:9px;

    color:
        rgba(255,255,255,.72);
}

#homeButton{
    width:100%;
    height:45px;

    margin-top:22px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.055);

    color:white;

    font-size:10px;
    font-weight:700;

    letter-spacing:.1em;
}

/* =====================================================
   FINGER POINTER
===================================================== */

#fingerPointer{
    position:absolute;

    z-index:90;

    width:23px;
    height:23px;

    margin-left:-11.5px;
    margin-top:-11.5px;

    border-radius:50%;

    border:
        2px solid white;

    box-shadow:
        0 0 9px white,
        0 0 25px #00eaff;

    pointer-events:none;

    opacity:0;

    transition:
        opacity .12s,
        transform .12s;
}

#fingerPointer.visible{
    opacity:1;
}

/* =====================================================
   LOADING
===================================================== */

#gestureLoading{
    position:absolute;

    inset:0;

    z-index:70;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.10);

    pointer-events:none;
}

.loadingCircle{
    width:76px;
    height:76px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:white;

    animation:
        rotateLoading .75s linear infinite;

    box-shadow:
        0 0 25px
        rgba(255,255,255,.15);
}

@keyframes rotateLoading{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .startBox h1{
        font-size:36px;
    }

    #socialPanel{
        width:90vw;
    }

    .socialButton{
        height:95px;
    }

    .socialGrid{
        gap:9px;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- ===================================================
     CAMERA
=================================================== -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- ===================================================
     TRACKING CANVAS
=================================================== -->

<canvas id="canvas"></canvas>


<!-- ===================================================
     POINTER
=================================================== -->

<div id="fingerPointer"></div>


<!-- ===================================================
     FILTER NAME
=================================================== -->

<div id="filterName">
    RAINBOW
</div>


<!-- ===================================================
     INSTRUCTION
=================================================== -->

<div id="instruction">
    ĐƯA HAI BÀN TAY VÀO CAMERA
</div>


<!-- ===================================================
     LOADING
=================================================== -->

<div id="gestureLoading">

    <div class="loadingCircle"></div>

</div>


<!-- ===================================================
     SOCIAL MENU
=================================================== -->

<div id="socialMenu">

    <div id="socialPanel">

        <div id="socialTitle">
            HANDLIGHT
        </div>

        <div id="socialSub">
            Di chuyển ngón trỏ để chọn
        </div>


        <div class="socialGrid">

            <div
                class="socialButton"
                data-url="https://www.facebook.com">

                <div class="socialIcon">
                    f
                </div>

                <div class="socialName">
                    FACEBOOK
                </div>

            </div>


            <div
                class="socialButton"
                data-url="https://www.tiktok.com">

                <div class="socialIcon">
                    ♪
                </div>

                <div class="socialName">
                    TIKTOK
                </div>

            </div>


            <div
                class="socialButton"
                data-url="https://www.instagram.com">

                <div class="socialIcon">
                    ◎
                </div>

                <div class="socialName">
                    INSTAGRAM
                </div>

            </div>

        </div>


        <button id="homeButton">
            ← HOME
        </button>

    </div>

</div>


<!-- ===================================================
     START SCREEN
=================================================== -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            HANDLIGHT
        </h1>

        <p>
            Đưa hai bàn tay vào camera.<br><br>

            Chạm ngón trỏ + ngón cái
            ở cả hai tay để mở khung.<br><br>

            Út + cái ở cả hai tay
            để đổi màu.<br><br>

            Giơ ngón trỏ lên để mở menu.
        </p>

        <button id="startButton">
            BẬT CAMERA
        </button>

        <div id="error"></div>

    </div>

</div>

</div>


<!-- ===================================================
     MEDIAPIPE
=================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>
"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const instruction =
    document.getElementById("instruction");

const filterName =
    document.getElementById("filterName");

const socialMenu =
    document.getElementById("socialMenu");

const homeButton =
    document.getElementById("homeButton");

const gestureLoading =
    document.getElementById("gestureLoading");

const fingerPointer =
    document.getElementById("fingerPointer");

const socialButtons =
    [
        ...document.querySelectorAll(
            ".socialButton"
        )
    ];


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            W * DPR
        );

    canvas.height =
        Math.round(
            H * DPR
        );

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   BONES

   Vẫn tồn tại để MediaPipe
   tracking đủ 21 điểm.

   KHÔNG VẼ RA MÀN HÌNH.
===================================================== */

const BONES = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   FILTERS
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",

        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",

        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",

        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",

        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",

        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",

        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",

        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;


/* =====================================================
   FILTER GESTURE
===================================================== */

let colorGestureHeld =
    false;

let lastFilterChange =
    0;

const COLOR_COOLDOWN =
    800;


/* =====================================================
   WINDOW
===================================================== */

let windowOpen =
    false;

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   CAMERA POINT
===================================================== */

function screenPoint(p){

    return {

        x:
            (1 - p.x) * W,

        y:
            p.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001

    );

}


/* =====================================================
   INDEX + THUMB
===================================================== */

function getIndexThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[8]
        )

        /

        getHandSize(hand)

    );

}

function indexThumbTouch(hand){

    return (

        getIndexThumbRatio(hand)

        <

        0.82

    );

}


/* =====================================================
   PINKY + THUMB
===================================================== */

function getPinkyThumbRatio(hand){

    return (

        distance(
            hand[4],
            hand[20]
        )

        /

        getHandSize(hand)

    );

}

function pinkyThumbTouch(hand){

    return (

        getPinkyThumbRatio(hand)

        <

        1.05

    );

}


/* =====================================================
   INDEX UP

   Gesture mới:
   NGÓN TRỎ CHỈ LÊN
===================================================== */

function indexPointingUp(hand){

    const tip =
        hand[8];

    const pip =
        hand[6];

    const mcp =
        hand[5];

    const wrist =
        hand[0];


    const indexExtended =
        tip.y <
        pip.y &&
        pip.y <
        mcp.y;


    const clearlyUp =
        tip.y <
        wrist.y - .06;


    /*
       Những ngón còn lại
       tương đối cụp vào.
    */

    const middleFolded =
        hand[12].y >
        hand[10].y;

    const ringFolded =
        hand[16].y >
        hand[14].y;

    const pinkyFolded =
        hand[20].y >
        hand[18].y;


    /*
       Điều kiện chính.
    */

    return (

        indexExtended &&

        clearlyUp &&

        middleFolded &&

        ringFolded &&

        pinkyFolded

    );

}


/* =====================================================
   SKELETON KHÔNG VẼ
===================================================== */

/*
   MediaPipe vẫn trả về toàn bộ
   21 landmark.

   Không gọi drawSkeleton().
*/


/* =====================================================
   WINDOW TARGETS
===================================================== */

function setWindowTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(
            left[8]
        );

    targetPoints.tr =
        screenPoint(
            right[8]
        );

    targetPoints.br =
        screenPoint(
            right[4]
        );

    targetPoints.bl =
        screenPoint(
            left[4]
        );

}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    windowPoints.tl =
        {...targetPoints.tl};

    windowPoints.tr =
        {...targetPoints.tr};

    windowPoints.br =
        {...targetPoints.br};

    windowPoints.bl =
        {...targetPoints.bl};


    windowOpen =
        true;


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;

    filterName.style.opacity =
        "1";


    instruction.textContent =
        "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";

}


/* =====================================================
   UPDATE WINDOW

   Smoothing chống rung.
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    const smooth =
        0.48;


    const keys = [
        "tl",
        "tr",
        "br",
        "bl"
    ];


    for(
        const key of keys
    ){

        windowPoints[key].x +=

            (

                targetPoints[key].x
                -
                windowPoints[key].x

            )

            *

            smooth;


        windowPoints[key].y +=

            (

                targetPoints[key].y
                -
                windowPoints[key].y

            )

            *

            smooth;

    }

}


/* =====================================================
   GRADIENT
===================================================== */

function rainbowGradient(){

    const p =
        windowPoints;


    const centerX = (

        p.tl.x +
        p.tr.x +
        p.br.x +
        p.bl.x

    ) / 4;


    const centerY = (

        p.tl.y +
        p.tr.y +
        p.br.y +
        p.bl.y

    ) / 4;


    const gradient =
        ctx.createRadialGradient(

            centerX - W*.20,

            centerY - H*.20,

            0,

            centerX,

            centerY,

            Math.max(W,H)*.75

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        gradient.addColorStop(

            i /
            (colors.length - 1),

            colors[i]

        );

    }


    return gradient;

}


/* =====================================================
   MOVING GRADIENT
===================================================== */

function movingGradient(){

    const p =
        windowPoints;


    const centerX = (

        p.tl.x +
        p.tr.x +
        p.br.x +
        p.bl.x

    ) / 4;


    const centerY = (

        p.tl.y +
        p.tr.y +
        p.br.y +
        p.bl.y

    ) / 4;


    const t =
        performance.now()
        * .00035;


    const moveX =
        Math.cos(t)
        * W
        * .35;


    const moveY =
        Math.sin(t * 1.25)
        * H
        * .35;


    const g =
        ctx.createLinearGradient(

            centerX -
            W*.70 +
            moveX,

            centerY -
            H*.70 +
            moveY,

            centerX +
            W*.70 -
            moveX,

            centerY +
            H*.70 -
            moveY

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        g.addColorStop(

            i /
            (colors.length - 1),

            colors[i]

        );

    }


    return g;

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen)
        return;


    const p =
        windowPoints;


    /*
       CLIP KHUNG
    */

    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /*
       RAINBOW
    */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .25;

    ctx.fillStyle =
        rainbowGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       MOVING COLOR
    */

    ctx.globalAlpha =
        .20;

    ctx.fillStyle =
        movingGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       GLASS
    */

    const centerX = (

        p.tl.x +
        p.tr.x +
        p.br.x +
        p.bl.x

    ) / 4;


    const centerY = (

        p.tl.y +
        p.tr.y +
        p.br.y +
        p.bl.y

    ) / 4;


    const glass =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H)*.65

        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    glass.addColorStop(
        .45,
        "rgba(255,255,255,.035)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha =
        1;

    ctx.fillStyle =
        glass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /*
       NEON BORDER
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        rainbowGradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
       INNER WHITE BORDER
    */

    ctx.shadowBlur =
        6;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth =
        1.3;

    ctx.stroke();


    ctx.restore();


    /*
       CORNER DOTS
    */

    drawWindowPoint(
        p.tl
    );

    drawWindowPoint(
        p.tr
    );

    drawWindowPoint(
        p.br
    );

    drawWindowPoint(
        p.bl
    );

}


/* =====================================================
   WINDOW POINT
===================================================== */

function drawWindowPoint(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        4.5,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        13;

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   CHANGE FILTER
===================================================== */

function nextFilter(){

    const now =
        performance.now();


    if(
        now -
        lastFilterChange
        <
        COLOR_COOLDOWN
    ){

        return;

    }


    lastFilterChange =
        now;


    filterIndex++;


    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;

    }


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;


    filterName.style.opacity =
        "1";


    clearTimeout(
        nextFilter.timer
    );


    nextFilter.timer =
        setTimeout(
            function(){

                filterName.style.opacity =
                    "0";

            },
            1200
        );

}


/* =====================================================
   OPEN SOCIAL MENU
===================================================== */

let socialMenuOpen =
    false;

let menuGestureStart =
    0;

let menuGestureActive =
    false;

const MENU_HOLD =
    700;


/* =====================================================
   OPEN MENU
===================================================== */

function openSocialMenu(){

    if(socialMenuOpen)
        return;


    socialMenuOpen =
        true;


    gestureLoading.style.display =
        "none";


    socialMenu.style.display =
        "flex";


    requestAnimationFrame(
        function(){

            socialMenu.classList.add(
                "open"
            );

        }
    );


    instruction.textContent =
        "ĐƯA NGÓN TRỎ ĐẾN NÚT BẠN MUỐN CHỌN";


    fingerPointer.classList.add(
        "visible"
    );

}


/* =====================================================
   CLOSE MENU
===================================================== */

function closeSocialMenu(){

    socialMenuOpen =
        false;


    socialMenu.classList.remove(
        "open"
    );


    socialButtons.forEach(
        function(button){

            button.classList.remove(
                "selected"
            );

        }
    );


    setTimeout(
        function(){

            if(!socialMenuOpen){

                socialMenu.style.display =
                    "none";

            }

        },
        300
    );


    fingerPointer.classList.remove(
        "visible"
    );


    instruction.textContent =
        windowOpen

        ?

        "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG"

        :

        "ĐƯA HAI BÀN TAY VÀO CAMERA";

}


/* =====================================================
   INDEX POINTER
===================================================== */

let pointerX = 0;
let pointerY = 0;

let pointerTargetX = 0;
let pointerTargetY = 0;


/*
   Smooth nhưng bám rất nhanh.
*/

const POINTER_SMOOTH =
    .58;


function updatePointer(hand){

    const point =
        screenPoint(
            hand[8]
        );


    pointerTargetX =
        point.x;

    pointerTargetY =
        point.y;


    pointerX +=
        (
            pointerTargetX -
            pointerX
        )
        *
        POINTER_SMOOTH;


    pointerY +=
        (
            pointerTargetY -
            pointerY
        )
        *
        POINTER_SMOOTH;


    fingerPointer.style.left =
        pointerX + "px";

    fingerPointer.style.top =
        pointerY + "px";

}


/* =====================================================
   BUTTON POINTER
===================================================== */

let selectedButton =
    null;

let buttonEnterTime =
    0;

const BUTTON_HOLD =
    250;


function updateSocialButtons(){

    if(!socialMenuOpen)
        return;


    let found =
        null;


    for(
        const button
        of socialButtons
    ){

        const rect =
            button.getBoundingClientRect();


        const padding =
            25;


        if(

            pointerX >
            rect.left -
            padding

            &&

            pointerX <
            rect.right +
            padding

            &&

            pointerY >
            rect.top -
            padding

            &&

            pointerY <
            rect.bottom +
            padding

        ){

            found =
                button;

            break;

        }

    }


    socialButtons.forEach(
        function(button){

            button.classList.toggle(
                "selected",
                button === found
            );

        }
    );


    if(
        found !==
        selectedButton
    ){

        selectedButton =
            found;

        buttonEnterTime =
            performance.now();

        return;

    }


    if(found){

        if(

            performance.now() -
            buttonEnterTime
            >=
            BUTTON_HOLD

        ){

            const url =
                found.dataset.url;


            /*
               Mở trang trong tab mới.
            */

            window.open(
                url,
                "_blank"
            );


            buttonEnterTime =
                performance.now()
                + 100000;

        }

    }

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    /*
       KHÔNG CÓ TAY
    */

    if(
        detected.length === 0
    ){

        if(
            !socialMenuOpen
        ){

            gestureLoading.style.display =
                "none";

            menuGestureActive =
                false;

            menuGestureStart =
                0;

        }

        return;

    }


    /*
       XÁC ĐỊNH TAY TRÁI / PHẢI
    */

    let handA =
        detected[0];

    let handB =
        detected.length > 1
        ?
        detected[1]
        :
        null;


    /*
       MENU ĐANG MỞ
    */

    if(
        socialMenuOpen
    ){

        /*
           Chọn bàn tay lớn hơn.
        */

        let pointerHand =
            handA;


        if(handB){

            if(
                getHandSize(handB)
                >
                getHandSize(handA)
            ){

                pointerHand =
                    handB;

            }

        }


        updatePointer(
            pointerHand
        );


        updateSocialButtons();

        return;

    }


    /*
       Nếu chỉ có 1 tay
       thì vẫn kiểm tra gesture menu.
    */

    if(
        detected.length === 1
    ){

        if(
            indexPointingUp(
                handA
            )
        ){

            if(
                !menuGestureActive
            ){

                menuGestureActive =
                    true;

                menuGestureStart =
                    performance.now();

                gestureLoading.style.display =
                    "flex";

            }


            if(
                performance.now() -
                menuGestureStart
                >=
                MENU_HOLD
            ){

                openSocialMenu();

                menuGestureActive =
                    false;

            }

        }
        else{

            gestureLoading.style.display =
                "none";

            menuGestureActive =
                false;

        }

        return;

    }


    /*
       2 TAY
    */

    const xA =
        screenPoint(
            handA[9]
        ).x;


    const xB =
        screenPoint(
            handB[9]
        ).x;


    let left;
    let right;


    if(
        xA < xB
    ){

        left =
            handA;

        right =
            handB;

    }
    else{

        left =
            handB;

        right =
            handA;

    }


    /*
       INDEX + THUMB
    */

    const leftIndex =
        indexThumbTouch(
            left
        );

    const rightIndex =
        indexThumbTouch(
            right
        );


    /*
       PINKY + THUMB
    */

    const leftPinky =
        pinkyThumbTouch(
            left
        );

    const rightPinky =
        pinkyThumbTouch(
            right
        );


    /*
       GESTURE MỞ MENU
       Nếu cả hai ngón trỏ
       cùng chỉ lên.
    */

    const bothPointing =
        indexPointingUp(left)
        &&
        indexPointingUp(right);


    if(
        bothPointing
    ){

        if(
            !menuGestureActive
        ){

            menuGestureActive =
                true;

            menuGestureStart =
                performance.now();

            gestureLoading.style.display =
                "flex";

        }


        if(
            performance.now() -
            menuGestureStart
            >=
            MENU_HOLD
        ){

            openSocialMenu();

            menuGestureActive =
                false;

        }

    }
    else{

        /*
           Nếu đang tạo khung
           thì không để gesture menu
           làm ảnh hưởng.
        */

        if(
            !windowOpen
            ||
            !(leftIndex && rightIndex)
        ){

            gestureLoading.style.display =
                "none";

            menuGestureActive =
                false;

        }

    }


    /*
       KHUNG CỬA SỔ CŨ
    */

    if(
        !windowOpen
    ){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );

        }

        return;

    }


    /*
       UPDATE KHUNG
    */

    updateWindow(
        left,
        right
    );


    /*
       ĐỔI MÀU
    */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if(
        bothPinky
    ){

        if(
            !colorGestureHeld
        ){

            nextFilter();

            colorGestureHeld =
                true;

        }

    }
    else{

        colorGestureHeld =
            false;

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(
    results
){

    /*
       Clear canvas.
       KHÔNG vẽ skeleton.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        ||
        [];


    processHands(
        detected
    );


    /*
       KHUNG CỬA SỔ
       vẫn được vẽ.
    */

    drawWindow();

}


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands =
    null;

let tracking =
    false;

let lastSend =
    0;


async function startTracking(){

    if(
        !window.Hands
    ){

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    hands =
        new Hands({

            locateFile:
            function(file){

                return (

                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +
                    file

                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    hands.onResults(
        onResults
    );


    tracking =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(
        !tracking
    ){

        return;

    }


    const now =
        performance.now();


    if(

        now -
        lastSend
        >=
        30

        &&

        video.readyState
        >=
        2

    ){

        lastSend =
            now;


        try{

            await hands.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;


    errorBox.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        if(

            !navigator.mediaDevices

            ||

            !navigator.mediaDevices
                .getUserMedia

        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:"user"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message
                ||
                "Unknown error"
            );


        startButton.disabled =
            false;

    }

}


/* =====================================================
   HOME
===================================================== */

homeButton.addEventListener(
    "click",
    function(){

        closeSocialMenu();

    }
);


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        tracking =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }

    }
);
