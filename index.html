<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover,
             user-scalable=no"
>

<title>HANDLIGHT</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}


/* =====================================================
   CAMERA
===================================================== */

#video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.84)
        contrast(1.05)
        saturate(1.08);
}


/* =====================================================
   CANVAS
===================================================== */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#02040a;

    color:white;

    text-align:center;
}

.startBox{

    width:min(88vw,420px);
}

.startBox h1{

    font-size:42px;

    letter-spacing:-.05em;

    margin-bottom:15px;
}

.startBox p{

    color:rgba(255,255,255,.62);

    font-size:14px;

    line-height:1.65;
}

#startButton{

    margin-top:25px;

    padding:16px 28px;

    border:0;

    border-radius:8px;

    background:white;

    color:#02040a;

    font-weight:800;

    font-size:11px;

    letter-spacing:.15em;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .2s ease;
}

#startButton:hover{

    transform:scale(1.04);

    box-shadow:
        0 0 25px
        rgba(255,255,255,.3);
}

#startButton:active{

    transform:scale(.96);
}

#startButton:disabled{

    opacity:.5;

    cursor:wait;
}

#error{

    margin-top:14px;

    color:#ff6578;

    font-size:12px;

    line-height:1.5;
}


/* =====================================================
   INSTRUCTION
===================================================== */

#instruction{

    position:absolute;

    left:0;
    right:0;

    bottom:18px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px #000;

    opacity:.85;

    pointer-events:none;

    transition:
        opacity .25s ease;
}


/* =====================================================
   FILTER NAME
===================================================== */

#filterName{

    position:absolute;

    left:50%;

    bottom:50px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.16);

    color:white;

    font:
        10px Consolas,monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:
        opacity .25s ease;

    pointer-events:none;
}


/* =====================================================
   SPOKEN TEXT
===================================================== */

#spokenText{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.96);

    width:min(70vw,700px);

    z-index:20;

    color:white;

    text-align:center;

    font-size:
        clamp(20px,4vw,52px);

    font-weight:700;

    line-height:1.25;

    letter-spacing:.02em;

    text-shadow:

        0 0 8px
        rgba(255,255,255,.95),

        0 0 22px
        rgba(0,234,255,.75),

        0 0 45px
        rgba(0,234,255,.35);

    pointer-events:none;

    opacity:0;

    transition:

        opacity .25s ease,

        transform .25s ease;
}

#spokenText.active{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #instruction{

        font-size:11px;

        bottom:
            calc(
                14px +
                env(safe-area-inset-bottom)
            );
    }

    #spokenText{

        width:78vw;

        font-size:
            clamp(18px,6vw,34px);
    }

}

</style>
</head>


<body>

<div id="app">


<!-- ===================================================
     CAMERA
=================================================== -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- ===================================================
     CANVAS
=================================================== -->

<canvas id="canvas"></canvas>


<!-- ===================================================
     FILTER NAME
=================================================== -->

<div id="filterName">
    RAINBOW
</div>


<!-- ===================================================
     SPOKEN TEXT
=================================================== -->

<div id="spokenText"></div>


<!-- ===================================================
     INSTRUCTION
=================================================== -->

<div id="instruction">
    ĐƯA HAI BÀN TAY VÀO CAMERA
</div>


<!-- ===================================================
     START SCREEN
=================================================== -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            HANDLIGHT
        </h1>

        <p>

            Đưa hai bàn tay vào camera.

            <br><br>

            Chạm
            <b>ngón trỏ + ngón cái</b>
            ở cả hai tay để mở khung.

            <br><br>

            Chạm
            <b>ngón út + ngón cái</b>
            ở cả hai tay để đổi màu.

            <br><br>

            Chạm
            <b>ngón giữa + ngón cái</b>
            ở cả hai tay để khóa khung
            và nói.

        </p>

        <button id="startButton">
            BẬT CAMERA
        </button>

        <div id="error"></div>

    </div>

</div>


</div>


<!-- ===================================================
     MEDIAPIPE
=================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha:true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const instruction =
    document.getElementById("instruction");

const filterName =
    document.getElementById("filterName");

const spokenText =
    document.getElementById("spokenText");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   FILTERS
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",

        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",

        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",

        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",

        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",

        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",

        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",

        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];


let filterIndex = 0;

let lastFilterChange = 0;

const COLOR_COOLDOWN = 800;


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;

let windowLocked = false;


const windowPoints = {

    tl:{x:0,y:0},

    tr:{x:0,y:0},

    br:{x:0,y:0},

    bl:{x:0,y:0}
};


const targetPoints = {

    tl:{x:0,y:0},

    tr:{x:0,y:0},

    br:{x:0,y:0},

    bl:{x:0,y:0}
};


/* =====================================================
   TRACKING STABILITY
===================================================== */

let lastLeftHand = null;
let lastRightHand = null;

let missingFrames = 0;

const MAX_MISSING_FRAMES = 12;


/* =====================================================
   SMOOTHING
===================================================== */

const SMOOTHING = .42;


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* =====================================================
   SCREEN POINT
===================================================== */

function screenPoint(p){

    return {

        x:
            (1 - p.x) * W,

        y:
            p.y * H
    };
}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        .0001
    );
}


/* =====================================================
   INDEX + THUMB
===================================================== */

function indexThumbTouch(hand){

    const ratio =

        distance(
            hand[4],
            hand[8]
        )
        /
        getHandSize(hand);

    return ratio < .82;
}


/* =====================================================
   PINKY + THUMB
===================================================== */

function pinkyThumbTouch(hand){

    const ratio =

        distance(
            hand[4],
            hand[20]
        )
        /
        getHandSize(hand);

    return ratio < 1.05;
}


/* =====================================================
   MIDDLE + THUMB
===================================================== */

function middleThumbTouch(hand){

    const ratio =

        distance(
            hand[4],
            hand[12]
        )
        /
        getHandSize(hand);

    return ratio < .72;
}


/* =====================================================
   HAND CENTER
===================================================== */

function handCenter(hand){

    return screenPoint(
        hand[9]
    );
}


/* =====================================================
   IDENTIFY LEFT / RIGHT
===================================================== */

function identifyHands(detected){

    if(
        detected.length < 2
    ){
        return null;
    }

    const a =
        handCenter(
            detected[0]
        );

    const b =
        handCenter(
            detected[1]
        );

    let left;
    let right;

    /*
       Không dùng handedness của MediaPipe.

       Dùng vị trí thực tế trên màn hình
       để tránh trường hợp tay bị đổi nhãn.
    */

    if(a.x < b.x){

        left =
            detected[0];

        right =
            detected[1];

    }
    else{

        left =
            detected[1];

        right =
            detected[0];
    }


    /*
       Nếu đang tracking ổn định,
       kiểm tra khoảng cách với vị trí
       cũ để hạn chế đổi tay đột ngột.
    */

    if(
        lastLeftHand &&
        lastRightHand
    ){

        const newLeft =
            handCenter(left);

        const newRight =
            handCenter(right);

        const oldLeft =
            screenPoint(
                lastLeftHand[9]
            );

        const oldRight =
            screenPoint(
                lastRightHand[9]
            );

        const normalCost =

            distance(
                newLeft,
                oldLeft
            )
            +
            distance(
                newRight,
                oldRight
            );

        const swappedCost =

            distance(
                newRight,
                oldLeft
            )
            +
            distance(
                newLeft,
                oldRight
            );

        /*
           Chỉ đổi nếu phương án mới
           thực sự hợp lý hơn rõ rệt.
        */

        if(
            swappedCost + 80 <
            normalCost
        ){

            const temp =
                left;

            left =
                right;

            right =
                temp;
        }
    }


    lastLeftHand =
        left;

    lastRightHand =
        right;


    return {
        left,
        right
    };
}


/* =====================================================
   SET WINDOW TARGETS
===================================================== */

function setWindowTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(
            left[8]
        );

    targetPoints.tr =
        screenPoint(
            right[8]
        );

    targetPoints.br =
        screenPoint(
            right[4]
        );

    targetPoints.bl =
        screenPoint(
            left[4]
        );
}


/* =====================================================
   SMOOTH WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    const keys = [
        "tl",
        "tr",
        "br",
        "bl"
    ];


    for(
        const key of keys
    ){

        windowPoints[key].x +=

            (
                targetPoints[key].x -
                windowPoints[key].x
            )
            *
            SMOOTHING;


        windowPoints[key].y +=

            (
                targetPoints[key].y -
                windowPoints[key].y
            )
            *
            SMOOTHING;
    }
}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    for(
        const key of [
            "tl",
            "tr",
            "br",
            "bl"
        ]
    ){

        windowPoints[key] = {

            x:
                targetPoints[key].x,

            y:
                targetPoints[key].y
        };
    }


    windowOpen = true;

    windowLocked = false;


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;

    filterName.style.opacity =
        "1";


    instruction.textContent =
        "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";
}


/* =====================================================
   GRADIENT
===================================================== */

function createGradient(){

    const p =
        windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const t =
        performance.now()
        * .00035;


    const moveX =
        Math.cos(t)
        * W
        * .35;


    const moveY =
        Math.sin(t * 1.25)
        * H
        * .35;


    const gradient =
        ctx.createLinearGradient(

            centerX -
            W * .7 +
            moveX,

            centerY -
            H * .7 +
            moveY,

            centerX +
            W * .7 -
            moveX,

            centerY +
            H * .7 -
            moveY
        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        gradient.addColorStop(

            i /
            (colors.length - 1),

            colors[i]
        );
    }


    return gradient;
}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen){
        return;
    }


    const p =
        windowPoints;


    /* ================================================
       WINDOW CLIP
    ================================================= */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /* ================================================
       MULTICOLOR GLASS
    ================================================= */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .30;

    ctx.fillStyle =
        createGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ================================================
       WHITE GLASS
    ================================================= */

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const glass =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H) * .65
        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.12)"
    );

    glass.addColorStop(
        .5,
        "rgba(255,255,255,.035)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle =
        glass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /* ================================================
       NEON BORDER
    ================================================= */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        createGradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        windowLocked
        ? 28
        : 20;

    ctx.stroke();


    /* ================================================
       INNER WHITE BORDER
    ================================================= */

    ctx.shadowBlur =
        7;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth =
        1.3;

    ctx.stroke();


    ctx.restore();


    /* ================================================
       CORNERS
    ================================================= */

    drawCorner(
        p.tl
    );

    drawCorner(
        p.tr
    );

    drawCorner(
        p.br
    );

    drawCorner(
        p.bl
    );
}


/* =====================================================
   CORNER
===================================================== */

function drawCorner(p){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        4.5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        windowLocked
        ? 22
        : 14;

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   CHANGE FILTER
===================================================== */

function nextFilter(){

    const now =
        performance.now();


    if(
        now -
        lastFilterChange
        <
        COLOR_COOLDOWN
    ){

        return;
    }


    lastFilterChange =
        now;


    filterIndex++;


    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;
    }


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;


    filterName.style.opacity =
        "1";


    clearTimeout(
        nextFilter.timer
    );


    nextFilter.timer =
        setTimeout(
            function(){

                filterName.style.opacity =
                    "0";

            },
            1200
        );
}


/* =====================================================
   VOICE RECOGNITION
===================================================== */

let recognition = null;

let voiceActive = false;


function setupVoice(){

    const SpeechRecognition =

        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        console.warn(
            "Speech Recognition không được hỗ trợ."
        );

        return false;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "vi-VN";


    recognition.continuous =
        true;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onresult =
        function(event){

            let text = "";


            for(
                let i =
                    event.resultIndex;

                i <
                event.results.length;

                i++
            ){

                text +=
                    event.results[i][0].transcript;
            }


            text =
                text.trim();


            if(text){

                spokenText.textContent =
                    text;

                spokenText.classList.add(
                    "active"
                );
            }
        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech:",
                event.error
            );
        };


    recognition.onend =
        function(){

            if(
                voiceActive &&
                windowLocked
            ){

                setTimeout(
                    startVoice,
                    100
                );
            }
        };


    return true;
}


/* =====================================================
   START VOICE
===================================================== */

function startVoice(){

    if(!recognition){

        if(
            !setupVoice()
        ){

            return;
        }
    }


    if(voiceActive){
        return;
    }


    voiceActive =
        true;


    try{

        recognition.start();

    }
    catch(error){

        console.log(
            "Voice start:",
            error
        );
    }
}


/* =====================================================
   STOP VOICE
===================================================== */

function stopVoice(){

    voiceActive =
        false;


    if(recognition){

        try{

            recognition.stop();

        }
        catch(error){}
    }
}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    /* ================================================
       NO HANDS
    ================================================= */

    if(
        detected.length === 0
    ){

        missingFrames++;

        if(
            missingFrames >
            MAX_MISSING_FRAMES
        ){

            lastLeftHand = null;

            lastRightHand = null;
        }

        return;
    }


    missingFrames = 0;


    /* ================================================
       ONLY ONE HAND
    ================================================= */

    if(
        detected.length < 2
    ){

        return;
    }


    /* ================================================
       IDENTIFY HANDS
    ================================================= */

    const pair =
        identifyHands(
            detected
        );


    if(!pair){
        return;
    }


    const left =
        pair.left;

    const right =
        pair.right;


    /* ================================================
       GESTURES
    ================================================= */

    const leftIndex =
        indexThumbTouch(
            left
        );

    const rightIndex =
        indexThumbTouch(
            right
        );


    const leftPinky =
        pinkyThumbTouch(
            left
        );

    const rightPinky =
        pinkyThumbTouch(
            right
        );


    const leftMiddle =
        middleThumbTouch(
            left
        );

    const rightMiddle =
        middleThumbTouch(
            right
        );


    const bothIndex =
        leftIndex &&
        rightIndex;


    const bothPinky =
        leftPinky &&
        rightPinky;


    const bothMiddle =
        leftMiddle &&
        rightMiddle;


    /* ================================================
       OPEN WINDOW
    ================================================= */

    if(!windowOpen){

        if(bothIndex){

            createWindow(
                left,
                right
            );

        }

        return;
    }


    /* ================================================
       LOCK WINDOW
    ================================================= */

    if(bothMiddle){

        if(!windowLocked){

            windowLocked =
                true;


            /*
               Khung KHÔNG update nữa.
               Nó giữ nguyên vị trí.
            */

            instruction.textContent =
                "🔒 ĐÃ KHÓA KHUNG — HÃY NÓI";


            startVoice();

        }


        return;
    }


    /* ================================================
       UNLOCK
    ================================================= */

    if(windowLocked){

        windowLocked =
            false;


        stopVoice();


        instruction.textContent =
            "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";

    }


    /* ================================================
       NORMAL WINDOW TRACKING
    ================================================= */

    updateWindow(
        left,
        right
    );


    /* ================================================
       COLOR CHANGE
    ================================================= */

    if(bothPinky){

        nextFilter();

        instruction.textContent =
            "🌈 ĐÃ ĐỔI MÀU";

    }
    else{

        instruction.textContent =
            "ÚT + CÁI 2 TAY = ĐỔI MÀU";
    }
}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(
    results
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks ||
        [];


    processHands(
        detected
    );


    drawWindow();
}


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;


async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands."
        );
    }


    hands =
        new Hands({

            locateFile:
                function(file){

                    return (

                        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                        +
                        file
                    );
                }
        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.60
    });


    hands.onResults(
        onResults
    );


    tracking =
        true;


    requestAnimationFrame(
        trackingLoop
    );
}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking){
        return;
    }


    const now =
        performance.now();


    /*
       ~30 FPS.
    */

    if(

        now -
        lastSend >=
        33

        &&

        video.readyState >= 2

    ){

        lastSend =
            now;


        try{

            await hands.send({

                image:
                    video
            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );
        }
    }


    requestAnimationFrame(
        trackingLoop
    );
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;


    errorBox.textContent =
        "";


    if(!window.isSecureContext){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";


        startButton.disabled =
            false;


        return;
    }


    try{

        if(

            !navigator.mediaDevices ||

            !navigator.mediaDevices
                .getUserMedia

        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );
        }


        const stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:"user"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }
                    }
                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorBox.textContent =

            "Không mở được camera: "
            +
            (
                error.message ||
                "Unknown error"
            );


        startButton.disabled =
            false;
    }
}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        tracking =
            false;


        stopVoice();


        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();
                    }
                );
        }
    }
);

</script>
