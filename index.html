<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>SpeedCam Mobile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    background:#05070a;
}

#camera{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    background:#000;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:
        calc(14px + env(safe-area-inset-top))
        15px
        15px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    background:linear-gradient(
        rgba(0,0,0,.7),
        rgba(0,0,0,0)
    );
}

.logo{
    font-size:18px;
    font-weight:800;
    letter-spacing:2px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    opacity:.9;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.dot.on{
    background:#00ff91;
    box-shadow:0 0 12px #00ff91;
}

#speedBox{
    position:absolute;
    top:85px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;

    padding:12px 22px;
    min-width:190px;

    background:rgba(0,0,0,.52);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;

    backdrop-filter:blur(12px);
}

#speed{
    font-size:46px;
    font-weight:900;
    line-height:1;
}

.unit{
    margin-top:5px;
    font-size:13px;
    letter-spacing:2px;
    opacity:.65;
}

#info{
    position:absolute;
    left:15px;
    right:15px;
    bottom:145px;

    padding:13px;

    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;

    backdrop-filter:blur(12px);
}

.row{
    display:flex;
    justify-content:space-between;
    margin:5px 0;
    font-size:14px;
}

.value{
    font-weight:bold;
}

#controls{
    position:absolute;
    left:15px;
    right:15px;
    bottom:
        calc(18px + env(safe-area-inset-bottom));

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

button{
    border:0;
    border-radius:14px;
    padding:14px 10px;

    color:white;
    background:rgba(20,25,32,.9);

    border:1px solid rgba(255,255,255,.13);

    font-size:13px;
    font-weight:700;
}

button:active{
    transform:scale(.97);
}

.primary{
    background:#1677ff;
}

.danger{
    background:#d71938;
}

#startScreen{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #172235 0%,
            #05070a 60%
        );

    padding:25px;
}

#startScreen h1{
    font-size:32px;
    letter-spacing:3px;
    margin-bottom:12px;
}

#startScreen p{
    max-width:330px;
    line-height:1.6;
    opacity:.65;
    margin-bottom:28px;
}

#startBtn{
    width:230px;
    padding:17px;
    background:#1677ff;
    border-radius:16px;
    font-size:15px;
    box-shadow:0 0 30px rgba(22,119,255,.35);
}

#setup{
    position:absolute;
    inset:0;
    z-index:15;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
}

.panel{
    width:100%;
    max-width:360px;

    padding:22px;

    background:#10151c;
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
}

.panel h2{
    margin-bottom:18px;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:7px;
    font-size:13px;
    opacity:.7;
}

input{
    width:100%;
    padding:14px;

    border-radius:12px;
    border:1px solid #303944;

    background:#070a0e;
    color:white;

    outline:none;
    font-size:16px;
}

.panelButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:20px;
}

#warning{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    z-index:10;

    display:none;

    padding:14px 24px;

    border-radius:50px;

    background:#e50032;
    box-shadow:0 0 35px rgba(229,0,50,.55);

    font-size:20px;
    font-weight:900;
}

.small{
    font-size:11px;
    opacity:.5;
    text-align:center;
    margin-top:12px;
}
</style>
</head>

<body>

<div id="app">

    <video id="camera"
           autoplay
           playsinline
           muted></video>

    <canvas id="canvas"></canvas>

    <div id="top">

        <div class="logo">
            SPEEDCAM
        </div>

        <div class="status">
            <span id="dot" class="dot"></span>
            <span id="statusText">CAMERA OFF</span>
        </div>

    </div>

    <div id="speedBox">

        <div id="speed">0</div>

        <div class="unit">
            KM/H
        </div>

    </div>

    <div id="warning">
        SPEED LIMIT
    </div>

    <div id="info">

        <div class="row">
            <span>Khoảng cách</span>
            <span class="value">
                <span id="distanceDisplay">10</span> m
            </span>
        </div>

        <div class="row">
            <span>Giới hạn</span>
            <span class="value">
                <span id="limitDisplay">50</span> km/h
            </span>
        </div>

        <div class="row">
            <span>Trạng thái</span>
            <span class="value" id="measurementStatus">
                Đang chờ
            </span>
        </div>

    </div>

    <div id="controls">

        <button class="primary" id="measureBtn">
            BẮT ĐẦU ĐO
        </button>

        <button id="settingsBtn">
            CÀI ĐẶT
        </button>

        <button id="line1Btn">
            ĐẶT VẠCH 1
        </button>

        <button id="line2Btn">
            ĐẶT VẠCH 2
        </button>

    </div>


    <div id="startScreen">

        <h1>SPEEDCAM</h1>

        <p>
            Camera sẽ được sử dụng để phát hiện
            chuyển động và ước tính tốc độ của
            vật thể đi qua hai vạch đo.
        </p>

        <button id="startBtn">
            📷 BẬT CAMERA
        </button>

    </div>


    <div id="setup">

        <div class="panel">

            <h2>⚙ Cài đặt</h2>

            <label>
                Khoảng cách giữa 2 vạch (m)
            </label>

            <input
                id="distanceInput"
                type="number"
                min="0.1"
                step="0.1"
                value="10">

            <label>
                Giới hạn tốc độ (km/h)
            </label>

            <input
                id="limitInput"
                type="number"
                min="1"
                step="1"
                value="50">

            <div class="panelButtons">

                <button id="cancelSettings">
                    HỦY
                </button>

                <button class="primary"
                        id="saveSettings">
                    LƯU
                </button>

            </div>

            <div class="small">
                Khoảng cách càng chính xác,
                kết quả càng đáng tin cậy.
            </div>

        </div>

    </div>

</div>


<script>

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently:true
    });

const startScreen =
    document.getElementById("startScreen");

const startBtn =
    document.getElementById("startBtn");

const dot =
    document.getElementById("dot");

const statusText =
    document.getElementById("statusText");

const speedElement =
    document.getElementById("speed");

const measurementStatus =
    document.getElementById(
        "measurementStatus"
    );

const warning =
    document.getElementById("warning");

const setup =
    document.getElementById("setup");

const distanceInput =
    document.getElementById(
        "distanceInput"
    );

const limitInput =
    document.getElementById(
        "limitInput"
    );

const distanceDisplay =
    document.getElementById(
        "distanceDisplay"
    );

const limitDisplay =
    document.getElementById(
        "limitDisplay"
    );

const measureBtn =
    document.getElementById(
        "measureBtn"
    );

const settingsBtn =
    document.getElementById(
        "settingsBtn"
    );

const line1Btn =
    document.getElementById(
        "line1Btn"
    );

const line2Btn =
    document.getElementById(
        "line2Btn"
    );


let stream = null;

let running = false;

let measuring = false;

let line1 = 0.38;

let line2 = 0.62;

let distanceMeters = 10;

let speedLimit = 50;

let previousFrame = null;

let lastMotion = 0;

let crossingState = 0;

let firstCrossTime = 0;

let secondCrossTime = 0;

let currentSpeed = 0;

let motionHistory = [];


/* =========================
   CAMERA
========================= */

async function startCamera(){

    try{

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });

        video.srcObject = stream;

        await video.play();

        startScreen.style.display =
            "none";

        dot.classList.add("on");

        statusText.textContent =
            "CAMERA ON";

        running = true;

        resizeCanvas();

        requestAnimationFrame(loop);

    }catch(error){

        console.error(error);

        alert(
            "Không thể mở camera.\n\n" +
            "Hãy cho phép trình duyệt sử dụng camera " +
            "và mở website bằng HTTPS hoặc localhost."
        );

    }

}


startBtn.addEventListener(
    "click",
    startCamera
);


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    canvas.width =
        video.videoWidth ||
        window.innerWidth;

    canvas.height =
        video.videoHeight ||
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   DRAW MEASUREMENT LINES
========================= */

function drawLines(){

    if(!canvas.width || !canvas.height)
        return;

    const y1 =
        canvas.height * line1;

    const y2 =
        canvas.height * line2;

    ctx.save();

    ctx.lineWidth = 4;

    ctx.setLineDash([14,10]);

    ctx.strokeStyle =
        "rgba(0,255,150,.9)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        y1
    );

    ctx.lineTo(
        canvas.width,
        y1
    );

    ctx.stroke();


    ctx.strokeStyle =
        "rgba(255,80,90,.9)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        y2
    );

    ctx.lineTo(
        canvas.width,
        y2
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.font =
        "bold 15px Arial";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        "VẠCH 1",
        15,
        y1 - 10
    );

    ctx.fillText(
        "VẠCH 2",
        15,
        y2 - 10
    );

    ctx.restore();

}


/* =========================
   MOTION DETECTION
========================= */

function detectMotion(){

    if(
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    )
        return;

    const w = 160;
    const h = 120;

    const temp =
        document.createElement("canvas");

    temp.width = w;
    temp.height = h;

    const tctx =
        temp.getContext("2d", {
            willReadFrequently:true
        });

    tctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    const frame =
        tctx.getImageData(
            0,
            0,
            w,
            h
        );

    if(!previousFrame){

        previousFrame =
            frame.data.slice();

        return;

    }


    let totalDifference = 0;

    let changedPixels = 0;


    /*
       Chỉ kiểm tra vùng giữa màn hình.
       Điều này giúp giảm nhiễu.
    */

    for(
        let y = 10;
        y < h - 10;
        y += 3
    ){

        for(
            let x = 10;
            x < w - 10;
            x += 3
        ){

            const i =
                (y * w + x) * 4;

            const r =
                Math.abs(
                    frame.data[i] -
                    previousFrame[i]
                );

            const g =
                Math.abs(
                    frame.data[i+1] -
                    previousFrame[i+1]
                );

            const b =
                Math.abs(
                    frame.data[i+2] -
                    previousFrame[i+2]
                );

            const diff =
                (r + g + b) / 3;

            if(diff > 35){

                totalDifference +=
                    diff;

                changedPixels++;

            }

        }

    }


    previousFrame =
        frame.data.slice();


    const motion =
        changedPixels > 0
        ? totalDifference / changedPixels
        : 0;


    motionHistory.push(motion);

    if(motionHistory.length > 8)
        motionHistory.shift();


    const average =
        motionHistory.reduce(
            (a,b)=>a+b,
            0
        ) /
        motionHistory.length;


    /*
       Tạo tín hiệu chuyển động
    */

    if(
        average > 42 &&
        Date.now() - lastMotion > 180
    ){

        lastMotion =
            Date.now();

        registerCrossing();

    }

}


/* =========================
   SPEED MEASUREMENT
========================= */

function registerCrossing(){

    if(!measuring)
        return;


    const now =
        performance.now();


    /*
       Lần đầu:
       vật thể bắt đầu đi qua vùng đo
    */

    if(crossingState === 0){

        crossingState = 1;

        firstCrossTime = now;

        measurementStatus.textContent =
            "Đã qua vạch 1";

        return;

    }


    /*
       Lần thứ hai
    */

    if(crossingState === 1){

        /*
           Chống nhận nhầm nhiều frame
        */

        if(
            now - firstCrossTime <
            250
        ){

            return;

        }


        secondCrossTime = now;


        const seconds =
            (
                secondCrossTime -
                firstCrossTime
            ) / 1000;


        if(
            seconds <= 0 ||
            seconds > 30
        ){

            resetMeasurement();

            return;

        }


        /*
           m/s
        */

        const metersPerSecond =
            distanceMeters /
            seconds;


        /*
           km/h
        */

        currentSpeed =
            metersPerSecond *
            3.6;


        speedElement.textContent =
            currentSpeed.toFixed(1);


        measurementStatus.textContent =
            "Đã đo xong";


        if(
            currentSpeed >
            speedLimit
        ){

            warning.style.display =
                "block";

            setTimeout(
                ()=>{
                    warning.style.display =
                        "none";
                },
                1500
            );

        }


        crossingState = 2;


        setTimeout(
            resetMeasurement,
            1500
        );

    }

}


function resetMeasurement(){

    crossingState = 0;

    firstCrossTime = 0;

    secondCrossTime = 0;

    measurementStatus.textContent =
        measuring
        ? "Đang chờ vật thể"
        : "Đang chờ";

}


/* =========================
   MAIN LOOP
========================= */

function loop(){

    if(!running)
        return;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawLines();


    if(measuring){

        detectMotion();

    }


    requestAnimationFrame(loop);

}


/* =========================
   START / STOP
========================= */

measureBtn.addEventListener(
    "click",
    ()=>{

        measuring =
            !measuring;

        if(measuring){

            measureBtn.textContent =
                "⏹ DỪNG ĐO";

            measurementStatus.textContent =
                "Đang chờ vật thể";

            resetMeasurement();

        }else{

            measureBtn.textContent =
                "▶ BẮT ĐẦU ĐO";

            measurementStatus.textContent =
                "Đã dừng";

        }

    }
);


/* =========================
   SETTINGS
========================= */

settingsBtn.addEventListener(
    "click",
    ()=>{

        distanceInput.value =
            distanceMeters;

        limitInput.value =
            speedLimit;

        setup.style.display =
            "flex";

    }
);


document.getElementById(
    "cancelSettings"
).addEventListener(
    "click",
    ()=>{

        setup.style.display =
            "none";

    }
);


document.getElementById(
    "saveSettings"
).addEventListener(
    "click",
    ()=>{

        const d =
            parseFloat(
                distanceInput.value
            );

        const l =
            parseFloat(
                limitInput.value
            );


        if(
            !Number.isFinite(d) ||
            d <= 0
        ){

            alert(
                "Khoảng cách không hợp lệ."
            );

            return;

        }


        if(
            !Number.isFinite(l) ||
            l <= 0
        ){

            alert(
                "Giới hạn tốc độ không hợp lệ."
            );

            return;

        }


        distanceMeters = d;

        speedLimit = l;


        distanceDisplay.textContent =
            distanceMeters;

        limitDisplay.textContent =
            speedLimit;


        setup.style.display =
            "none";

    }
);


/* =========================
   SET MEASUREMENT LINES
========================= */

line1Btn.addEventListener(
    "click",
    ()=>{

        /*
           Đặt vạch 1 tại vị trí
           tương đối trong camera.
        */

        line1 = 0.40;

        alert(
            "Đã đặt VẠCH 1.\n\n" +
            "Vạch xanh = điểm bắt đầu."
        );

    }
);


line2Btn.addEventListener(
    "click",
    ()=>{

        line2 = 0.60;

        alert(
            "Đã đặt VẠCH 2.\n\n" +
            "Vạch đỏ = điểm kết thúc."
        );

    }
);


/* =========================
   INITIAL DISPLAY
========================= */

distanceDisplay.textContent =
    distanceMeters;

limitDisplay.textContent =
    speedLimit;

</script>

</body>
</html>
