<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05070d">

<title>Handlight V3</title>

<style>

:root{
    --bg:#05070d;
    --white:#f5f7ff;
    --muted:rgba(245,247,255,.6);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
}

body{
    font-family:Arial,sans-serif;
    color:var(--white);
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05070d;
}

/* =========================
   CAMERA
========================= */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#05070d;

    filter:
        brightness(.78)
        contrast(1.08)
        saturate(1.02);

    z-index:0;
}

/* =========================
   EFFECT CANVAS
========================= */

#effects{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* =========================
   CINEMATIC OVERLAY
========================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:

        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.18) 65%,
            rgba(0,0,0,.72) 100%
        ),

        linear-gradient(
            180deg,
            rgba(0,0,0,.4),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.55)
        );
}

/* =========================
   TOP UI
========================= */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:6;

    display:flex;
    justify-content:space-between;

    padding:
        max(22px,env(safe-area-inset-top))
        20px
        15px;

    font-family:monospace;
    font-size:9px;

    letter-spacing:.18em;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 12px #fff;
}

.status{
    color:var(--muted);
}

/* =========================
   START SCREEN
========================= */

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle at center,
            rgba(120,100,255,.08),
            transparent 42%
        ),

        #05070d;

    transition:
        opacity .55s ease,
        visibility .55s ease;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);
    text-align:center;
}

.camera-circle{
    width:72px;
    height:72px;

    margin:0 auto 28px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;

    box-shadow:
        0 0 40px
        rgba(255,255,255,.08);

    animation:
        breathe 2.8s ease-in-out infinite;
}

.camera-circle span{
    width:23px;
    height:30px;

    border:
        2px solid white;

    border-radius:
        14px 14px 9px 9px;
}

@keyframes breathe{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

}

.eyebrow{
    margin:0 0 12px;

    font:
        10px monospace;

    letter-spacing:.22em;

    color:rgba(255,255,255,.65);
}

h1{
    margin:0;

    font-size:
        clamp(30px,9vw,46px);

    line-height:1.02;

    letter-spacing:-.045em;
}

.description{
    max-width:320px;

    margin:18px auto 28px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.start-button{
    border:0;

    padding:
        17px 28px;

    min-width:175px;

    background:#fff;

    color:#080b12;

    font:
        800 11px Arial,sans-serif;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.18);

    transition:
        transform .2s,
        box-shadow .2s;
}

.start-button:active{
    transform:scale(.95);
}

.start-button:disabled{
    opacity:.5;
}

.error{
    display:none;

    margin-top:15px;

    color:rgba(255,255,255,.5);

    font-size:11px;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:6;

    display:flex;
    justify-content:space-between;

    padding:
        15px 20px
        max(25px,env(safe-area-inset-bottom));

    font:
        9px monospace;

    letter-spacing:.08em;

    color:rgba(255,255,255,.5);
}

.hint{
    display:flex;
    align-items:center;

    gap:9px;
}

.line{
    width:23px;
    height:1px;

    background:white;

    box-shadow:
        0 0 8px white;
}

/* =========================
   FLASH
========================= */

#flash{
    position:absolute;
    inset:0;

    z-index:10;

    background:white;

    opacity:0;

    pointer-events:none;
}

</style>
</head>

<body>

<main class="stage">

<!-- CAMERA -->
<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<!-- EFFECTS -->
<canvas id="effects"></canvas>


<!-- OVERLAY -->
<div class="overlay"></div>


<!-- FLASH -->
<div id="flash"></div>


<!-- TOP -->

<header class="top">

    <div class="logo">
        <span class="logo-dot"></span>
        HANDLIGHT
    </div>

    <div
        id="status"
        class="status">
        CAMERA OFF
    </div>

</header>


<!-- START -->

<section
    id="start"
    class="start">

        <div class="camera-circle">
            <span></span>
        </div>

        <p class="eyebrow">

            bằng đôi tay

        </span>

    </div>

        READY
    </div>

</div>

</main>


<!-- MEDIAPIPE -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

(() => {

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("effects");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const error =
    document.getElementById("error");

const hint =
    document.getElementById("hint");

const gestureText =
    document.getElementById("gesture");

const flash =
    document.getElementById("flash");


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let hands = null;

let tracking = false;

let lastSend = 0;

let W = 0;

let H = 0;


/*
    0 = chưa tạo cửa sổ
    1 = đang giữ pinch
    2 = đang mở cửa sổ
*/

let portalState = 0;


/* cửa sổ */

let portal = {

    active:false,

    x1:0,
    y1:0,

    x2:0,
    y2:0,

    colorIndex:0,

    progress:0

};


/* màu */

const colors = [

    {
        main:"#ff4f81",
        glow:"#ff4f81"
    },

    {
        main:"#ff8a3d",
        glow:"#ff8a3d"
    },

    {
        main:"#ffe45c",
        glow:"#ffe45c"
    },

    {
        main:"#65f58b",
        glow:"#65f58b"
    },

    {
        main:"#53e6ff",
        glow:"#53e6ff"
    },

    {
        main:"#6688ff",
        glow:"#6688ff"
    },

    {
        main:"#c86cff",
        glow:"#c86cff"
    }

];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    W =
        canvas.clientWidth;

    H =
        canvas.clientHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    canvas.width =
        Math.floor(W*dpr);

    canvas.height =
        Math.floor(H*dpr);


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   POINT
===================================================== */

function screenPoint(p){

    return {

        x:
            (1-p.x)*W,

        y:
            p.y*H

    };

}


/* =====================================================
   PINCH
===================================================== */

/*
    Kiểm tra ngón trỏ chạm ngón cái
*/

function indexPinch(hand){

    const thumb =
        hand[4];

    const index =
        hand[8];


    return (
        distance(
            thumb,
            index
        ) < 0.075
    );

}


/*
    Kiểm tra út chạm ngón cái
*/

function pinkyPinch(hand){

    const thumb =
        hand[4];

    const pinky =
        hand[20];


    return (
        distance(
            thumb,
            pinky
        ) < 0.085
    );

}


/* =====================================================
   GLOW DOT
===================================================== */

function glowDot(
    p,
    color,
    size=1
){

    const radius =
        20*size;


    const gradient =
        ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            radius*3
        );


    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        .25,
        color+"bb"
    );

    gradient.addColorStop(
        1,
        color+"00"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        18;


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        3.5*size,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;

}


/* =====================================================
   ENERGY LINE
===================================================== */

function drawEnergyLine(
    a,
    b,
    color
){

    const gradient =
        ctx.createLinearGradient(
            a.x,
            a.y,
            b.x,
            b.y
        );


    gradient.addColorStop(
        0,
        color+"00"
    );

    gradient.addColorStop(
        .25,
        color
    );

    gradient.addColorStop(
        .5,
        "#ffffff"
    );

    gradient.addColorStop(
        .75,
        color
    );

    gradient.addColorStop(
        1,
        color+"00"
    );


    ctx.save();


    ctx.lineCap =
        "round";


    /* glow */

    ctx.strokeStyle =
        color;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        25;

    ctx.lineWidth = 5;


    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    /* core */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth = 1.4;


    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   PORTAL
===================================================== */

function drawPortal(){

    if(
        !portal.active
    ){

        return;

    }


    const color =
        colors[
            portal.colorIndex
        ];


    const x =
        Math.min(
            portal.x1,
            portal.x2
        );

    const y =
        Math.min(
            portal.y1,
            portal.y2
        );


    const w =
        Math.abs(
            portal.x2-
            portal.x1
        );


    const h =
        Math.abs(
            portal.y2-
            portal.y1
        );


    if(
        w<80 ||
        h<80
    ){

        return;

    }


    ctx.save();


    /* =====================
       OUTER GLOW
    ===================== */

    ctx.shadowColor =
        color.glow;

    ctx.shadowBlur =
        35;


    ctx.strokeStyle =
        color.main;

    ctx.lineWidth =
        2;


    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    /* =====================
       INNER FRAME
    ===================== */

    ctx.shadowBlur =
        15;

    ctx.strokeStyle =
        "#ffffffaa";

    ctx.lineWidth =
        1;


    ctx.strokeRect(
        x+7,
        y+7,
        w-14,
        h-14
    );


    /* =====================
       GLASS
    ===================== */

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x+w,
            y+h
        );


    gradient.addColorStop(
        0,
        color.main+"18"
    );

    gradient.addColorStop(
        .5,
        "#ffffff05"
    );

    gradient.addColorStop(
        1,
        color.main+"22"
    );


    ctx.shadowBlur=0;

    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /* =====================
       CORNER LIGHTS
    ===================== */

    const s=18;


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth=2;

    ctx.shadowColor =
        color.main;

    ctx.shadowBlur=15;


    /* top left */

    ctx.beginPath();

    ctx.moveTo(x,y+s);
    ctx.lineTo(x,y);
    ctx.lineTo(x+s,y);

    ctx.stroke();


    /* top right */

    ctx.beginPath();

    ctx.moveTo(x+w-s,y);
    ctx.lineTo(x+w,y);
    ctx.lineTo(x+w,y+s);

    ctx.stroke();


    /* bottom left */

    ctx.beginPath();

    ctx.moveTo(x,y+h-s);
    ctx.lineTo(x,y+h);
    ctx.lineTo(x+s,y+h);

    ctx.stroke();


    /* bottom right */

    ctx.beginPath();

    ctx.moveTo(x+w-s,y+h);
    ctx.lineTo(x+w,y+h);
    ctx.lineTo(x+w,y+h-s);

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   UPDATE PORTAL
===================================================== */

function updatePortal(
    leftHand,
    rightHand
){

    const leftIndex =
        leftHand[8];

    const rightIndex =
        rightHand[8];


    const leftThumb =
        leftHand[4];

    const rightThumb =
        rightHand[4];


    /*
        Khi hai ngón trỏ + cái
        đang chạm
    */

    const leftPinch =
        indexPinch(leftHand);

    const rightPinch =
        indexPinch(rightHand);


    const bothPinch =
        leftPinch &&
        rightPinch;


    /* =====================
       START ENERGY
    ===================== */

    if(
        bothPinch &&
        portalState === 0
    ){

        portalState = 1;

        portal.active = false;

        hint.textContent =
            "MỞ HAI TAY RA";

        gestureText.textContent =
            "ENERGY LINK";

    }


    /*
        Khi mở tay
    */

    if(
        portalState === 1 &&
        !bothPinch
    ){

        const L =
            screenPoint(
                leftIndex
            );

        const R =
            screenPoint(
                rightIndex
            );


        const spread =
            distance(
                L,
                R
            );


        /*
            Cần mở đủ xa
        */

        if(
            spread > Math.min(W,H)*.28
        ){

            portalState = 2;

            portal.active = true;

            portal.x1 =
                L.x;

            portal.y1 =
                L.y;

            portal.x2 =
                R.x;

            portal.y2 =
                R.y;

            hint.textContent =
                "CHẠM ÚT VÀO NGÓN CÁI ĐỂ ĐỔI MÀU";

            gestureText.textContent =
                "PORTAL ACTIVE";

        }

    }


    /*
        Cửa sổ đang hoạt động
    */

    if(
        portalState === 2
    ){

        /*
            Cửa sổ nằm giữa hai tay.
        */

        const L =
            screenPoint(
                leftIndex
            );

        const R =
            screenPoint(
                rightIndex
            );


        const centerX =
            (L.x+R.x)/2;

        const centerY =
            (L.y+R.y)/2;


        /*
            Chiều rộng cửa sổ
        */

        const spread =
            distance(L,R);


        const portalWidth =
            spread;


        const portalHeight =
            Math.max(
                110,
                spread*.62
            );


        portal.x1 =
            centerX-
            portalWidth/2;

        portal.x2 =
            centerX+
            portalWidth/2;

        portal.y1 =
            centerY-
            portalHeight/2;

        portal.y2 =
            centerY+
            portalHeight/2;


        /*
            ĐỔI MÀU
        */

        const leftPinky =
            pinkyPinch(
                leftHand
            );

        const rightPinky =
            pinkyPinch(
                rightHand
            );


        if(
            leftPinky &&
            rightPinky
        ){

            changeColor();

        }

    }

}


/* =====================================================
   COLOR CHANGE
===================================================== */

let lastColorChange = 0;


function changeColor(){

    const now =
        performance.now();


    /*
        chống đổi màu
        liên tục
    */

    if(
        now-lastColorChange <
        1000
    ){

        return;

    }


    lastColorChange =
        now;


    portal.colorIndex =
        (
            portal.colorIndex+1
        )
        %
        colors.length;


    triggerFlash();

}


/* =====================================================
   FLASH
===================================================== */

function triggerFlash(){

    flash.animate(

        [
            {
                opacity:0
            },

            {
                opacity:.12
            },

            {
                opacity:0
            }
        ],

        {
            duration:350,
            easing:"ease-out"
        }

    );

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(result){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        result.multiHandLandmarks || [];


    /*
        Không có đủ 2 tay
    */

    if(
        detected.length < 2
    ){

        if(
            portalState === 0
        ){

            hint.textContent =
                "ĐƯA HAI BÀN TAY VÀO KHUNG";

            gestureText.textContent =
                "WAITING";

        }


        drawPortal();

        return;

    }


    /*
        MediaPipe có thể
        trả thứ tự tay khác nhau.
        Ta chỉ cần chọn
        tay trái + tay phải
        theo vị trí trên màn hình.
    */

    const hands =
        detected.map(
            hand =>
                hand.map(
                    screenPoint
                )
        );


    hands.sort(
        (a,b) =>
            a[9].x-b[9].x
    );


    const left =
        detected[
            hands.indexOf(
                hands[0]
            )
        ];


    const right =
        detected[
            hands.indexOf(
                hands[1]
            )
        ];


    /*
        Hai điểm ngón cái/trỏ
    */

    const leftThumb =
        screenPoint(
            left[4]
        );

    const leftIndex =
        screenPoint(
            left[8]
        );

    const rightThumb =
        screenPoint(
            right[4]
        );

    const rightIndex =
        screenPoint(
            right[8]
        );


    /*
        Khi chưa tạo cửa sổ
        hiển thị điểm sáng
    */

    if(
        portalState === 0
    ){

        glowDot(
            leftThumb,
            "#ffffff",
            .8
        );

        glowDot(
            leftIndex,
            "#ffffff",
            .8
        );

        glowDot(
            rightThumb,
            "#ffffff",
            .8
        );

        glowDot(
            rightIndex,
            "#ffffff",
            .8
        );


        /*
            Nếu cả hai bên pinch
            thì nối hai bên.
        */

        if(
            indexPinch(left) &&
            indexPinch(right)
        ){

            drawEnergyLine(
                leftIndex,
                rightIndex,
                "#ffffff"
            );

            glowDot(
                leftIndex,
                "#ffffff",
                1.2
            );

            glowDot(
                rightIndex,
                "#ffffff",
                1.2
            );

        }

    }


    updatePortal(
        left,
        right
    );


    /*
        Nếu đang tạo năng lượng
    */

    if(
        portalState === 1
    ){

        drawEnergyLine(
            leftIndex,
            rightIndex,
            "#ffffff"
        );

    }


    /*
        Cửa sổ
    */

    drawPortal();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(
        !tracking
    ){

        return;

    }


    const now =
        performance.now();


    /*
        22 FPS nhận diện
        giúp điện thoại nhẹ hơn
    */

    if(
        hands &&
        video.readyState >= 2 &&
        now-lastSend > 45
    ){

        lastSend =
            now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(err){

            console.warn(
                "Hand tracking:",
                err
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START TRACKING
===================================================== */

async function startTracking(){

    if(
        !window.Hands
    ){

        status.textContent =
            "CAMERA OK";

        return;

    }


    try{

        hands =
            new Hands({

                locateFile:
                    file =>
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +file

            });


        hands.setOptions({

            /*
                BẮT BUỘC 2 TAY
            */

            maxNumHands:2,

            /*
                model nhẹ
            */

            modelComplexity:0,

            minDetectionConfidence:.55,

            minTrackingConfidence:.55

        });


        hands.onResults(
            onResults
        );


        tracking =
            true;


        requestAnimationFrame(
            trackingLoop
        );


    }
    catch(err){

        console.error(
            err
        );

        status.textContent =
            "CAMERA OK";

    }

}


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
        true;


    status.textContent =
        "ĐANG XIN QUYỀN";


    error.style.display =
        "none";


    /*
        HTTPS
    */

    if(
        !window.isSecureContext
    ){

        showError(
            "Trang cần HTTPS."
        );

        return;

    }


    try{

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:24,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        resize();


        startScreen.classList.add(
            "hide"
        );


        status.textContent =
            "HAND TRACKING";


        await startTracking();


    }
    catch(err){

        console.error(
            err
        );


        startButton.disabled =
            false;


        status.textContent =
            "CAMERA ERROR";


        if(
            err.name ===
            "NotAllowedError" ||
            err.name ===
            "PermissionDeniedError"
        ){

            showError(
                "Camera đang bị chặn. Hãy cho phép Camera trong quyền của trình duyệt."
            );

        }
        else if(
            err.name ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy camera."
            );

        }
        else if(
            err.name ===
            "NotReadableError"
        ){

            showError(
                "Camera đang được ứng dụng khác sử dụng."
            );

        }
        else{

            showError(
                "Không thể mở camera."
            );

        }

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

    error.style.display =
        "block";

    error.textContent =
        text;

    startButton.disabled =
        false;

}


/* =====================================================
   EVENTS
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "beforeunload",
    () => {

        tracking=false;


        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

resize();

})();

</script>

</body>
</html>
