<style>

<script>

/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById(
        "startScreen"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const aiStatus =
    document.getElementById(
        "aiStatus"
    );

const vehicleCount =
    document.getElementById(
        "vehicleCount"
    );

const measureStatus =
    document.getElementById(
        "measureStatus"
    );

const speedElement =
    document.getElementById(
        "speed"
    );

const warning =
    document.getElementById(
        "warning"
    );

const measureBtn =
    document.getElementById(
        "measureBtn"
    );

const settingsPanel =
    document.getElementById(
        "settings"
    );


/* ==========================================
   VARIABLES
========================================== */

let model = null;

let stream = null;

let running = false;

let measuring = false;


/*
   Hai vạch trong tọa độ tương đối
   của camera.
*/

const LINE_1 = 0.38;

const LINE_2 = 0.62;


/*
   Khoảng cách thật giữa hai vạch.
*/

let distanceMeters = 10;

let speedLimit = 50;


/*
   Tracking.
*/

let tracks = [];

let nextTrackId = 1;


/*
   Chỉ những class này mới được
   xem là phương tiện.
*/

const VEHICLE_CLASSES = [

    "car",

    "motorcycle",

    "bus",

    "truck"

];


/*
   Tần suất AI.
   Không chạy quá nhanh để điện thoại
   đỡ nóng.
*/

const DETECTION_INTERVAL = 180;

let lastDetection = 0;

let detecting = false;


/* ==========================================
   CAMERA
========================================== */

async function startCamera(){

    try{

        loading.style.display =
            "flex";

        loadingText.textContent =
            "Đang mở camera...";


        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        loadingText.textContent =
            "Đang tải AI...";


        /*
           MobileNet Lite:
           nhẹ hơn và phù hợp hơn
           cho trình duyệt điện thoại.
        */

        model =
            await cocoSsd.load({
                base:
                    "lite_mobilenet_v2"
            });


        loading.style.display =
            "none";

        startScreen.style.display =
            "none";


        statusDot.classList.add(
            "ready"
        );

        statusText.textContent =
            "CAMERA + AI ON";

        aiStatus.textContent =
            "READY";


        running = true;


        resizeCanvas();

        requestAnimationFrame(
            renderLoop
        );


    }catch(error){

        console.error(error);

        loading.style.display =
            "none";


        alert(
            "Không thể khởi động AI Camera.\n\n" +
            "Hãy cho phép camera và mở website " +
            "bằng HTTPS hoặc localhost."
        );

    }

}


/* ==========================================
   RESIZE
========================================== */

function resizeCanvas(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    )
        return;


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

}


/* ==========================================
   AI DETECTION
========================================== */

async function detectVehicles(){

    if(
        !model ||
        !video.videoWidth ||
        detecting
    )
        return;


    detecting = true;


    try{

        const predictions =
            await model.detect(
                video,
                15,
                0.55
            );


        const vehicles =
            predictions.filter(
                p =>
                    VEHICLE_CLASSES
                    .includes(p.class)
            );


        updateTracking(
            vehicles
        );


        vehicleCount.textContent =
            tracks.length;


    }catch(error){

        console.error(error);

    }


    detecting = false;

}


/* ==========================================
   TRACKING
========================================== */

function updateTracking(
    detections
){

    const now =
        performance.now();


    const usedTracks =
        new Set();


    /*
       Tạo danh sách detection
       với tâm của bounding box.
    */

    const objects =
        detections.map(
            d => {

                const [
                    x,
                    y,
                    w,
                    h
                ] = d.bbox;


                return {

                    x,
                    y,
                    w,
                    h,

                    cx:
                        x + w / 2,

                    cy:
                        y + h / 2,

                    class:
                        d.class,

                    score:
                        d.score

                };

            }
        );


    /*
       Ghép detection hiện tại
       với track gần nhất.
    */

    for(
        const object of objects
    ){

        let bestTrack = null;

        let bestDistance =
            Infinity;


        for(
            const track of tracks
        ){

            if(
                usedTracks.has(
                    track.id
                )
            )
                continue;


            const dx =
                object.cx -
                track.cx;

            const dy =
                object.cy -
                track.cy;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               Ngưỡng ghép.
               Dựa một phần vào kích thước
               của vật thể.
            */

            const threshold =
                Math.max(
                    70,
                    track.w * 0.8
                );


            if(
                distance <
                threshold &&
                distance <
                bestDistance
            ){

                bestDistance =
                    distance;

                bestTrack =
                    track;

            }

        }


        if(bestTrack){

            updateTrack(
                bestTrack,
                object,
                now
            );

            usedTracks.add(
                bestTrack.id
            );

        }else{

            /*
               Tạo ID mới.
            */

            tracks.push({

                id:
                    nextTrackId++,

                cx:
                    object.cx,

                cy:
                    object.cy,

                previousCy:
                    object.cy,

                x:
                    object.x,

                y:
                    object.y,

                w:
                    object.w,

                h:
                    object.h,

                class:
                    object.class,

                score:
                    object.score,

                lastSeen:
                    now,

                crossed1:
                    false,

                crossed2:
                    false,

                firstTime:
                    0,

                speed:
                    null

            });

        }

    }


    /*
       Xóa track biến mất quá lâu.
    */

    tracks =
        tracks.filter(
            track =>
                now -
                track.lastSeen
                < 700
        );

}


/* ==========================================
   UPDATE TRACK
========================================== */

function updateTrack(
    track,
    object,
    now
){

    track.previousCy =
        track.cy;


    /*
       Làm mượt vị trí.
    */

    track.cx =
        track.cx * 0.35 +
        object.cx * 0.65;


    track.cy =
        track.cy * 0.35 +
        object.cy * 0.65;


    track.x =
        object.x;

    track.y =
        object.y;

    track.w =
        object.w;

    track.h =
        object.h;

    track.class =
        object.class;

    track.score =
        object.score;

    track.lastSeen =
        now;


    /*
       Chuyển sang tọa độ tương đối.
    */

    const normalizedY =
        track.cy /
        canvas.height;


    const previousNormalizedY =
        track.previousCy /
        canvas.height;


    /*
       Xác định hướng chuyển động.
    */

    const movingDown =
        normalizedY >
        previousNormalizedY;


    /*
       Xe đi xuống và cắt Vạch 1.
    */

    if(
        !track.crossed1 &&
        movingDown &&
        normalizedY >= LINE_1
    ){

        track.crossed1 =
            true;

        track.firstTime =
            now;

        measureStatus.textContent =
            "Xe #" +
            track.id +
            " qua Vạch 1";

    }


    /*
       Sau khi qua Vạch 1,
       xe tiếp tục cắt Vạch 2.
    */

    if(
        track.crossed1 &&
        !track.crossed2 &&
        movingDown &&
        normalizedY >= LINE_2
    ){

        track.crossed2 =
            true;


        const elapsed =
            (
                now -
                track.firstTime
            ) / 1000;


        if(
            elapsed > 0.1 &&
            elapsed < 30
        ){

            const metersPerSecond =
                distanceMeters /
                elapsed;


            const kmh =
                metersPerSecond *
                3.6;


            track.speed =
                kmh;


            /*
               Hiển thị tốc độ của
               chiếc xe vừa đo.
            */

            speedElement.textContent =
                kmh.toFixed(1);


            measureStatus.textContent =
                "Xe #" +
                track.id +
                " — " +
                kmh.toFixed(1) +
                " km/h";


            /*
               Cảnh báo nếu vượt giới hạn.
            */

            if(
                kmh >
                speedLimit
            ){

                showWarning();

            }

        }

    }

}


/* ==========================================
   DRAW
========================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawMeasurementLines();


    for(
        const track of tracks
    ){

        drawTrack(
            track
        );

    }

}


/* ==========================================
   DRAW LINES
========================================== */

function drawMeasurementLines(){

    const y1 =
        canvas.height *
        LINE_1;

    const y2 =
        canvas.height *
        LINE_2;


    ctx.save();

    ctx.lineWidth = 4;

    ctx.setLineDash([
        16,
        10
    ]);


    /*
       Vạch 1
    */

    ctx.strokeStyle =
        "#00ff95";

    ctx.beginPath();

    ctx.moveTo(
        0,
        y1
    );

    ctx.lineTo(
        canvas.width,
        y1
    );

    ctx.stroke();


    /*
       Vạch 2
    */

    ctx.strokeStyle =
        "#ff3154";

    ctx.beginPath();

    ctx.moveTo(
        0,
        y2
    );

    ctx.lineTo(
        canvas.width,
        y2
    );

    ctx.stroke();


    ctx.setLineDash([]);


    ctx.font =
        "bold 15px Arial";

    ctx.fillStyle =
        "#fff";


    ctx.fillText(
        "VẠCH 1",
        15,
        y1 - 10
    );


    ctx.fillText(
        "VẠCH 2",
        15,
        y2 - 10
    );


    ctx.restore();

}


/* ==========================================
   DRAW TRACK
========================================== */

function drawTrack(
    track
){

    const x =
        track.x;

    const y =
        track.y;

    const w =
        track.w;

    const h =
        track.h;


    /*
       Bounding box.
    */

    ctx.save();

    ctx.lineWidth = 3;

    ctx.strokeStyle =
        track.speed !== null
        ? "#00ff95"
        : "#00aaff";


    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    /*
       ID.
    */

    const label =
        " #" +
        track.id +
        " " +
        track.class;


    ctx.font =
        "bold 14px Arial";


    const labelWidth =
        ctx.measureText(
            label
        ).width + 14;


    ctx.fillStyle =
        "rgba(0,0,0,.75)";


    ctx.fillRect(
        x,
        y - 25,
        labelWidth,
        25
    );


    ctx.fillStyle =
        "#fff";


    ctx.fillText(
        label,
        x + 7,
        y - 8
    );


    /*
       Điểm tâm tracking.
    */

    ctx.beginPath();

    ctx.arc(
        track.cx,
        track.cy,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();


    /*
       Hiện tốc độ trên xe
       nếu đã đo.
    */

    if(
        track.speed !== null
    ){

        const text =
            track.speed.toFixed(1) +
            " km/h";


        ctx.font =
            "bold 16px Arial";


        ctx.fillStyle =
            "#00ff95";


        ctx.fillText(
            text,
            x,
            y + h + 20
        );

    }


    ctx.restore();

}


/* ==========================================
   RENDER LOOP
========================================== */

function renderLoop(
    timestamp
){

    if(!running)
        return;


    if(
        timestamp -
        lastDetection >
        DETECTION_INTERVAL
    ){

        lastDetection =
            timestamp;


        detectVehicles();

    }


    draw();


    requestAnimationFrame(
        renderLoop
    );

}


/* ==========================================
   MEASUREMENT BUTTON
========================================== */

measureBtn.addEventListener(
    "click",
    ()=>{

        measuring =
            !measuring;


        if(measuring){

            measureBtn.textContent =
                "■ DỪNG ĐO";

            measureBtn.classList.add(
                "stop"
            );

            measureStatus.textContent =
                "Đang theo dõi xe";

            speedElement.textContent =
                "0.0";


            /*
               Reset tracking để bắt đầu
               phiên đo mới.
            */

            tracks = [];

            nextTrackId = 1;

        }else{

            measureBtn.textContent =
                "▶ BẮT ĐẦU ĐO";

            measureBtn.classList.remove(
                "stop"
            );

            measureStatus.textContent =
                "Đã dừng";

        }

    }
);


/* ==========================================
   SETTINGS
========================================== */

document
.getElementById("settingsBtn")
.addEventListener(
    "click",
    ()=>{

        document
        .getElementById(
            "distanceInput"
        )
        .value =
            distanceMeters;


        document
        .getElementById(
            "limitInput"
        )
        .value =
            speedLimit;


        settingsPanel.style.display =
            "flex";

    }
);


document
.getElementById(
    "cancelSettings"
)
.addEventListener(
    "click",
    ()=>{

        settingsPanel.style.display =
            "none";

    }
);


document
.getElementById(
    "saveSettings"
)
.addEventListener(
    "click",
    ()=>{

        const d =
            parseFloat(
                document
                .getElementById(
                    "distanceInput"
                )
                .value
            );


        const l =
            parseFloat(
                document
                .getElementById(
                    "limitInput"
                )
                .value
            );


        if(
            !Number.isFinite(d) ||
            d <= 0
        ){

            alert(
                "Khoảng cách không hợp lệ."
            );

            return;

        }


        if(
            !Number.isFinite(l) ||
            l <= 0
        ){

            alert(
                "Giới hạn tốc độ không hợp lệ."
            );

            return;

        }


        distanceMeters =
            d;

        speedLimit =
            l;


        document
        .getElementById(
            "distanceText"
        )
        .textContent =
            d + " m";


        settingsPanel.style.display =
            "none";

    }
);

========================================== */

function showWarning(){

    warning.style.display =
        "block";


    setTimeout(
        ()=>{
            warning.style.display =
                "none";
        },
        1400
    );

}


/* ==========================================
   START
========================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startCamera
);

</script>
