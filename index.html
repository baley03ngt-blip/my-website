<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
}

body{
    touch-action:none;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* CAMERA */

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(1.08);
}

/* CANVAS */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}

/* START */

#startScreen{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#02040a;

    color:white;
    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:15px;
}

.startBox p{
    color:rgba(255,255,255,.6);
    font-size:14px;
    line-height:1.65;
}

#startButton{
    margin-top:25px;

    padding:16px 28px;

    border:0;
    border-radius:5px;

    background:white;
    color:#02040a;

    font-weight:800;
    font-size:11px;

    letter-spacing:.15em;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:14px;

    color:#ff6578;

    font-size:12px;

    line-height:1.5;
}

/* FILTER NAME */

#filterName{
    position:absolute;

    left:50%;
    bottom:45px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.50);

    border:
        1px solid
        rgba(255,255,255,.18);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity .25s;
}

/* INSTRUCTION */

#instruction{
    position:absolute;

    left:0;
    right:0;

    bottom:15px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:11px;

    text-shadow:
        0 2px 12px #000;

    opacity:.85;
}

@media(max-width:600px){

    #instruction{
        font-size:10px;
    }

}
</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div id="filterName">
        RAINBOW
    </div>

    <div id="instruction">
        ĐƯA HAI BÀN TAY VÀO CAMERA
    </div>

    <div id="startScreen">

        <div class="startBox">

            <h1>HANDLIGHT</h1>

            <p>
                Đưa hai bàn tay vào camera.<br><br>

                Chạm ngón trỏ + ngón cái
                ở cả hai tay để mở khung.<br><br>

                Sau đó chạm ngón út + ngón cái
                ở cả hai tay để đổi màu.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha:true,
        desynchronized:true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const filterName =
    document.getElementById("filterName");

const instruction =
    document.getElementById("instruction");


/* =========================================================
   SIZE
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   FILTERS
========================================================= */

const FILTERS = [

    {
        name:"RAINBOW",

        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",

        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",

        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",

        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",

        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",

        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",

        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;


/* =========================================================
   WINDOW
========================================================= */

let windowOpen = false;


/* =========================================================
   POINT STRUCTURE
========================================================= */

function point(x=0,y=0){

    return {
        x,
        y,

        vx:0,
        vy:0,

        initialized:false,

        lastTime:performance.now()
    };
}


/*
    4 GÓC CỐ ĐỊNH:

    tl = trỏ trái
    tr = trỏ phải
    br = cái phải
    bl = cái trái
*/

const windowPoints = {

    tl:point(),
    tr:point(),
    br:point(),
    bl:point()

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =========================================================
   CAMERA POINT
========================================================= */

function screenPoint(p){

    return {

        x:(1 - p.x) * W,

        y:p.y * H

    };
}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* =========================================================
   HAND SIZE
========================================================= */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001
    );
}


/* =========================================================
   INDEX + THUMB
========================================================= */

function indexThumbTouch(hand){

    return (

        distance(
            hand[4],
            hand[8]
        )
        /
        getHandSize(hand)

    ) < 0.82;
}


/* =========================================================
   PINKY + THUMB
========================================================= */

function pinkyThumbTouch(hand){

    return (

        distance(
            hand[4],
            hand[20]
        )
        /
        getHandSize(hand)

    ) < 1.05;
}


/* =========================================================
   ULTRA SMOOTH POINT
========================================================= */

/*
    Đây là phần quan trọng nhất.

    Không dùng smoothing cố định.

    Tay đứng yên:
        → smoothing mạnh
        → chống rung.

    Tay chạy nhanh:
        → smoothing nhẹ
        → giảm delay.

    Đồng thời dự đoán vị trí tiếp theo
    dựa vào vận tốc.
*/

function smoothPoint(
    current,
    target,
    dt
){

    if(!current.initialized){

        current.x = target.x;
        current.y = target.y;

        current.vx = 0;
        current.vy = 0;

        current.initialized = true;

        return;
    }


    dt = Math.max(
        0.001,
        Math.min(dt,0.05)
    );


    /* vận tốc hiện tại */

    const rawVX =
        (target.x - current.x)
        / dt;

    const rawVY =
        (target.y - current.y)
        / dt;


    /*
        Smooth vận tốc.

        0.35 giúp vận tốc không bị
        nhảy loạn vì camera.
    */

    current.vx +=
        (
            rawVX -
            current.vx
        ) * 0.35;

    current.vy +=
        (
            rawVY -
            current.vy
        ) * 0.35;


    const speed =
        Math.hypot(
            current.vx,
            current.vy
        );


    /*
        Tốc độ càng cao
        → phản hồi càng nhanh.
    */

    const speedNorm =
        Math.min(
            speed / 1800,
            1
        );


    /*
        Adaptive smoothing.

        chậm:
            ~0.18

        nhanh:
            ~0.72
    */

    const alpha =
        0.18 +
        speedNorm * 0.54;


    /*
        Prediction.

        Chỉ dự đoán nhẹ.

        Không cho dự đoán quá xa
        để tránh khung bị vượt khỏi ngón.
    */

    const prediction =
        0.010 +
        speedNorm * 0.018;


    const predictedX =
        target.x +
        current.vx *
        prediction;

    const predictedY =
        target.y +
        current.vy *
        prediction;


    /*
        Smooth vị trí.
    */

    current.x +=
        (
            predictedX -
            current.x
        ) * alpha;

    current.y +=
        (
            predictedY -
            current.y
        ) * alpha;


    current.lastTime =
        performance.now();
}


/* =========================================================
   SET TARGETS
========================================================= */

function setWindowTargets(
    left,
    right
){

    /*
        QUAN TRỌNG:

        Không bao giờ xác định góc
        bằng vị trí X nữa.

        left/right đã được MediaPipe
        xác định bằng handedness.
    */

    targetPoints.tl =
        screenPoint(left[8]);

    targetPoints.tr =
        screenPoint(right[8]);

    targetPoints.br =
        screenPoint(right[4]);

    targetPoints.bl =
        screenPoint(left[4]);
}


/* =========================================================
   CREATE WINDOW
========================================================= */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    const now =
        performance.now();


    for(
        const key of [
            "tl",
            "tr",
            "br",
            "bl"
        ]
    ){

        const p =
            windowPoints[key];

        const t =
            targetPoints[key];

        p.x = t.x;
        p.y = t.y;

        p.vx = 0;
        p.vy = 0;

        p.initialized = true;

        p.lastTime = now;
    }


    windowOpen = true;


    instruction.textContent =
        "DI CHUYỂN 4 ĐẦU NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";


    showFilterName();
}


/* =========================================================
   UPDATE WINDOW
========================================================= */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    const now =
        performance.now();


    const dt =
        Math.min(
            (now -
                windowPoints.tl.lastTime)
            / 1000,

            0.05
        );


    smoothPoint(
        windowPoints.tl,
        targetPoints.tl,
        dt
    );

    smoothPoint(
        windowPoints.tr,
        targetPoints.tr,
        dt
    );

    smoothPoint(
        windowPoints.br,
        targetPoints.br,
        dt
    );

    smoothPoint(
        windowPoints.bl,
        targetPoints.bl,
        dt
    );


    for(
        const key of [
            "tl",
            "tr",
            "br",
            "bl"
        ]
    ){

        windowPoints[key].lastTime =
            now;
    }

}


/* =========================================================
   GRADIENT
========================================================= */

function rainbowGradient(){

    const p =
        windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const gradient =
        ctx.createRadialGradient(

            centerX - W * .20,
            centerY - H * .20,

            0,

            centerX,
            centerY,

            Math.max(W,H) * .75

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        gradient.addColorStop(

            i /
            (colors.length - 1),

            colors[i]

        );
    }


    return gradient;
}


/* =========================================================
   MOVING GRADIENT
========================================================= */

function movingGradient(){

    const p =
        windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const t =
        performance.now()
        * 0.00035;


    const moveX =
        Math.cos(t)
        * W
        * .35;


    const moveY =
        Math.sin(t * 1.25)
        * H
        * .35;


    const g =
        ctx.createLinearGradient(

            centerX -
            W * .70 +
            moveX,

            centerY -
            H * .70 +
            moveY,

            centerX +
            W * .70 -
            moveX,

            centerY +
            H * .70 -
            moveY

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    for(
        let i=0;
        i<colors.length;
        i++
    ){

        g.addColorStop(

            i /
            (colors.length - 1),

            colors[i]

        );

    }


    return g;
}


/* =========================================================
   DRAW WINDOW
========================================================= */

function drawWindow(){

    if(!windowOpen)
        return;


    const p =
        windowPoints;


    /*
        WINDOW SHAPE
    */

    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /*
        COLOR
    */

    ctx.globalCompositeOperation =
        "screen";


    ctx.globalAlpha =
        0.25;

    ctx.fillStyle =
        rainbowGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        MOVING COLOR
    */

    ctx.globalAlpha =
        0.20;

    ctx.fillStyle =
        movingGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        GLASS
    */

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const glass =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H) * .65

        );


    glass.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    glass.addColorStop(
        .45,
        "rgba(255,255,255,.035)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle =
        glass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /*
        NEON BORDER
    */

    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        rainbowGradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /*
        INNER LIGHT
    */

    ctx.shadowBlur =
        6;

    ctx.strokeStyle =
        "rgba(255,255,255,.88)";

    ctx.lineWidth =
        1.2;

    ctx.stroke();


    ctx.restore();


    /*
        CORNER LIGHT
    */

    drawCorner(p.tl);
    drawCorner(p.tr);
    drawCorner(p.br);
    drawCorner(p.bl);
}


/* =========================================================
   CORNER
========================================================= */

function drawCorner(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        4.5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        13;

    ctx.fill();


    ctx.restore();
}


/* =========================================================
   FILTER
========================================================= */

let lastFilterChange = 0;

const COLOR_COOLDOWN =
    700;

let colorGestureHeld =
    false;


function nextFilter(){

    const now =
        performance.now();


    if(
        now -
        lastFilterChange
        < COLOR_COOLDOWN
    ){

        return;
    }


    lastFilterChange =
        now;


    filterIndex++;


    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;
    }


    showFilterName();
}


function showFilterName(){

    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;


    filterName.style.opacity =
        "1";


    clearTimeout(
        showFilterName.timer
    );


    showFilterName.timer =
        setTimeout(
            () => {

                filterName.style.opacity =
                    "0";

            },

            1000
        );
}


/* =========================================================
   HAND STATE
========================================================= */

/*
    Lưu tay dựa trên handedness.

    Không dùng vị trí X.

    Vì vậy hai tay có chạy qua nhau
    cũng không tráo góc.
*/

let leftHand = null;
let rightHand = null;


/* =========================================================
   PROCESS HANDS
========================================================= */

function processHands(
    detected,
    handedness
){

    leftHand = null;
    rightHand = null;


    /*
        Gán tay theo MediaPipe.
    */

    for(
        let i=0;
        i<detected.length;
        i++
    ){

        const hand =
            detected[i];

        const label =
            handedness[i]?.label;


        /*
            Camera mirror:

            MediaPipe vẫn trả về
            handedness thực tế.

            Left = tay trái người dùng.
            Right = tay phải người dùng.
        */

        if(label === "Left"){

            leftHand = hand;

        }

        else if(label === "Right"){

            rightHand = hand;

        }

    }


    /*
        Không đủ 2 tay.
    */

    if(
        !leftHand ||
        !rightHand
    ){

        if(!windowOpen){

            instruction.textContent =
                detected.length === 1
                ? "ĐƯA BÀN TAY THỨ HAI VÀO"
                : "ĐƯA HAI BÀN TAY VÀO CAMERA";

        }

        return;
    }


    /*
        Gesture.
    */

    const leftIndex =
        indexThumbTouch(
            leftHand
        );

    const rightIndex =
        indexThumbTouch(
            rightHand
        );


    const leftPinky =
        pinkyThumbTouch(
            leftHand
        );

    const rightPinky =
        pinkyThumbTouch(
            rightHand
        );


    /*
        OPEN WINDOW
    */

    if(!windowOpen){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                leftHand,
                rightHand
            );

        }

        return;
    }


    /*
        UPDATE POSITION
    */

    updateWindow(
        leftHand,
        rightHand
    );


    /*
        CHANGE COLOR
    */

    const bothPinky =
        leftPinky &&
        rightPinky;


    if(bothPinky){

        if(!colorGestureHeld){

            nextFilter();

            colorGestureHeld =
                true;

            instruction.textContent =
                "🌈 ĐÃ ĐỔI MÀU";

        }

    }

    else{

        colorGestureHeld =
            false;

        instruction.textContent =
            "ÚT + CÁI 2 TAY = ĐỔI MÀU";

    }
}


/* =========================================================
   MEDIAPIPE RESULTS
========================================================= */

function onResults(results){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    const handedness =
        results.multiHandedness
        || [];


    processHands(
        detected,
        handedness
    );


    /*
        CHỈ VẼ KHUNG.

        KHÔNG VẼ SKELETON.
    */

    drawWindow();
}


/* =========================================================
   MEDIAPIPE
========================================================= */

let hands = null;

let tracking = false;

let lastSend = 0;


async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands."
        );
    }


    hands =
        new Hands({

            locateFile:function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +
                    file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.65

    });


    hands.onResults(
        onResults
    );


    tracking = true;


    requestAnimationFrame(
        trackingLoop
    );
}


/* =========================================================
   TRACKING LOOP
========================================================= */

async function trackingLoop(){

    if(!tracking)
        return;


    const now =
        performance.now();


    /*
        ~30 FPS.

        MediaPipe chạy ổn định hơn
        khi không gửi frame quá nhanh.
    */

    if(
        now -
        lastSend >= 30
        &&
        video.readyState >= 2
    ){

        lastSend =
            now;


        try{

            await hands.send({

                image:video

            });

        }

        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    startButton.disabled =
        true;

    errorBox.textContent =
        "";


    if(!window.isSecureContext){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;
    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }

    catch(error){

        console.error(error);


        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message ||
                "Unknown error"
            );


        startButton.disabled =
            false;

    }

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        tracking = false;


        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>
