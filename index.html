<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT V7</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#02040a;
}


/* =====================================================
   CAMERA
===================================================== */

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.82)
        contrast(1.05)
        saturate(1.08);
}


/* =====================================================
   CANVAS
===================================================== */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#02040a;

    color:white;

    text-align:center;
}

#startBox{
    width:min(90%,430px);
}

#startBox h1{
    font-size:38px;
    letter-spacing:-.04em;
    margin-bottom:15px;
}

#startBox p{
    color:rgba(255,255,255,.62);
    font-size:14px;
    line-height:1.65;
}

#startButton{
    margin-top:22px;

    padding:16px 30px;

    border:0;
    border-radius:2px;

    background:white;
    color:#02040a;

    font-size:11px;
    font-weight:800;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 35px rgba(255,255,255,.18);
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:15px;
    color:#ff6578;
    font-size:12px;
}


/* =====================================================
   DEBUG
===================================================== */

#debug{
    position:absolute;

    top:12px;
    left:12px;

    z-index:20;

    width:300px;

    padding:13px;

    background:
        rgba(0,0,0,.68);

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:10px;

    color:white;

    font:
        12px/1.7
        Consolas,
        monospace;

    backdrop-filter:blur(10px);
}

.debugTitle{
    color:#4de4ff;
    font-weight:bold;
    margin-bottom:5px;
}

.ok{
    color:#59e889;
}

.no{
    color:#ff6578;
}


/* =====================================================
   WINDOW STATUS
===================================================== */

#windowStatus{
    position:absolute;

    top:12px;
    right:12px;

    z-index:20;

    padding:9px 12px;

    background:
        rgba(0,0,0,.68);

    border-radius:8px;

    color:#ff6578;

    font:
        bold 11px
        Consolas,
        monospace;
}


/* =====================================================
   FILTER NAME
===================================================== */

#filterName{
    position:absolute;

    left:50%;
    bottom:55px;

    transform:translateX(-50%);

    z-index:20;

    padding:7px 13px;

    border-radius:20px;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.18);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.14em;

    opacity:0;

    transition:opacity .25s;
}


/* =====================================================
   INSTRUCTION
===================================================== */

#instruction{
    position:absolute;

    left:0;
    right:0;
    bottom:18px;

    z-index:20;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px black;
}


/* =====================================================
   MOBILE DEBUG
===================================================== */

@media(max-width:600px){

    #debug{
        width:250px;
        font-size:10px;
    }

    #windowStatus{
        font-size:9px;
    }

}

</style>
</head>


<body>

<div id="app">


<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<canvas
    id="canvas">
</canvas>


<div id="debug">

    <div class="debugTitle">
        HANDLIGHT TRACKING
    </div>

    <div id="count">
        HAI TAY: ---
    </div>

    <div id="left">
        TAY TRÁI: ---
    </div>

    <div id="right">
        TAY PHẢI: ---
    </div>

    <div id="state">
        GESTURE: ---
    </div>

</div>


<div id="windowStatus">
    WINDOW: OFF
</div>


<div id="filterName">
    RAINBOW
</div>


<div id="instruction">
    ĐƯA HAI BÀN TAY VÀO CAMERA
</div>


<div id="startScreen">

    <div id="startBox">

        <h1>HANDLIGHT</h1>

        <p>
            Đưa hai bàn tay vào camera.<br><br>

            Chạm ngón trỏ với ngón cái
            ở cả hai tay để mở khung.
        </p>

        <button id="startButton">
            BẬT CAMERA
        </button>

        <div id="error"></div>

    </div>

</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const countText =
    document.getElementById("count");

const leftText =
    document.getElementById("left");

const rightText =
    document.getElementById("right");

const stateText =
    document.getElementById("state");

const windowStatus =
    document.getElementById("windowStatus");

const instruction =
    document.getElementById("instruction");

const filterName =
    document.getElementById("filterName");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;
let running = false;
let lastFrame = 0;


/* =====================================================
   21 ĐIỂM XƯƠNG BÀN TAY
===================================================== */

const BONES = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   7 FILTER ĐA SẮC
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",
        colors:[
            "#ff0055",
            "#ff7a00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#4b5cff",
            "#d000ff"
        ]
    },

    {
        name:"AURORA",
        colors:[
            "#00fff0",
            "#00ff9d",
            "#66ff00",
            "#b000ff",
            "#ff00cc",
            "#0055ff"
        ]
    },

    {
        name:"NEON DREAM",
        colors:[
            "#ff0080",
            "#ff00ff",
            "#7800ff",
            "#00aaff",
            "#00ffff"
        ]
    },

    {
        name:"COSMIC",
        colors:[
            "#1200ff",
            "#5b00ff",
            "#c000ff",
            "#ff00a8",
            "#ff0055",
            "#00d9ff"
        ]
    },

    {
        name:"SUNSET",
        colors:[
            "#ff003c",
            "#ff4500",
            "#ff8a00",
            "#ffd000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",
        colors:[
            "#001aff",
            "#005eff",
            "#00b7ff",
            "#00fff0",
            "#00ff9d",
            "#5dff00"
        ]
    },

    {
        name:"CRYSTAL",
        colors:[
            "#ffffff",
            "#9fffff",
            "#7c9cff",
            "#d98cff",
            "#ff9ed8",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;

let lastFilterChange = 0;


/* =====================================================
   CAMERA POINT
===================================================== */

function screenPoint(p){

    return {

        x:(1-p.x) * W,

        y:p.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(

        a.x-b.x,

        a.y-b.y

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        .0001

    );

}


/* =====================================================
   TRỎ + CÁI
===================================================== */

function indexThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[8]
        )
        /
        getHandSize(hand)
    );

}


function isIndexThumbTouch(hand){

    return (
        indexThumbRatio(hand)
        < .75
    );

}


/* =====================================================
   ÚT + CÁI
===================================================== */

function pinkyThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[20]
        )
        /
        getHandSize(hand)
    );

}


function isPinkyThumbTouch(hand){

    return (
        pinkyThumbRatio(hand)
        < .70
    );

}


/* =====================================================
   DRAW HAND SKELETON
===================================================== */

function drawSkeleton(hand){

    const points =
        hand.map(
            screenPoint
        );


    ctx.save();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";


    /* ==========================
       XƯƠNG
    ========================== */

    for(
        const bone
        of BONES
    ){

        const a =
            points[bone[0]];

        const b =
            points[bone[1]];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.strokeStyle =
            "rgba(255,255,255,.58)";

        ctx.lineWidth = 1.4;

        ctx.stroke();

    }


    /* ==========================
       KHỚP
    ========================== */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];

        const fingerTip =
            (
                i === 4 ||
                i === 8 ||
                i === 12 ||
                i === 16 ||
                i === 20
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            fingerTip ? 3.8 : 2.1,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur =
            fingerTip ? 8 : 3;

        ctx.fill();

    }


    /* ==========================
       TRỎ + CÁI
    ========================== */

    drawFingerRing(
        points[4],
        "#00eaff"
    );

    drawFingerRing(
        points[8],
        "#00eaff"
    );


    ctx.restore();

}


/* =====================================================
   FINGER RING
===================================================== */

function drawFingerRing(
    p,
    color
){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        7,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        1.3;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        9;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;


const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   UPDATE TARGET
===================================================== */

function setWindowTargets(
    left,
    right
){

    /*
       TRỎ TRÁI
       → TRÊN TRÁI
    */

    targetPoints.tl =
        screenPoint(
            left[8]
        );


    /*
       TRỎ PHẢI
       → TRÊN PHẢI
    */

    targetPoints.tr =
        screenPoint(
            right[8]
        );


    /*
       CÁI PHẢI
       → DƯỚI PHẢI
    */

    targetPoints.br =
        screenPoint(
            right[4]
        );


    /*
       CÁI TRÁI
       → DƯỚI TRÁI
    */

    targetPoints.bl =
        screenPoint(
            left[4]
        );

}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    windowPoints.tl =
        {...targetPoints.tl};

    windowPoints.tr =
        {...targetPoints.tr};

    windowPoints.br =
        {...targetPoints.br};

    windowPoints.bl =
        {...targetPoints.bl};


    windowOpen =
        true;


    windowStatus.textContent =
        "WINDOW: ON";

    windowStatus.style.color =
        "#59e889";


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;

    filterName.style.opacity =
        "1";


    instruction.textContent =
        "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN KHUNG";


    stateText.innerHTML =
        "GESTURE: <span class='ok'>WINDOW OPEN</span>";

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );


    const smooth =
        .35;


    for(
        const key
        of [
            "tl",
            "tr",
            "br",
            "bl"
        ]
    ){

        windowPoints[key].x +=
            (
                targetPoints[key].x -
                windowPoints[key].x
            )
            * smooth;


        windowPoints[key].y +=
            (
                targetPoints[key].y -
                windowPoints[key].y
            )
            * smooth;

    }

}


/* =====================================================
   MULTICOLOR GRADIENT
===================================================== */

function createRainbowGradient(){

    const p =
        windowPoints;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const radius =
        Math.max(
            W,
            H
        ) * .75;


    /*
       Dùng radial gradient
       nhiều màu.
    */

    const gradient =
        ctx.createRadialGradient(

            centerX - W*.15,
            centerY - H*.15,
            0,

            centerX,
            centerY,
            radius

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    /*
       Mỗi filter có
       nhiều màu cùng lúc.
    */

    colors.forEach(
        (color,index) => {

            gradient.addColorStop(

                index /
                (colors.length - 1),

                color

            );

        }
    );


    return gradient;

}


/* =====================================================
   SECONDARY MOVING GRADIENT
===================================================== */

function createMovingGradient(){

    const p =
        windowPoints;


    const time =
        performance.now()
        * .00018;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const moveX =
        Math.cos(time)
        * W
        * .25;


    const moveY =
        Math.sin(time * 1.3)
        * H
        * .25;


    const g =
        ctx.createLinearGradient(

            centerX - W*.55 + moveX,
            centerY - H*.55 + moveY,

            centerX + W*.55 - moveX,
            centerY + H*.55 - moveY

        );


    const colors =
        FILTERS[
            filterIndex
        ].colors;


    colors.forEach(
        (color,index) => {

            g.addColorStop(

                index /
                (colors.length - 1),

                color + "55"

            );

        }
    );


    return g;

}


/* =====================================================
   DRAW MULTICOLOR WINDOW
===================================================== */

function drawWindow(){

    if(
        !windowOpen
    ){

        return;

    }


    const p =
        windowPoints;


    /* =================================================
       SHAPE
    ================================================= */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /* =================================================
       LỚP CẦU VỒNG CHÍNH
    ================================================= */

    const rainbow =
        createRainbowGradient();


    ctx.globalCompositeOperation =
        "screen";


    ctx.globalAlpha =
        .22;


    ctx.fillStyle =
        rainbow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =================================================
       LỚP MÀU CHUYỂN ĐỘNG
    ================================================= */

    const moving =
        createMovingGradient();


    ctx.globalAlpha =
        .16;


    ctx.fillStyle =
        moving;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =================================================
       ÁNH SÁNG TRUNG TÂM
    ================================================= */

    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const glow =
        ctx.createRadialGradient(

            centerX,
            centerY,
            0,

            centerX,
            centerY,
            Math.max(W,H)*.6

        );


    glow.addColorStop(
        0,
        "rgba(255,255,255,.09)"
    );

    glow.addColorStop(
        .45,
        "rgba(255,255,255,.025)"
    );

    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha =
        1;

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /* =================================================
       KHUNG NEON
    ================================================= */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    /*
       Dùng gradient trên chính viền
    */

    const border =
        createRainbowGradient();


    ctx.strokeStyle =
        border;

    ctx.lineWidth =
        6;

    ctx.shadowColor =
        "rgba(120,220,255,.9)";

    ctx.shadowBlur =
        18;

    ctx.stroke();


    /* =================================================
       VIỀN TRẮNG MỎNG
    ================================================= */

    ctx.shadowBlur =
        7;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth =
        1.5;

    ctx.stroke();


    ctx.restore();


    /* =================================================
       4 ĐIỂM GÓC
    ================================================= */

    drawWindowCorner(
        p.tl
    );

    drawWindowCorner(
        p.tr
    );

    drawWindowCorner(
        p.br
    );

    drawWindowCorner(
        p.bl
    );

}


/* =====================================================
   WINDOW CORNER
===================================================== */

function drawWindowCorner(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.shadowColor =
        "#00eaff";


    ctx.shadowBlur =
        12;


    ctx.fill();


    ctx.restore();

}


/* =====================================================
   CHANGE FILTER
===================================================== */

function nextFilter(){

    const now =
        performance.now();


    /*
       Chống đổi liên tục
       khi đang giữ tay.
    */

    if(
        now - lastFilterChange
        < 900
    ){

        return;

    }


    lastFilterChange =
        now;


    filterIndex++;


    if(
        filterIndex >=
        FILTERS.length
    ){

        filterIndex = 0;

    }


    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;


    filterName.style.opacity =
        "1";


    clearTimeout(
        nextFilter.hideTimer
    );


    nextFilter.hideTimer =
        setTimeout(
            function(){

                filterName.style.opacity =
                    "0";

            },
            1200
        );


    /*
       Flash đa sắc nhẹ.
    */

    flashEffect();

}


/* =====================================================
   FILTER FLASH
===================================================== */

function flashEffect(){

    const colors =
        FILTERS[
            filterIndex
        ].colors;


    const color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    ctx.save();


    ctx.fillStyle =
        color;


    ctx.globalAlpha =
        .08;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    /* ================================================
       KHÔNG CÓ TAY
    ================================================= */

    if(
        detected.length === 0
    ){

        countText.innerHTML =
            "HAI TAY: <span class='no'>0 / 2</span>";

        leftText.textContent =
            "TAY TRÁI: ---";

        rightText.textContent =
            "TAY PHẢI: ---";

        stateText.textContent =
            "GESTURE: WAITING";

        instruction.textContent =
            "ĐƯA HAI BÀN TAY VÀO CAMERA";

        return;

    }


    /* ================================================
       VẼ XƯƠNG
    ================================================= */

    for(
        const hand
        of detected
    ){

        drawSkeleton(
            hand
        );

    }


    /* ================================================
       CHỈ 1 TAY
    ================================================= */

    if(
        detected.length === 1
    ){

        countText.innerHTML =
            "HAI TAY: <span class='no'>1 / 2</span>";

        instruction.textContent =
            "ĐƯA THÊM BÀN TAY THỨ HAI";

        return;

    }


    /* ================================================
       2 TAY
    ================================================= */

    let handA =
        detected[0];

    let handB =
        detected[1];


    const xA =
        screenPoint(
            handA[9]
        ).x;


    const xB =
        screenPoint(
            handB[9]
        ).x;


    let left;
    let right;


    if(
        xA < xB
    ){

        left =
            handA;

        right =
            handB;

    }
    else{

        left =
            handB;

        right =
            handA;

    }


    /* ================================================
       INDEX + THUMB
    ================================================= */

    const leftRatio =
        indexThumbRatio(
            left
        );


    const rightRatio =
        indexThumbRatio(
            right
        );


    const leftTouch =
        leftRatio < .75;


    const rightTouch =
        rightRatio < .75;


    /* ================================================
       PINKY + THUMB
    ================================================= */

    const leftPinky =
        isPinkyThumbTouch(
            left
        );


    const rightPinky =
        isPinkyThumbTouch(
            right
        );


    /* ================================================
       DEBUG
    ================================================= */

    countText.innerHTML =
        "HAI TAY: <span class='ok'>2 / 2</span>";


    leftText.innerHTML =
        "TRÁI: " +
        leftRatio.toFixed(3) +
        " → " +
        (
            leftTouch
            ?
            "<span class='ok'>TOUCH</span>"
            :
            "<span class='no'>OPEN</span>"
        );


    rightText.innerHTML =
        "PHẢI: " +
        rightRatio.toFixed(3) +
        " → " +
        (
            rightTouch
            ?
            "<span class='ok'>TOUCH</span>"
            :
            "<span class='no'>OPEN</span>"
        );


    /* ================================================
       MỞ KHUNG
    ================================================= */

    if(
        !windowOpen
    ){

        if(
            leftTouch &&
            rightTouch
        ){

            createWindow(
                left,
                right
            );

        }
        else{

            stateText.textContent =
                "GESTURE: TOUCH BOTH";

            instruction.textContent =
                "CHẠM TRỎ + CÁI Ở CẢ HAI TAY";

        }

        return;

    }


    /* ================================================
       KHUNG ĐANG MỞ
    ================================================= */

    updateWindow(
        left,
        right
    );


    /* ================================================
       ĐỔI FILTER
    ================================================= */

    if(
        leftPinky &&
        rightPinky
    ){

        nextFilter();

        stateText.innerHTML =
            "GESTURE: <span class='ok'>COLOR CHANGE</span>";

        instruction.textContent =
            "🌈 ĐÃ ĐỔI FILTER";

    }
    else{

        stateText.innerHTML =
            "GESTURE: <span class='ok'>WINDOW ACTIVE</span>";

        instruction.textContent =
            "ÚT + CÁI HAI TAY = ĐỔI MÀU";

    }

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(
    results
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    processHands(
        detected
    );


    /*
       Vẽ khung sau cùng
       để luôn nằm trên skeleton.
    */

    drawWindow();

}


/* =====================================================
   TRACKING
===================================================== */

async function startTracking(){

    hands =
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    + file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.5,

        minTrackingConfidence:.5

    });


    hands.onResults(
        onResults
    );


    running =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   LOOP
===================================================== */

async function trackingLoop(){

    if(
        !running
    ){

        return;

    }


    const now =
        performance.now();


    if(
        now - lastFrame >= 33 &&
        video.readyState >= 2
    ){

        lastFrame =
            now;


        try{

            await hands.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "HAND TRACKING:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;


    errorBox.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy mở bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorBox.textContent =
            "Không thể mở camera: " +
            error.message;


        startButton.disabled =
            false;

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        running =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }

    }
);


/* =====================================================
   ANIMATION LOOP
   Làm gradient bên trong chuyển động liên tục.
===================================================== */

function visualAnimation(){

    if(windowOpen){

        /*
           Không cần tracking mới
           vẫn làm hiệu ứng màu chuyển động.
        */

        ctx.save();

        /*
           Chỉ redraw khi có khung.
           Frame tiếp theo sẽ được
           MediaPipe vẽ lại.
        */

        ctx.restore();

    }

    requestAnimationFrame(
        visualAnimation
    );

}


visualAnimation();

</script>
