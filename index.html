<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    touch-action: none;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* ================================
   CAMERA
================================ */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 1;

    filter:
        brightness(.88)
        contrast(1.05)
        saturate(1.08);
}


/* ================================
   EFFECT CANVAS
================================ */

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;
}


/* ================================
   START SCREEN
================================ */

#startScreen {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #08101d 0%,
            #02040a 55%,
            #000 100%
        );

    color: white;

    text-align: center;
}

.startBox {
    width: min(88vw, 420px);
}

.startBox h1 {
    font-size: 44px;
    font-weight: 800;

    letter-spacing: -.06em;

    margin-bottom: 18px;
}

.startBox p {
    color: rgba(255,255,255,.65);

    font-size: 14px;

    line-height: 1.7;
}

#startButton {
    margin-top: 28px;

    padding: 16px 30px;

    border: 0;
    border-radius: 8px;

    background: white;

    color: #02040a;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .16em;

    cursor: pointer;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

#startButton:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 30px rgba(255,255,255,.25);
}

#startButton:active {
    transform: scale(.96);
}

#startButton:disabled {
    opacity: .55;
    cursor: wait;
}

#error {
    margin-top: 15px;

    color: #ff6677;

    font-size: 12px;

    line-height: 1.5;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .startBox h1 {
        font-size: 36px;
    }

    .startBox p {
        font-size: 13px;
    }

    #startButton {
        padding: 15px 25px;
    }
}
</style>
</head>


<body>

<div id="app">

    <!-- CAMERA -->
    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>


    <!-- ONLY EFFECTS ARE DRAWN HERE -->
    <canvas id="canvas"></canvas>


    <!-- START -->
    <div id="startScreen">

        <div class="startBox">

            <h1>HANDLIGHT</h1>

            <p>
                Đưa hai bàn tay vào camera.
                <br><br>

                Chạm ngón trỏ và ngón cái
                ở cả hai tay để mở khung.
                <br><br>

                Chạm ngón út và ngón cái
                ở cả hai tay để đổi màu.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<!-- ==================================
     MEDIAPIPE HANDS
================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>
"use strict";


/* ==================================
   ELEMENTS
================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: true
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");


/* ==================================
   CANVAS SIZE
================================== */

let W = 0;
let H = 0;
let DPR = 1;


function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


resize();


window.addEventListener(
    "resize",
    resize
);


/* ==================================
   LANDMARK INDEX
================================== */

const THUMB = 4;
const INDEX = 8;
const PINKY = 20;
const PALM = 9;


/* ==================================
   COLOR FILTERS
================================== */

const FILTERS = [

    [
        "#ff006e",
        "#ff4d00",
        "#ffe600",
        "#00ff88",
        "#00eaff",
        "#3867ff",
        "#b000ff"
    ],

    [
        "#00fff0",
        "#00ff9d",
        "#70ff00",
        "#00aaff",
        "#7b00ff",
        "#ff00d4"
    ],

    [
        "#ff0080",
        "#ff00ff",
        "#8a00ff",
        "#0055ff",
        "#00eaff"
    ],

    [
        "#1600ff",
        "#5c00ff",
        "#b900ff",
        "#ff00aa",
        "#ff0055",
        "#00cfff"
    ],

    [
        "#ff003c",
        "#ff4800",
        "#ff9700",
        "#ffe000",
        "#ff00a8",
        "#7200ff"
    ],

    [
        "#001eff",
        "#006eff",
        "#00c8ff",
        "#00fff0",
        "#00ff9d",
        "#64ff00"
    ],

    [
        "#ffffff",
        "#9fffff",
        "#789dff",
        "#c78cff",
        "#ff9edb",
        "#ffffff"
    ]

];


let filterIndex = 0;


/* ==================================
   WINDOW STATE
================================== */

let windowOpen = false;


/*
    Điểm hiện tại của khung
*/

const current = {

    tl: { x: 0, y: 0 },
    tr: { x: 0, y: 0 },
    br: { x: 0, y: 0 },
    bl: { x: 0, y: 0 }

};


/*
    Điểm mục tiêu
*/

const target = {

    tl: { x: 0, y: 0 },
    tr: { x: 0, y: 0 },
    br: { x: 0, y: 0 },
    bl: { x: 0, y: 0 }

};


/* ==================================
   TRACKING SMOOTHING
================================== */

const SMOOTHING = 0.22;

let trackingConfidence = 0;

let lastValidHands = 0;

const LOST_HAND_DELAY = 350;


/* ==================================
   DISTANCE
================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* ==================================
   SCREEN POINT
================================== */

function screenPoint(point) {

    return {

        x:
            (1 - point.x) * W,

        y:
            point.y * H

    };

}


/* ==================================
   HAND SIZE
================================== */

function handSize(hand) {

    return Math.max(

        distance(
            hand[0],
            hand[PALM]
        ),

        0.001

    );

}


/* ==================================
   INDEX + THUMB
================================== */

function indexThumbRatio(hand) {

    return (

        distance(
            hand[THUMB],
            hand[INDEX]
        )

        /

        handSize(hand)

    );

}


function indexThumbTouch(hand) {

    return (
        indexThumbRatio(hand) < 0.78
    );

}


/* ==================================
   PINKY + THUMB
================================== */

function pinkyThumbRatio(hand) {

    return (

        distance(
            hand[THUMB],
            hand[PINKY]
        )

        /

        handSize(hand)

    );

}


function pinkyThumbTouch(hand) {

    return (
        pinkyThumbRatio(hand) < 1.02
    );

}


/* ==================================
   SET WINDOW TARGET
================================== */

function setTargets(left, right) {

    target.tl =
        screenPoint(
            left[INDEX]
        );

    target.tr =
        screenPoint(
            right[INDEX]
        );

    target.br =
        screenPoint(
            right[THUMB]
        );

    target.bl =
        screenPoint(
            left[THUMB]
        );

}


/* ==================================
   CREATE WINDOW
================================== */

function createWindow(left, right) {

    setTargets(
        left,
        right
    );


    current.tl =
        { ...target.tl };

    current.tr =
        { ...target.tr };

    current.br =
        { ...target.br };

    current.bl =
        { ...target.bl };


    windowOpen = true;

}


/* ==================================
   SMOOTH WINDOW
================================== */

function updateWindow(left, right) {

    setTargets(
        left,
        right
    );


    const keys = [
        "tl",
        "tr",
        "br",
        "bl"
    ];


    for (const key of keys) {

        current[key].x +=
            (
                target[key].x -
                current[key].x
            ) * SMOOTHING;


        current[key].y +=
            (
                target[key].y -
                current[key].y
            ) * SMOOTHING;

    }

}


/* ==================================
   COLOR GRADIENT
================================== */

function createGradient() {

    const p = current;


    const cx =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const cy =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const gradient =
        ctx.createLinearGradient(

            cx - W * .7,
            cy - H * .7,

            cx + W * .7,
            cy + H * .7

        );


    const colors =
        FILTERS[filterIndex];


    for (
        let i = 0;
        i < colors.length;
        i++
    ) {

        gradient.addColorStop(

            i / (colors.length - 1),

            colors[i]

        );

    }


    return gradient;

}


/* ==================================
   DRAW WINDOW
================================== */

function drawWindow() {

    if (!windowOpen) {
        return;
    }


    const p = current;


    /* =================================
       CLIP WINDOW
    ================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    ctx.clip();


    /* =================================
       MAIN COLOR
    ================================= */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha = .22;

    ctx.fillStyle =
        createGradient();


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =================================
       MOVING LIGHT
    ================================= */

    const time =
        performance.now() *
        0.00025;


    const cx =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const cy =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const lightX =
        cx +
        Math.cos(time) *
        W * .35;


    const lightY =
        cy +
        Math.sin(time * 1.3) *
        H * .35;


    const glow =
        ctx.createRadialGradient(

            lightX,
            lightY,
            0,

            cx,
            cy,
            Math.max(W, H) * .75

        );


    glow.addColorStop(
        0,
        "rgba(255,255,255,.15)"
    );


    glow.addColorStop(
        .4,
        "rgba(255,255,255,.05)"
    );


    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;

    ctx.fillStyle = glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /* =================================
       NEON BORDER
    ================================= */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    ctx.strokeStyle =
        createGradient();


    ctx.lineWidth =
        Math.max(
            3,
            Math.min(W, H) * .004
        );


    ctx.lineJoin =
        "round";


    ctx.shadowColor =
        "#00eaff";


    ctx.shadowBlur = 18;


    ctx.stroke();


    /* =================================
       INNER LIGHT
    ================================= */

    ctx.shadowBlur = 5;


    ctx.strokeStyle =
        "rgba(255,255,255,.85)";


    ctx.lineWidth = 1.2;


    ctx.stroke();


    ctx.restore();

}


/* ==================================
   CHANGE COLOR
================================== */

let colorHeld = false;

let lastColorChange = 0;

const COLOR_DELAY = 750;


function changeColor() {

    const now =
        performance.now();


    if (
        now - lastColorChange <
        COLOR_DELAY
    ) {

        return;

    }


    lastColorChange = now;


    filterIndex++;

    if (
        filterIndex >= FILTERS.length
    ) {

        filterIndex = 0;

    }

}


/* ==================================
   PROCESS HANDS
================================== */

function processHands(hands) {

    /*
        Phải có đủ 2 tay.
    */

    if (hands.length < 2) {

        return;

    }


    const handA =
        hands[0];

    const handB =
        hands[1];


    /*
        Xác định trái / phải
    */

    const xA =
        screenPoint(
            handA[PALM]
        ).x;


    const xB =
        screenPoint(
            handB[PALM]
        ).x;


    let left;
    let right;


    if (xA < xB) {

        left = handA;
        right = handB;

    } else {

        left = handB;
        right = handA;

    }


    /*
        Gesture mở khung
    */

    const leftIndex =
        indexThumbTouch(left);


    const rightIndex =
        indexThumbTouch(right);


    /*
        Nếu chưa mở khung
    */

    if (!windowOpen) {

        if (
            leftIndex &&
            rightIndex
        ) {

            createWindow(
                left,
                right
            );

        }

        return;

    }


    /*
        Khung đã mở
    */

    updateWindow(
        left,
        right
    );


    /*
        Gesture đổi màu
    */

    const leftPinky =
        pinkyThumbTouch(left);


    const rightPinky =
        pinkyThumbTouch(right);


    const bothPinky =
        leftPinky &&
        rightPinky;


    if (bothPinky) {

        if (!colorHeld) {

            changeColor();

            colorHeld = true;

        }

    } else {

        colorHeld = false;

    }

}


/* ==================================
   MEDIAPIPE RESULTS
================================== */

function onResults(results) {

    /*
        Xóa canvas.

        QUAN TRỌNG:
        Không có drawSkeleton().
        Không có drawLandmarks().
        Không có debug.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks || [];


    if (detected.length >= 2) {

        lastValidHands =
            performance.now();

        trackingConfidence = 1;

        processHands(
            detected
        );

    } else {

        /*
            Không đóng khung ngay.
            Giúp chống nhấp nháy.
        */

        const elapsed =
            performance.now() -
            lastValidHands;


        if (
            elapsed >
            LOST_HAND_DELAY
        ) {

            trackingConfidence =
                0;

        }

    }


    /*
        Chỉ render cửa sổ.
    */

    drawWindow();

}


/* ==================================
   MEDIAPIPE INITIALIZATION
================================== */

let handsModel = null;

let tracking = false;

let lastSend = 0;


async function startTracking() {

    if (!window.Hands) {

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    handsModel =
        new Hands({

            locateFile: function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                    file
                );

            }

        });


    handsModel.setOptions({

        maxNumHands: 2,

        modelComplexity: 1,

        minDetectionConfidence: .55,

        minTrackingConfidence: .55

    });


    handsModel.onResults(
        onResults
    );


    tracking = true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* ==================================
   TRACKING LOOP
================================== */

async function trackingLoop() {

    if (!tracking) {
        return;
    }


    const now =
        performance.now();


    /*
        30 FPS tracking.
    */

    if (
        now - lastSend >= 33 &&
        video.readyState >= 2
    ) {

        lastSend = now;


        try {

            await handsModel.send({
                image: video
            });

        }

        catch (error) {

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* ==================================
   CAMERA
================================== */

async function startCamera() {

    startButton.disabled = true;

    errorBox.textContent = "";


    if (!window.isSecureContext) {

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled = false;

        return;

    }


    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }

    catch (error) {

        console.error(error);


        errorBox.textContent =
            "Không mở được camera: " +
            (
                error.message ||
                "Lỗi không xác định."
            );


        startButton.disabled =
            false;

    }

}


/* ==================================
   START
================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* ==================================
   CLEANUP
================================== */

window.addEventListener(
    "beforeunload",
    () => {

        tracking = false;


        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }

    }
);

</script>

</body>
</html>
