<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<meta name="theme-color" content="#05070d">

<title>HANDLIGHT V4</title>

<style>
:root{
    --bg:#05070d;
    --white:#ffffff;
    --muted:rgba(255,255,255,.58);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
}

body{
    color:white;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05070d;
}

/* =========================
   CAMERA
========================= */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#05070d;

    filter:
        brightness(.78)
        contrast(1.06)
        saturate(.95);

    z-index:0;
}

/* =========================
   EFFECT CANVAS
========================= */

#effects{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* =========================
   DARK CINEMATIC OVERLAY
========================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 28%,
            rgba(0,0,0,.12) 62%,
            rgba(0,0,0,.68) 100%
        ),

        linear-gradient(
            180deg,
            rgba(0,0,0,.35),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.52)
        );
}

/* =========================
   TOP
========================= */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    z-index:8;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        max(22px,env(safe-area-inset-top))
        20px
        15px;

    font-family:monospace;
    font-size:9px;
    letter-spacing:.18em;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 12px #fff;
}

.status{
    color:var(--muted);
}

/* =========================
   START SCREEN
========================= */

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.05),
            transparent 42%
        ),
        #05070d;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);
    text-align:center;
}

.camera-circle{
    width:72px;
    height:72px;

    margin:0 auto 28px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;

    box-shadow:
        0 0 40px
        rgba(255,255,255,.08);

    animation:
        breathe 2.8s ease-in-out infinite;
}

.camera-circle span{
    width:23px;
    height:30px;

    border:
        2px solid white;

    border-radius:
        14px 14px 9px 9px;
}

@keyframes breathe{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }
}

.eyebrow{
    margin:0 0 12px;

    color:rgba(255,255,255,.62);

    font:
        10px monospace;

    letter-spacing:.22em;
}

h1{
    margin:0;

    font-size:
        clamp(30px,9vw,46px);

    line-height:1.02;

    letter-spacing:-.045em;
}

.description{
    max-width:320px;

    margin:18px auto 28px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.start-button{
    border:0;

    padding:
        17px 28px;

    min-width:175px;

    background:#fff;

    color:#080b12;

    font:
        800 11px Arial,sans-serif;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.18);

    transition:
        transform .2s ease;
}

.start-button:active{
    transform:scale(.95);
}

.start-button:disabled{
    opacity:.5;
}

.error{
    display:none;

    margin-top:15px;

    color:rgba(255,255,255,.5);

    font-size:11px;

    line-height:1.5;
}

/* =========================
   BOTTOM
========================= */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:8;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        15px 20px
        max(25px,env(safe-area-inset-bottom));

    font:
        9px monospace;

    letter-spacing:.08em;

    color:rgba(255,255,255,.48);
}

.hint{
    display:flex;
    align-items:center;
    gap:9px;
}

.hint-line{
    width:24px;
    height:1px;

    background:white;

    box-shadow:
        0 0 8px white;
}

.gesture{
    text-align:right;
}

/* =========================
   FLASH
========================= */

#flash{
    position:absolute;
    inset:0;

    z-index:10;

    background:white;

    opacity:0;

    pointer-events:none;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .stage{
        max-width:430px;
        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }
}
</style>
</head>

<body>

<main class="stage">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="effects"></canvas>

    <div class="overlay"></div>

    <div id="flash"></div>

    <header class="top">

        <div class="logo">

            <span class="logo-dot"></span>

            HANDLIGHT

        </div>

        <div
            id="status"
            class="status">

            CAMERA OFF

        </div>

    </header>


    <!-- START -->

    <section
        id="start"
        class="start">

        <div class="start-content">

            <div class="camera-circle">
                <span></span>
            </div>

            <p class="eyebrow">
                DUAL HAND EXPERIENCE
            </p>

            <h1>
                Mở cánh cửa<br>
                bằng đôi tay
            </h1>

            <p class="description">

                Chạm ngón trỏ vào ngón cái
                của cả hai tay,
                sau đó mở hai tay ra.

            </p>

            <button
                id="startButton"
                class="start-button">

                BẬT CAMERA

            </button>

            <div
                id="error"
                class="error">
            </div>

        </div>

    </section>


    <div class="bottom">

        <div class="hint">

            <span class="hint-line"></span>

            <span id="hint">
                CHỜ HAI BÀN TAY
            </span>

        </div>

        <div
            id="gesture"
            class="gesture">

            READY

        </div>

    </div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

(() => {

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("effects");

const ctx =
    canvas.getContext("2d",{
        alpha:true
    });

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");

const hint =
    document.getElementById("hint");

const gesture =
    document.getElementById("gesture");

const flash =
    document.getElementById("flash");


/* =====================================================
   BASIC VARIABLES
===================================================== */

let stream = null;

let handsModel = null;

let tracking = false;

let lastSend = 0;

let W = 0;

let H = 0;


/* =====================================================
   PORTAL STATE

   0 = chưa kích hoạt
   1 = hai tay đang pinch
   2 = cửa sổ đang mở
===================================================== */

let state = 0;


/* =====================================================
   SMOOTH PORTAL

   target = vị trí thực tế
   current = vị trí đang hiển thị

   Dùng lerp để cửa sổ
   không giật theo landmark.
===================================================== */

const portal = {

    active:false,

    current:{
        x:0,
        y:0,
        width:0,
        height:0
    },

    target:{
        x:0,
        y:0,
        width:0,
        height:0
    },

    initialized:false,

    colorIndex:0,

    lastColorChange:0

};


/* =====================================================
   7 COLORS

   Chỉ phần kính bên trong
   dùng 7 màu này.

   VIỀN KHUNG LUÔN TRẮNG.
===================================================== */

const colors = [

    "#ff4f81",

    "#ff8b42",

    "#ffe45b",

    "#62ed8b",

    "#4ce4ff",

    "#6688ff",

    "#c76cff"

];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    W =
        canvas.clientWidth;

    H =
        canvas.clientHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    canvas.width =
        Math.floor(W*dpr);

    canvas.height =
        Math.floor(H*dpr);


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   SCREEN POINT

   Camera bị mirror nên X đảo lại.
===================================================== */

function screenPoint(p){

    return {

        x:(1-p.x)*W,

        y:p.y*H

    };

}


/* =====================================================
   PINCH INDEX + THUMB
===================================================== */

function indexPinch(hand){

    return (
        distance(
            hand[4],
            hand[8]
        ) < .075
    );

}


/* =====================================================
   PINCH PINKY + THUMB
===================================================== */

function pinkyPinch(hand){

    return (
        distance(
            hand[4],
            hand[20]
        ) < .085
    );

}


/* =====================================================
   LERP
===================================================== */

function lerp(a,b,t){

    return a +
        (b-a)*t;

}


/* =====================================================
   SMOOTH PORTAL
===================================================== */

function smoothPortal(){

    /*
        0.22 là mức mượt.
        Không quá chậm,
        cũng không giật.
    */

    const smooth = .22;


    portal.current.x =
        lerp(
            portal.current.x,
            portal.target.x,
            smooth
        );


    portal.current.y =
        lerp(
            portal.current.y,
            portal.target.y,
            smooth
        );


    portal.current.width =
        lerp(
            portal.current.width,
            portal.target.width,
            smooth
        );


    portal.current.height =
        lerp(
            portal.current.height,
            portal.target.height,
            smooth
        );

}


/* =====================================================
   ENERGY DOT
===================================================== */

function drawGlow(
    p,
    color="#ffffff",
    size=1
){

    const r =
        18*size;


    const gradient =
        ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            r*3
        );


    gradient.addColorStop(
        0,
        color
    );

    gradient.addColorStop(
        .25,
        color+"aa"
    );

    gradient.addColorStop(
        1,
        color+"00"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        r*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.save();

    ctx.fillStyle =
        "#fff";

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        18;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        3.2*size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   ENERGY LINE

   Đây là đường nối hai ngón.
   LUÔN TRẮNG.
===================================================== */

function drawEnergyLine(a,b){

    ctx.save();

    ctx.lineCap =
        "round";


    /* outer glow */

    ctx.strokeStyle =
        "rgba(255,255,255,.7)";

    ctx.shadowColor =
        "#ffffff";

    ctx.shadowBlur =
        24;

    ctx.lineWidth =
        5;


    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    /* core */

    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        1.4;


    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   PORTAL GLASS

   Đây là phần QUAN TRỌNG.

   Màu chỉ nằm bên trong
   cửa sổ.
===================================================== */

function drawGlass(){

    if(
        !portal.active
    ){

        return;

    }


    const p =
        portal.current;


    const x =
        p.x-p.width/2;

    const y =
        p.y-p.height/2;

    const w =
        p.width;

    const h =
        p.height;


    if(
        w < 40 ||
        h < 40
    ){

        return;

    }


    const color =
        colors[
            portal.colorIndex
        ];


    ctx.save();


    /*
        CLIP
        để màu không tràn ra
        ngoài cửa sổ.
    */

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        18
    );

    ctx.clip();


    /* =====================
       GLASS GRADIENT
    ===================== */

    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x+w,
            y+h
        );


    gradient.addColorStop(
        0,
        color+"42"
    );

    gradient.addColorStop(
        .35,
        color+"18"
    );

    gradient.addColorStop(
        .65,
        "#ffffff08"
    );

    gradient.addColorStop(
        1,
        color+"3c"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /*
        Ánh sáng ở giữa
    */

    const radial =
        ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            Math.max(w,h)*.65
        );


    radial.addColorStop(
        0,
        "#ffffff22"
    );

    radial.addColorStop(
        .45,
        color+"12"
    );

    radial.addColorStop(
        1,
        color+"00"
    );


    ctx.fillStyle =
        radial;


    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    /*
        SCAN LINES
    */

    const time =
        performance.now()*.035;


    ctx.globalAlpha =
        .12;


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth = 1;


    for(
        let yy =
            y-40+(time%40);
        yy<y+h;
        yy+=40
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            yy
        );

        ctx.lineTo(
            x+w,
            yy
        );

        ctx.stroke();

    }


    /*
        shine diagonal
    */

    const shine =
        ctx.createLinearGradient(
            x,
            y,
            x+w,
            y+h
        );


    shine.addColorStop(
        0,
        "#ffffff00"
    );

    shine.addColorStop(
        .45,
        "#ffffff15"
    );

    shine.addColorStop(
        .5,
        "#ffffff2a"
    );

    shine.addColorStop(
        .55,
        "#ffffff15"
    );

    shine.addColorStop(
        1,
        "#ffffff00"
    );


    ctx.globalAlpha =
        .7;

    ctx.fillStyle =
        shine;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    ctx.restore();

}


/* =====================================================
   PORTAL FRAME

   KHUNG LUÔN TRẮNG.
===================================================== */

function drawPortalFrame(){

    if(
        !portal.active
    ){

        return;

    }


    const p =
        portal.current;


    const x =
        p.x-p.width/2;

    const y =
        p.y-p.height/2;

    const w =
        p.width;

    const h =
        p.height;


    if(
        w<40 ||
        h<40
    ){

        return;

    }


    ctx.save();


    /*
        Outer glow
    */

    ctx.shadowColor =
        "#ffffff";

    ctx.shadowBlur =
        25;


    ctx.strokeStyle =
        "rgba(255,255,255,.95)";

    ctx.lineWidth =
        2;


    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        w,
        h,
        18
    );

    ctx.stroke();


    /*
        Inner white line
    */

    ctx.shadowBlur =
        8;

    ctx.strokeStyle =
        "rgba(255,255,255,.55)";

    ctx.lineWidth =
        1;


    ctx.beginPath();

    ctx.roundRect(
        x+7,
        y+7,
        w-14,
        h-14,
        13
    );

    ctx.stroke();


    /*
        Corner energy
    */

    ctx.shadowColor =
        "#ffffff";

    ctx.shadowBlur =
        15;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;


    const c = 20;


    /* top left */

    ctx.beginPath();

    ctx.moveTo(x,y+c);

    ctx.lineTo(x,y);

    ctx.lineTo(x+c,y);

    ctx.stroke();


    /* top right */

    ctx.beginPath();

    ctx.moveTo(x+w-c,y);

    ctx.lineTo(x+w,y);

    ctx.lineTo(x+w,y+c);

    ctx.stroke();


    /* bottom left */

    ctx.beginPath();

    ctx.moveTo(x,y+h-c);

    ctx.lineTo(x,y+h);

    ctx.lineTo(x+c,y+h);

    ctx.stroke();


    /* bottom right */

    ctx.beginPath();

    ctx.moveTo(x+w-c,y+h);

    ctx.lineTo(x+w,y+h);

    ctx.lineTo(x+w,y+h-c);

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   FULL PORTAL
===================================================== */

function drawPortal(){

    if(
        !portal.active
    ){

        return;

    }


    drawGlass();

    drawPortalFrame();

}


/* =====================================================
   CHANGE COLOR
===================================================== */

function changeColor(){

    const now =
        performance.now();


    /*
        Chống đổi màu liên tục
        khi người dùng giữ ngón.
    */

    if(
        now-
        portal.lastColorChange
        <
        900
    ){

        return;

    }


    portal.lastColorChange =
        now;


    portal.colorIndex =
        (
            portal.colorIndex+1
        ) %
        colors.length;


    flashEffect();

}


/* =====================================================
   FLASH
===================================================== */

function flashEffect(){

    flash.animate(

        [
            {
                opacity:0
            },

            {
                opacity:.10
            },

            {
                opacity:0
            }
        ],

        {
            duration:300,
            easing:"ease-out"
        }

    );

}


/* =====================================================
   SET PORTAL TARGET

   Hai ngón trỏ là điểm điều khiển
   duy nhất của cửa sổ.
===================================================== */

function setPortalTarget(
    leftIndex,
    rightIndex
){

    const centerX =
        (
            leftIndex.x+
            rightIndex.x
        )/2;

    const centerY =
        (
            leftIndex.y+
            rightIndex.y
        )/2;


    const spread =
        distance(
            leftIndex,
            rightIndex
        );


    /*
        Kích thước cửa sổ
        dựa trực tiếp vào
        khoảng cách hai ngón trỏ.
    */

    const targetWidth =
        Math.max(
            120,
            spread*1.15
        );


    const targetHeight =
        Math.max(
            100,
            spread*.72
        );


    portal.target.x =
        centerX;

    portal.target.y =
        centerY;

    portal.target.width =
        targetWidth;

    portal.target.height =
        targetHeight;


    /*
        Frame đầu tiên
        đặt ngay lập tức
        tránh cửa sổ bay từ góc màn hình.
    */

    if(
        !portal.initialized
    ){

        portal.current.x =
            portal.target.x;

        portal.current.y =
            portal.target.y;

        portal.current.width =
            portal.target.width;

        portal.current.height =
            portal.target.height;

        portal.initialized =
            true;

    }

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    handData
){

    /*
        Cần đủ 2 tay.
    */

    if(
        handData.length < 2
    ){

        /*
            KHÔNG XÓA PORTAL NGAY.

            Điều này cực kỳ quan trọng:
            MediaPipe đôi khi mất tay 1 frame.

            Portal vẫn giữ vị trí cũ,
            tránh nhấp nháy/mất cửa sổ.
        */

        if(
            state === 0
        ){

            hint.textContent =
                "ĐƯA HAI BÀN TAY VÀO KHUNG";

            gesture.textContent =
                "WAITING";

        }


        return;

    }


    /*
        Chuyển sang tọa độ màn hình.
    */

    const screenHands =
        handData.map(
            hand =>
                hand.map(
                    screenPoint
                )
        );


    /*
        Xác định trái/phải
        bằng vị trí trên màn hình.

        Không phụ thuộc MediaPipe
        báo Left/Right.
    */

    screenHands.sort(
        (a,b) =>
            a[9].x-b[9].x
    );


    const left =
        screenHands[0];

    const right =
        screenHands[1];


    const leftIndex =
        left[8];

    const rightIndex =
        right[8];


    const leftThumb =
        left[4];

    const rightThumb =
        right[4];


    /*
        ========================
        GIAI ĐOẠN 1
        ========================
    */

    const leftPinch =
        indexPinch(left);

    const rightPinch =
        indexPinch(right);


    const bothPinch =
        leftPinch &&
        rightPinch;


    /*
        Khi chưa kích hoạt
    */

    if(
        state === 0
    ){

        hint.textContent =
            "CHẠM TRỎ + CÁI Ở CẢ HAI TAY";

        gesture.textContent =
            "READY";


        /*
            Vẽ điểm chỉ dẫn
        */

        drawGlow(
            leftIndex,
            "#ffffff",
            .7
        );

        drawGlow(
            rightIndex,
            "#ffffff",
            .7
        );


        /*
            Cả hai bên cùng pinch
        */

        if(
            bothPinch
        ){

            state = 1;

            drawEnergyLine(
                leftIndex,
                rightIndex
            );


            hint.textContent =
                "BÂY GIỜ MỞ HAI TAY RA";

            gesture.textContent =
                "ENERGY LINK";

        }


        return;

    }


    /*
        ========================
        GIAI ĐOẠN 2
        ========================
    */

    if(
        state === 1
    ){

        /*
            Luôn nối hai ngón
        */

        drawEnergyLine(
            leftIndex,
            rightIndex
        );


        const spread =
            distance(
                leftIndex,
                rightIndex
            );


        /*
            Khi mở đủ rộng
            tạo portal.
        */

        if(
            !bothPinch &&
            spread >
            Math.min(W,H)*.25
        ){

            state = 2;

            portal.active =
                true;

            portal.initialized =
                false;

            setPortalTarget(
                leftIndex,
                rightIndex
            );


            hint.textContent =
                "ÚT + CÁI HAI BÊN ĐỂ ĐỔI MÀU";

            gesture.textContent =
                "PORTAL";

            flashEffect();

        }


        return;

    }


    /*
        ========================
        GIAI ĐOẠN 3
        PORTAL
        ========================
    */

    if(
        state === 2
    ){

        /*
            CỬA SỔ LUÔN BÁM
            THEO HAI NGÓN TRỎ.
        */

        setPortalTarget(
            leftIndex,
            rightIndex
        );


        /*
            ÚT + CÁI
            CẢ HAI BÊN
        */

        const leftPinky =
            pinkyPinch(left);

        const rightPinky =
            pinkyPinch(right);


        if(
            leftPinky &&
            rightPinky
        ){

            changeColor();

        }

    }

}


/* =====================================================
   RESULTS
===================================================== */

function onResults(result){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        result.multiHandLandmarks || [];


    processHands(
        detected
    );


    /*
        LUÔN smooth portal
        dù frame này MediaPipe
        có nhận đủ tay hay không.
    */

    smoothPortal();


    /*
        Vẽ portal sau cùng.
    */

    drawPortal();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(
        !tracking
    ){

        return;

    }


    const now =
        performance.now();


    /*
        Khoảng 22 FPS.
        Giảm tải CPU điện thoại.
    */

    if(
        handsModel &&
        video.readyState >= 2 &&
        now-lastSend >= 45
    ){

        lastSend =
            now;


        try{

            await handsModel.send({
                image:video
            });

        }
        catch(err){

            console.warn(
                "Hand tracking error:",
                err
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    if(
        !window.Hands
    ){

        status.textContent =
            "CAMERA OK";

        return;

    }


    try{

        handsModel =
            new Hands({

                locateFile:
                    file =>
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    +file

            });


        handsModel.setOptions({

            /*
                BẮT BUỘC 2 TAY
            */

            maxNumHands:2,

            /*
                Model nhẹ.
            */

            modelComplexity:0,

            minDetectionConfidence:.55,

            minTrackingConfidence:.55

        });


        handsModel.onResults(
            onResults
        );


        tracking =
            true;


        requestAnimationFrame(
            trackingLoop
        );


    }
    catch(err){

        console.error(
            err
        );

        status.textContent =
            "CAMERA OK";

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        text;

    startButton.disabled =
        false;

}


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
        true;

    status.textContent =
        "ĐANG XIN QUYỀN";

    errorBox.style.display =
        "none";


    if(
        !window.isSecureContext
    ){

        showError(
            "Trang cần chạy bằng HTTPS. Hãy dùng link GitHub Pages."
        );

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "Thiết bị hoặc trình duyệt không hỗ trợ Camera."
        );

        return;

    }


    try{

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:24,
                        max:30
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        resize();


        start.classList.add(
            "hide"
        );


        status.textContent =
            "HAND TRACKING";


        await startTracking();

    }
    catch(err){

        console.error(err);

        status.textContent =
            "CAMERA ERROR";

        startButton.disabled =
            false;


        if(
            err.name ===
            "NotAllowedError" ||
            err.name ===
            "PermissionDeniedError"
        ){

            showError(
                "Camera đang bị chặn. Hãy cấp quyền Camera cho trình duyệt."
            );

        }
        else if(
            err.name ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera."
            );

        }
        else if(
            err.name ===
            "NotReadableError"
        ){

            showError(
                "Camera đang được ứng dụng khác sử dụng."
            );

        }
        else{

            showError(
                "Không thể mở Camera."
            );

        }

    }

}


/* =====================================================
   EVENTS
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "beforeunload",
    () => {

        tracking =
            false;


        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

resize();

})();

</script>
