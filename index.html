<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<title>HANDLIGHT</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    touch-action: none;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}


/* =========================================
   CAMERA
========================================= */

#video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 1;

    filter:
        brightness(.88)
        contrast(1.05)
        saturate(1.08);
}


/* =========================================
   CANVAS
========================================= */

#canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;
}


/* =========================================
   START SCREEN
========================================= */

#startScreen {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #08101d 0%,
            #02040a 55%,
            #000 100%
        );

    color: white;

    text-align: center;
}

.startBox {

    width: min(88vw, 420px);

}

.startBox h1 {

    margin-bottom: 18px;

}

.startBox p {

        rgba(255,255,255,.65);

    font-size: 14px;

}

#startButton {

        16px 30px;

}

@media (max-width:600px) {

<body>


<div id="app">


<!-- ======================================
     CAMERA
====================================== -->

<video

    playsinline>
</video>


<!-- ======================================
     EFFECT CANVAS

<canvas id="canvas"></canvas>

<div id="startScreen">

        <h1>

        </h1>

            Chạm ngón trỏ và ngón cái
            ở cả hai tay để mở khung.

            Chạm ngón út và ngón cái

            BẬT CAMERA

        </button>


        <div id="error"></div>

    </div>

</div>

<!-- ======================================
     MEDIAPIPE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

"use strict";


/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: true
        }
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const errorBox =
    document.getElementById(
        "error"
    );


/* =========================================
   SIZE
========================================= */

let W = 0;

let H = 0;

let DPR = 1;


function resize() {

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.round(
            W * DPR
        );


    canvas.height =
        Math.round(
            H * DPR
        );


    canvas.style.width =
        W + "px";


    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =========================================
   MEDIAPIPE LANDMARK INDEX
========================================= */

const THUMB = 4;

const INDEX = 8;

const PINKY = 20;

const PALM = 9;


/* =========================================
   COLOR FILTERS
========================================= */

const FILTERS = [

    [
        "#ff006e",
        "#ff4d00",
        "#ffe600",
        "#00ff88",
        "#00eaff",
        "#3867ff",
        "#b000ff"
    ],

    [
        "#00fff0",
        "#00ff9d",
        "#70ff00",
        "#00aaff",
        "#7b00ff",
        "#ff00d4"
    ],

    [
        "#ff0080",
        "#ff00ff",
        "#8a00ff",
        "#0055ff",
        "#00eaff"
    ],

    [
        "#1600ff",
        "#5c00ff",
        "#b900ff",
        "#ff00aa",
        "#ff0055",
        "#00cfff"
    ],

    [
        "#ff003c",
        "#ff4800",
        "#ff9700",
        "#ffe000",
        "#ff00a8",
        "#7200ff"
    ],

    [
        "#001eff",
        "#006eff",
        "#00c8ff",
        "#00fff0",
        "#00ff9d",
        "#64ff00"
    ],

    [
        "#ffffff",
        "#9fffff",
        "#789dff",
        "#c78cff",
        "#ff9edb",
        "#ffffff"
    ]

];


let filterIndex = 0;


/* =========================================
   WINDOW
========================================= */

let windowOpen = false;


/* =========================================
   CURRENT POSITION
========================================= */

const current = {

    tl: {
        x: 0,
        y: 0
    },

    tr: {
        x: 0,
        y: 0
    },

    br: {
        x: 0,
        y: 0
    },

    bl: {
        x: 0,
        y: 0
    }

};


/* =========================================
   TARGET POSITION
========================================= */

const target = {

    tl: {
        x: 0,
        y: 0
    },

    tr: {
        x: 0,
        y: 0
    },

    br: {
        x: 0,
        y: 0
    },

    bl: {
        x: 0,
        y: 0
    }

};


/* =========================================
   ULTRA SMOOTH SYSTEM

   SMOOTH_MIN:
   chống rung khi tay đứng yên.

   SMOOTH_MAX:
   tăng tốc khi tay di chuyển nhanh.

   DEAD_ZONE:
   bỏ qua những rung động cực nhỏ.

   VELOCITY_FACTOR:
   dự đoán nhẹ hướng di chuyển
   để giảm cảm giác trễ.
========================================= */

const SMOOTH_MIN = 0.16;

const SMOOTH_MAX = 0.52;

const DEAD_ZONE = 0.30;

const VELOCITY_FACTOR = 0.10;


/* =========================================
   VELOCITY
========================================= */

const velocity = {

    tl: {
        x: 0,
        y: 0
    },

    tr: {
        x: 0,
        y: 0
    },

    br: {
        x: 0,
        y: 0
    },

    bl: {
        x: 0,
        y: 0
    }

};


/* =========================================
   LAST TARGET
========================================= */

const lastTarget = {

    tl: {
        x: 0,
        y: 0
    },

    tr: {
        x: 0,
        y: 0
    },

    br: {
        x: 0,
        y: 0
    },

    bl: {
        x: 0,
        y: 0
    }

};


/* =========================================
   DISTANCE
========================================= */

function distance(
    a,
    b
) {

    return Math.hypot(

        a.x - b.x,

        a.y - b.y

    );

}


/* =========================================
   SCREEN POINT

   Vì camera mirror:
   X phải đảo lại.
========================================= */

function screenPoint(
    point
) {

    return {

        x:
            (1 - point.x) *
            W,

        y:
            point.y *
            H

    };

}


/* =========================================
   HAND SIZE
========================================= */

function handSize(
    hand
) {

    return Math.max(

        distance(
            hand[0],
            hand[PALM]
        ),

        0.001

    );

}


/* =========================================
   INDEX + THUMB
========================================= */

function indexThumbRatio(
    hand
) {

    return (

        distance(
            hand[THUMB],
            hand[INDEX]
        )

        /

        handSize(hand)

    );

}


function indexThumbTouch(
    hand
) {

    return (

        indexThumbRatio(hand)

        < 0.78

    );

}


/* =========================================
   PINKY + THUMB
========================================= */

function pinkyThumbRatio(
    hand
) {

    return (

        distance(
            hand[THUMB],
            hand[PINKY]
        )

        /

        handSize(hand)

    );

}


function pinkyThumbTouch(
    hand
) {

    return (

        pinkyThumbRatio(hand)

        < 1.02

    );

}


/* =========================================
   SET TARGETS
========================================= */

function setTargets(
    left,
    right
) {

    /*
        Trỏ trái
        → góc trên trái
    */

    target.tl =
        screenPoint(
            left[INDEX]
        );


    /*
        Trỏ phải
        → góc trên phải
    */

    target.tr =
        screenPoint(
            right[INDEX]
        );


    /*
        Cái phải
        → góc dưới phải
    */

    target.br =
        screenPoint(
            right[THUMB]
        );


    /*
        Cái trái
        → góc dưới trái
    */

    target.bl =
        screenPoint(
            left[THUMB]
        );

}


/* =========================================
   CREATE WINDOW
========================================= */

function createWindow(
    left,
    right
) {

    setTargets(
        left,
        right
    );


    current.tl =
        {
            ...target.tl
        };


    current.tr =
        {
            ...target.tr
        };


    current.br =
        {
            ...target.br
        };


    current.bl =
        {
            ...target.bl
        };


    lastTarget.tl =
        {
            ...target.tl
        };


    lastTarget.tr =
        {
            ...target.tr
        };


    lastTarget.br =
        {
            ...target.br
        };


    lastTarget.bl =
        {
            ...target.bl
        };


    velocity.tl =
        {
            x: 0,
            y: 0
        };


    velocity.tr =
        {
            x: 0,
            y: 0
        };


    velocity.br =
        {
            x: 0,
            y: 0
        };


    velocity.bl =
        {
            x: 0,
            y: 0
        };


    windowOpen = true;

}


/* =========================================
   ULTRA SMOOTH WINDOW UPDATE
========================================= */

function updateWindow(
    left,
    right
) {

    setTargets(
        left,
        right
    );


    const keys = [
        "tl",
        "tr",
        "br",
        "bl"
    ];


    for (
        const key of keys
    ) {

        const t =
            target[key];

        const c =
            current[key];

        const last =
            lastTarget[key];

        const v =
            velocity[key];


        /* ================================
           RAW MOVEMENT
        ================================= */

        const dx =
            t.x -
            last.x;


        const dy =
            t.y -
            last.y;


        /* ================================
           SMOOTH VELOCITY
        ================================= */

        v.x =
            v.x * 0.72 +
            dx * 0.28;


        v.y =
            v.y * 0.72 +
            dy * 0.28;


        /* ================================
           PREDICTION

           Dự đoán rất nhẹ.
        ================================= */

        const predictedX =
            t.x +
            v.x *
            VELOCITY_FACTOR;


        const predictedY =
            t.y +
            v.y *
            VELOCITY_FACTOR;


        /* ================================
           DISTANCE
        ================================= */

        const distanceToTarget =
            Math.hypot(

                predictedX -
                c.x,

                predictedY -
                c.y

            );


        /* ================================
           SPEED

           0 = đứng yên
           1 = di chuyển nhanh
        ================================= */

        const speed =
            Math.min(

                distanceToTarget /
                80,

                1

            );


        /* ================================
           ADAPTIVE SMOOTH
        ================================= */

        const smooth =
            SMOOTH_MIN +

            (
                SMOOTH_MAX -
                SMOOTH_MIN
            ) *

            speed;


        /* ================================
           DEAD ZONE

           Loại rung rất nhỏ.
        ================================= */

        if (
            distanceToTarget >
            DEAD_ZONE
        ) {

            c.x +=
                (
                    predictedX -
                    c.x
                ) *

                smooth;


            c.y +=
                (
                    predictedY -
                    c.y
                ) *

                smooth;

        }


        /* ================================
           SAVE
        ================================= */

        last.x =
            t.x;

        last.y =
            t.y;

    }

}


/* =========================================
   GRADIENT
========================================= */

function createGradient() {

    const p =
        current;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const gradient =
        ctx.createLinearGradient(

            centerX -
            W * .7,

            centerY -
            H * .7,

            centerX +
            W * .7,

            centerY +
            H * .7

        );


    const colors =
        FILTERS[
            filterIndex
        ];


    for (
        let i = 0;
        i < colors.length;
        i++
    ) {

        gradient.addColorStop(

            i /
            (
                colors.length -
                1
            ),

            colors[i]

        );

    }


    return gradient;

}


/* =========================================
   DRAW WINDOW
========================================= */

function drawWindow() {

    if (
        !windowOpen
    ) {

        return;

    }


    const p =
        current;


    /* ======================================
       WINDOW CLIP
    ====================================== */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    ctx.clip();


    /* ======================================
       COLOR
    ====================================== */

    ctx.globalCompositeOperation =
        "screen";


    ctx.globalAlpha =
        0.23;


    ctx.fillStyle =
        createGradient();


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ======================================
       MOVING LIGHT
    ====================================== */

    const time =
        performance.now() *
        0.00025;


    const centerX =
        (
            p.tl.x +
            p.tr.x +
            p.br.x +
            p.bl.x
        ) / 4;


    const centerY =
        (
            p.tl.y +
            p.tr.y +
            p.br.y +
            p.bl.y
        ) / 4;


    const lightX =
        centerX +

        Math.cos(time) *
        W *
        .35;


    const lightY =
        centerY +

        Math.sin(
            time * 1.3
        ) *

        H *
        .35;


    const glow =
        ctx.createRadialGradient(

            lightX,
            lightY,
            0,

            centerX,
            centerY,

            Math.max(
                W,
                H
            ) * .75

        );


    glow.addColorStop(
        0,
        "rgba(255,255,255,.15)"
    );


    glow.addColorStop(
        .4,
        "rgba(255,255,255,.05)"
    );


    glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.globalAlpha = 1;


    ctx.fillStyle =
        glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();


    /* ======================================
       NEON BORDER
    ====================================== */

    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );


    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );


    ctx.lineTo(
        p.br.x,
        p.br.y
    );


    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );


    ctx.closePath();


    ctx.strokeStyle =
        createGradient();


    ctx.lineWidth =
        Math.max(

            3,

            Math.min(
                W,
                H
            ) * .004

        );


    ctx.lineJoin =
        "round";


    ctx.shadowColor =
        "#00eaff";


    ctx.shadowBlur =
        18;


    ctx.stroke();


    /* ======================================
       WHITE INNER LINE
    ====================================== */

    ctx.shadowBlur = 5;


    ctx.strokeStyle =
        "rgba(255,255,255,.85)";


    ctx.lineWidth =
        1.2;


    ctx.stroke();


    ctx.restore();

}


/* =========================================
   COLOR GESTURE
========================================= */

let colorHeld = false;

let lastColorChange = 0;

const COLOR_DELAY = 750;


function changeColor() {

    const now =
        performance.now();


    if (
        now -
        lastColorChange
        <
        COLOR_DELAY
    ) {

        return;

    }


    lastColorChange =
        now;


    filterIndex++;


    if (
        filterIndex >=
        FILTERS.length
    ) {

        filterIndex = 0;

    }

}


/* =========================================
   PROCESS HANDS
========================================= */

function processHands(
    detected
) {

    /*
        Cần 2 tay.
    */

    if (
        detected.length < 2
    ) {

        return;

    }


    const handA =
        detected[0];

    const handB =
        detected[1];


    /* ======================================
       LEFT / RIGHT
    ====================================== */

    const xA =
        screenPoint(
            handA[PALM]
        ).x;


    const xB =
        screenPoint(
            handB[PALM]
        ).x;


    let left;

    let right;


    if (
        xA < xB
    ) {

        left =
            handA;

        right =
            handB;

    }

    else {

        left =
            handB;

        right =
            handA;

    }


    /* ======================================
       INDEX + THUMB
    ====================================== */

    const leftIndex =
        indexThumbTouch(
            left
        );


    const rightIndex =
        indexThumbTouch(
            right
        );


    /* ======================================
       OPEN WINDOW
    ====================================== */

    if (
        !windowOpen
    ) {

        if (
            leftIndex &&
            rightIndex
        ) {

            createWindow(
                left,
                right
            );

        }

        return;

    }


    /* ======================================
       UPDATE
    ====================================== */

    updateWindow(
        left,
        right
    );


    /* ======================================
       PINKY + THUMB
    ====================================== */

    const leftPinky =
        pinkyThumbTouch(
            left
        );


    const rightPinky =
        pinkyThumbTouch(
            right
        );


    const bothPinky =
        leftPinky &&
        rightPinky;


    if (
        bothPinky
    ) {

        if (
            !colorHeld
        ) {

            changeColor();

            colorHeld =
                true;

        }

    }

    else {

        colorHeld =
            false;

    }

}


/* =========================================
   MEDIAPIPE RESULT
========================================= */

function onResults(
    results
) {

    /*
        Xóa frame trước.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
        MediaPipe vẫn trả về
        toàn bộ 21 landmark.
    */

    const detected =
        results.multiHandLandmarks ||
        [];


    /*
        Chỉ xử lý logic.
        
        KHÔNG vẽ skeleton.
        KHÔNG vẽ landmark.
        KHÔNG vẽ debug.
    */

    processHands(
        detected
    );


    /*
        Chỉ vẽ cửa sổ.
    */

    drawWindow();

}


/* =========================================
   MEDIAPIPE
========================================= */

let handsModel =
    null;

let tracking =
    false;

let lastSend =
    0;


/* =========================================
   START TRACKING
========================================= */

async function startTracking() {

    if (
        !window.Hands
    ) {

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    handsModel =
        new Hands({

            locateFile:
                function(file) {

                    return (

                        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                        file

                    );

                }

        });


    handsModel.setOptions({

        maxNumHands:
            2,

        modelComplexity:
            1,

        minDetectionConfidence:
            .55,

        minTrackingConfidence:
            .55

    });


    handsModel.onResults(
        onResults
    );


    tracking =
        true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =========================================
   TRACKING LOOP
========================================= */

async function trackingLoop() {

    if (
        !tracking
    ) {

        return;

    }


    const now =
        performance.now();


    /*
        30 FPS ổn định.
    */

    if (

        now -
        lastSend
        >=
        33

        &&

        video.readyState
        >=
        2

    ) {

        lastSend =
            now;


        try {

            await handsModel.send({

                image:
                    video

            });

        }

        catch (error) {

            console.error(
                "MediaPipe:",
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =========================================
   CAMERA
========================================= */

async function startCamera() {

    startButton.disabled =
        true;


    errorBox.textContent =
        "";


    /*
        HTTPS bắt buộc
        trên điện thoại.
    */

    if (
        !window.isSecureContext
    ) {

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";


        startButton.disabled =
            false;


        return;

    }


    try {

        if (

            !navigator.mediaDevices ||

            !navigator
                .mediaDevices
                .getUserMedia

        ) {

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:
                        false,

                    video: {

                        facingMode: {

                            ideal:
                                "user"

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        },

                        frameRate: {

                            ideal:
                                30,

                            max:
                                30

                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }

    catch (error) {

        console.error(
            error
        );


        errorBox.textContent =

            "Không mở được camera: " +

            (
                error.message ||
                "Lỗi không xác định."
            );


        startButton.disabled =
            false;

    }

}


/* =========================================
   START BUTTON
========================================= */

startButton.addEventListener(

    "click",

    startCamera

);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(

    "beforeunload",

    function() {

        tracking =
            false;


        if (
            video.srcObject
        ) {

            video.srcObject
                .getTracks()
                .forEach(

                    function(track) {

                        track.stop();

                    }

                );

        }

    }

);

</script>
