<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<title>HANDLIGHT</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,sans-serif;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05080d;
}

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    filter:
        brightness(.78)
        contrast(1.05)
        saturate(.92);

    z-index:0;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.08) 70%,
            rgba(0,0,0,.45) 100%
        );
}


/* ================================
   TOP
================================ */

.top{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        max(20px,env(safe-area-inset-top))
        20px
        15px;

    color:white;

    font:9px monospace;

    letter-spacing:.16em;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:white;

    box-shadow:0 0 12px white;
}

.status{
    color:rgba(255,255,255,.55);
}


/* ================================
   DEBUG
================================ */

#debug{
    position:absolute;

    left:15px;
    top:70px;

    z-index:12;

    padding:10px 12px;

    background:rgba(0,0,0,.38);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:8px;

    color:white;

    font:
        10px monospace;

    line-height:1.7;

    pointer-events:none;

    backdrop-filter:blur(5px);
}


/* ================================
   START
================================ */

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#05080d;

    transition:.4s;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);

    text-align:center;
}

.camera-icon{
    width:68px;
    height:68px;

    margin:0 auto 25px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;
}

.camera-icon span{
    width:21px;
    height:29px;

    border:
        2px solid white;

    border-radius:
        13px 13px 8px 8px;
}

.eyebrow{
    color:
        rgba(255,255,255,.55);

    font:10px monospace;

    letter-spacing:.2em;
}

h1{
    margin:0;

    font-size:
        clamp(30px,8vw,44px);

    line-height:1.03;
}

.desc{
    max-width:320px;

    margin:
        18px auto 27px;

    color:
        rgba(255,255,255,.55);

    font-size:14px;

    line-height:1.6;
}

button{
    border:0;

    padding:
        16px 25px;

    background:white;

    color:#05080d;

    font-weight:800;

    font-size:11px;

    letter-spacing:.14em;

    cursor:pointer;
}

.error{
    display:none;

    margin-top:15px;

    color:
        rgba(255,255,255,.6);

    font-size:11px;
}


/* ================================
   BOTTOM
================================ */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:10;

    display:flex;
    justify-content:space-between;

    padding:
        15px
        20px
        max(24px,env(safe-area-inset-bottom));

    color:
        rgba(255,255,255,.55);

    font:9px monospace;

    letter-spacing:.08em;
}


@media(min-width:700px){

    .stage{
        max-width:430px;

        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }

}

</style>
</head>


<body>

<main class="stage">

<video
id="camera"
autoplay
muted
playsinline>
</video>

<canvas id="canvas"></canvas>

<div class="overlay"></div>


<header class="top">

<div class="logo">

<span class="dot"></span>

HANDLIGHT

</div>

<div
id="status">

CAMERA OFF

</div>

</header>


<div id="debug">

2 HANDS: NO<br>
TRÁI: ---<br>
PHẢI: ---<br>
GESTURE: WAITING

</div>


<section
id="start"
class="start">

<div class="start-content">

<div class="camera-icon">
<span></span>
</div>

<div class="eyebrow">
HAND TRACKING
</div>

<h1>
Đưa hai bàn tay<br>
vào camera
</h1>

<p class="desc">
Đưa hai bàn tay vào camera
và chạm ngón trỏ với ngón cái.
</p>

<button
id="startButton">

BẬT CAMERA

</button>

<div
id="error"
class="error">
</div>

</div>

</section>


<div class="bottom">

<div id="hint">
CHỜ HAI BÀN TAY
</div>

<div id="gesture">
READY
</div>

</div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const status =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const hint =
document.getElementById("hint");

const gesture =
document.getElementById("gesture");

const debug =
document.getElementById("debug");


/* =====================================================
   CANVAS
===================================================== */

let W=0;
let H=0;
let DPR=1;


function resize(){

    W =
        canvas.clientWidth;

    H =
        canvas.clientHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands=null;

let running=false;

let lastSend=0;


/* =====================================================
   XƯƠNG BÀN TAY
===================================================== */

const connections=[

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   SMOOTH
===================================================== */

let previousHands=[];

const SMOOTH=.42;


function smoothHand(
    oldHand,
    newHand
){

    if(!oldHand){

        return newHand.map(
            p => ({
                x:p.x,
                y:p.y,
                z:p.z || 0
            })
        );

    }


    return newHand.map(
        (p,i)=>{

            const old =
                oldHand[i];

            if(!old){

                return {
                    x:p.x,
                    y:p.y,
                    z:p.z || 0
                };

            }


            return {

                x:
                    old.x+
                    (p.x-old.x)*
                    SMOOTH,

                y:
                    old.y+
                    (p.y-old.y)*
                    SMOOTH,

                z:
                    old.z+
                    ((p.z||0)-old.z)*
                    SMOOTH

            };

        }
    );

}


/* =====================================================
   SCREEN POINT
===================================================== */

function screenPoint(p){

    return {

        x:
            (1-p.x)*W,

        y:
            p.y*H

    };

}


/* =====================================================
   DRAW SKELETON
===================================================== */

function drawSkeleton(
    hand
){

    const points =
        hand.map(
            screenPoint
        );


    ctx.save();


    ctx.lineCap=
        "round";

    ctx.lineJoin=
        "round";


    /* =========================
       BONES
    ========================= */

    for(
        const line
        of connections
    ){

        const a =
            points[line[0]];

        const b =
            points[line[1]];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.strokeStyle=
            "rgba(255,255,255,.78)";

        ctx.lineWidth=
            1.35;

        ctx.shadowColor=
            "rgba(255,255,255,.35)";

        ctx.shadowBlur=
            4;

        ctx.stroke();

    }


    /* =========================
       JOINTS
    ========================= */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];


        const tip =
            i===4 ||
            i===8 ||
            i===12 ||
            i===16 ||
            i===20;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            tip ? 3.5 : 2,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
            "white";

        ctx.shadowColor=
            "white";

        ctx.shadowBlur=
            tip ? 7 : 3;

        ctx.fill();

    }


    /*
       Highlight:
       thumb / index / pinky
    */

    drawRing(
        points[4]
    );

    drawRing(
        points[8]
    );

    drawRing(
        points[20]
    );


    ctx.restore();

}


/* =====================================================
   RING
===================================================== */

function drawRing(p){

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.5)";

    ctx.lineWidth=
        1;

    ctx.shadowColor=
        "white";

    ctx.shadowBlur=
        5;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   BÀN TAY SIZE
===================================================== */

function handSize(hand){

    /*
       Khoảng cách cổ tay
       -> khớp giữa ngón giữa.

       Dùng làm kích thước
       chuẩn hóa cho từng tay.
    */

    return Math.max(
        distance(
            hand[0],
            hand[9]
        ),
        .0001
    );

}


/* =====================================================
   THUMB INDEX
===================================================== */

function thumbIndexRatio(
    hand
){

    const d =
        distance(
            hand[4],
            hand[8]
        );


    const size =
        handSize(hand);


    return d / size;

}


/* =====================================================
   CHẠM TRỎ + CÁI
===================================================== */

function isIndexThumbTouch(
    hand
){

    /*
       Không dùng ngưỡng
       0.075 cũ nữa.

       Chuẩn hóa theo kích thước
       bàn tay.

       0.65 = khá dễ kích hoạt.
    */

    const ratio =
        thumbIndexRatio(
            hand
        );


    return ratio < .65;

}


/* =====================================================
   CHẠM ÚT + CÁI
===================================================== */

function pinkyThumbRatio(
    hand
){

    const d =
        distance(
            hand[4],
            hand[20]
        );


    const size =
        handSize(hand);


    return d / size;

}


function isPinkyThumbTouch(
    hand
){

    return (
        pinkyThumbRatio(
            hand
        ) < .72
    );

}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen=false;


const windowPoints={

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


const targetWindow={

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   WINDOW SMOOTH
===================================================== */

function moveWindowPoint(
    current,
    target
){

    current.x +=
        (target.x-current.x)
        * .22;

    current.y +=
        (target.y-current.y)
        * .22;

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    targetWindow.tl =
        screenPoint(
            left[8]
        );

    targetWindow.tr =
        screenPoint(
            right[8]
        );

    targetWindow.br =
        screenPoint(
            right[4]
        );

    targetWindow.bl =
        screenPoint(
            left[4]
        );


    moveWindowPoint(
        windowPoints.tl,
        targetWindow.tl
    );

    moveWindowPoint(
        windowPoints.tr,
        targetWindow.tr
    );

    moveWindowPoint(
        windowPoints.br,
        targetWindow.br
    );

    moveWindowPoint(
        windowPoints.bl,
        targetWindow.bl
    );

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen)
        return;


    const p =
        windowPoints;


    ctx.save();


    /*
       SHADOW
    */

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.fillStyle=
        "rgba(255,255,255,.035)";

    ctx.fill();


    /*
       OUTER
    */

    ctx.shadowColor=
        "rgba(255,255,255,.9)";

    ctx.shadowBlur=
        15;

    ctx.strokeStyle=
        "rgba(255,255,255,.9)";

    ctx.lineWidth=
        2;

    ctx.stroke();


    /*
       INNER
    */

    ctx.shadowBlur=0;

    ctx.strokeStyle=
        "rgba(255,255,255,.35)";

    ctx.lineWidth=
        1;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   GESTURE HOLD
===================================================== */

let gestureStart=0;


/* =====================================================
   PROCESS
===================================================== */

function processHands(
    detected
){

    if(
        detected.length===0
    ){

        previousHands=[];

        debug.innerHTML=
            "2 HANDS: NO<br>"+
            "TRÁI: ---<br>"+
            "PHẢI: ---<br>"+
            "GESTURE: WAITING";

        hint.textContent=
            "ĐƯA HAI BÀN TAY VÀO";

        gesture.textContent=
            "WAITING";

        return;

    }


    /*
       Làm mượt.
    */

    const smooth=[];


    for(
        let i=0;
        i<Math.min(
            detected.length,
            2
        );
        i++
    ){

        smooth.push(
            smoothHand(
                previousHands[i],
                detected[i]
            )
        );

    }


    previousHands=
        smooth;


    /*
       Vẽ skeleton.
    */

    for(
        const hand
        of smooth
    ){

        drawSkeleton(
            hand
        );

    }


    /*
       Chưa đủ 2 tay.
    */

    if(
        smooth.length<2
    ){

        debug.innerHTML=
            "2 HANDS: NO<br>"+
            "TRÁI: ---<br>"+
            "PHẢI: ---<br>"+
            "GESTURE: 1 HAND";

        hint.textContent=
            "CẦN HAI BÀN TAY";

        gesture.textContent=
            "1 HAND";

        gestureStart=0;

        return;

    }


    /*
       Xác định trái/phải
       theo vị trí X trên màn hình.
    */

    const a={
        hand:smooth[0],
        x:screenPoint(
            smooth[0][9]
        ).x
    };


    const b={
        hand:smooth[1],
        x:screenPoint(
            smooth[1][9]
        ).x
    };


    let left;
    let right;


    if(a.x<b.x){

        left=a.hand;
        right=b.hand;

    }
    else{

        left=b.hand;
        right=a.hand;

    }


    /*
       Tính ratio.
    */

    const leftRatio =
        thumbIndexRatio(
            left
        );

    const rightRatio =
        thumbIndexRatio(
            right
        );


    const leftTouch =
        leftRatio < .65;

    const rightTouch =
        rightRatio < .65;


    /*
       DEBUG
    */

    debug.innerHTML=

        "2 HANDS: YES<br>"+

        "TRÁI: "+
        (
            leftTouch
            ? "OK"
            : leftRatio.toFixed(2)
        )
        +"<br>"+

        "PHẢI: "+
        (
            rightTouch
            ? "OK"
            : rightRatio.toFixed(2)
        )
        +"<br>"+

        "GESTURE: "+
        (
            windowOpen
            ? "WINDOW OPEN"
            : "WAITING"
        );


    /*
       ==========================
       MỞ CỬA SỔ
       ==========================
    */

    if(
        !windowOpen &&
        leftTouch &&
        rightTouch
    ){

        if(
            gestureStart===0
        ){

            gestureStart =
                performance.now();

        }


        const held =
            performance.now()
            -gestureStart;


        hint.textContent=
            "GIỮ NGÓN TRỎ + NGÓN CÁI...";


        gesture.textContent=
            Math.round(
                held/100
            )/10+
            "s";


        /*
           Giữ 0.2 giây.
        */

        if(
            held>=200
        ){

            windowOpen=true;


            targetWindow.tl =
                screenPoint(
                    left[8]
                );

            targetWindow.tr =
                screenPoint(
                    right[8]
                );

            targetWindow.br =
                screenPoint(
                    right[4]
                );

            targetWindow.bl =
                screenPoint(
                    left[4]
                );


            windowPoints.tl =
                {...targetWindow.tl};

            windowPoints.tr =
                {...targetWindow.tr};

            windowPoints.br =
                {...targetWindow.br};

            windowPoints.bl =
                {...targetWindow.bl};


            hint.textContent=
                "CỬA SỔ ĐÃ MỞ";

            gesture.textContent=
                "WINDOW ACTIVE";

            debug.innerHTML=
                "2 HANDS: YES<br>"+
                "TRÁI: OK<br>"+
                "PHẢI: OK<br>"+
                "GESTURE: WINDOW OPEN";

        }

    }
    else{

        if(
            !leftTouch ||
            !rightTouch
        ){

            gestureStart=0;

        }

    }


    /*
       ==========================
       WINDOW ACTIVE
       ==========================
    */

    if(windowOpen){

        updateWindow(
            left,
            right
        );

        hint.textContent=
            "DI CHUYỂN 4 NGÓN ĐỂ ĐIỀU KHIỂN";

        gesture.textContent=
            "WINDOW ACTIVE";

    }

}


/* =====================================================
   RESULTS
===================================================== */

function onResults(
    result
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        result.multiHandLandmarks || [];


    processHands(
        detected
    );


    drawWindow();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!running)
        return;


    const now =
        performance.now();


    if(
        hands &&
        video.readyState>=2 &&
        now-lastSend>=40
    ){

        lastSend=now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START
===================================================== */

async function startTracking(){

    hands=
        new Hands({

            locateFile:
            file =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
            +file

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.6,

        minTrackingConfidence:.6

    });


    hands.onResults(
        onResults
    );


    running=true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    text
){

    errorBox.style.display=
        "block";

    errorBox.textContent=
        text;

    startButton.disabled=
        false;

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled=true;

    status.textContent=
        "ĐANG XIN QUYỀN";


    if(
        !window.isSecureContext
    ){

        showError(
            "Hãy mở website bằng HTTPS hoặc GitHub Pages."
        );

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:640
                    },

                    height:{
                        ideal:480
                    },

                    frameRate:{
                        ideal:24,
                        max:30
                    }

                }

            });


        video.srcObject=
            stream;


        await video.play();


        start.classList.add(
            "hide"
        );


        status.textContent=
            "HAND TRACKING";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        status.textContent=
            "CAMERA ERROR";


        startButton.disabled=
            false;


        if(
            error.name===
            "NotAllowedError"
        ){

            showError(
                "Camera đang bị chặn. Hãy cấp quyền Camera."
            );

        }
        else if(
            error.name===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera."
            );

        }
        else{

            showError(
                "Không thể mở Camera."
            );

        }

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        running=false;


        if(
            video.srcObject
        ){

            video.srcObject
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        }

    }
);

</script>

</body>
</html>
