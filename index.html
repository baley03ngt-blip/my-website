<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* =====================================================
   CAMERA
===================================================== */

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.84)
        contrast(1.04)
        saturate(1.05);
}

/* =====================================================
   CANVAS
===================================================== */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}

/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#02040a;

    color:white;
    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:15px;
}

.startBox p{
    color:rgba(255,255,255,.6);
    font-size:14px;
    line-height:1.7;
}

#startButton{
    margin-top:25px;

    padding:16px 28px;

    border:0;
    border-radius:8px;

    background:white;
    color:#02040a;

    font-weight:800;
    font-size:11px;

    letter-spacing:.15em;

    cursor:pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

#startButton:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px rgba(255,255,255,.25);
}

#startButton:active{
    transform:scale(.96);
}

#error{
    margin-top:14px;

    color:#ff6578;

    font-size:12px;

    line-height:1.5;
}

/* =====================================================
   FILTER NAME
===================================================== */

#filterName{
    position:absolute;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.16);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity .3s;
}

/* =====================================================
   SECRET MENU OVERLAY
===================================================== */

#menuOverlay{
    position:absolute;

    inset:0;

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.48);

    backdrop-filter:
        blur(4px);

    -webkit-backdrop-filter:
        blur(4px);

    opacity:0;

    transition:opacity .35s ease;
}

#menuOverlay.show{
    display:flex;
    opacity:1;
}

/* =====================================================
   MENU WINDOW
===================================================== */

.menuWindow{
    width:min(88vw,500px);

    min-height:300px;

    padding:28px;

    border-radius:24px;

    background:
        rgba(8,10,18,.78);

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    transform:
        scale(.94)
        translateY(15px);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1);
}

#menuOverlay.show .menuWindow{
    transform:
        scale(1)
        translateY(0);
}

.menuTitle{
    text-align:center;

    color:white;

    font-size:22px;

    font-weight:700;

    letter-spacing:.04em;

    margin-bottom:8px;
}

.menuSubtitle{
    text-align:center;

    color:rgba(255,255,255,.45);

    font-size:11px;

    margin-bottom:28px;
}

/* =====================================================
   SOCIAL BUTTONS
===================================================== */

.socialGrid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.socialButton{
    position:relative;

    min-height:135px;

    border:1px solid
        rgba(255,255,255,.1);

    border-radius:18px;

    background:
        rgba(255,255,255,.045);

    color:white;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:12px;

    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;

    overflow:hidden;
}

.socialButton:hover,
.socialButton.active{
    transform:
        translateY(-4px)
        scale(1.03);

    background:
        rgba(255,255,255,.10);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);
}

.socialIcon{
    width:62px;
    height:62px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;

    font-size:30px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.1);
}

.facebook .socialIcon{
    font-family:Arial,sans-serif;
    font-size:38px;
}

.tiktok .socialIcon{
    font-size:31px;
}

.instagram .socialIcon{
    font-size:30px;
}

.socialName{
    font-size:11px;

    letter-spacing:.12em;

    color:
        rgba(255,255,255,.78);
}

/* =====================================================
   POINTER INDICATOR
===================================================== */

#pointerDot{
    position:absolute;

    z-index:90;

    width:24px;
    height:24px;

    margin-left:-12px;
    margin-top:-12px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.95);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 5px
        rgba(255,255,255,.08),
        0 0 25px
        rgba(255,255,255,.7);

    pointer-events:none;

    display:none;

    transition:
        transform .08s linear;
}

#pointerDot.selecting{
    transform:scale(1.45);

    background:
        rgba(255,255,255,.28);

    box-shadow:
        0 0 0 8px
        rgba(255,255,255,.1),
        0 0 35px
        rgba(255,255,255,.9);
}

/* =====================================================
   LOADING
===================================================== */

#gestureLoading{
    position:absolute;

    inset:0;

    z-index:75;

    display:none;

    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.loaderBox{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;
}

.loader{
    width:70px;
    height:70px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.12);

    border-top-color:
        rgba(255,255,255,.95);

    animation:
        spin .8s linear infinite;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.15);
}

.loaderText{
    color:white;

    font-size:10px;

    letter-spacing:.18em;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   HOME BUTTON
===================================================== */

#homeButton{
    display:block;

    margin:24px auto 0;

    padding:12px 25px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.8);

    font-size:10px;

    letter-spacing:.12em;

    cursor:pointer;

    transition:
        .2s ease;
}

#homeButton:hover{
    background:
        rgba(255,255,255,.12);

    transform:scale(1.04);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .menuWindow{
        width:92vw;

        padding:20px;

        border-radius:20px;
    }

    .socialGrid{
        gap:9px;
    }

    .socialButton{
        min-height:120px;
    }

    .socialIcon{
        width:52px;
        height:52px;

        font-size:26px;
    }

    .menuTitle{
        font-size:19px;
    }

    .menuSubtitle{
        margin-bottom:20px;
    }
}
</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <!-- FILTER -->
    <div id="filterName">
        RAINBOW
    </div>

    <!-- POINTER -->
    <div id="pointerDot"></div>

    <!-- LOADING -->
    <div id="gestureLoading">

        <div class="loaderBox">

            <div class="loader"></div>

            <div class="loaderText">
                ĐANG MỞ KHÔNG GIAN
            </div>

        </div>

    </div>

    <!-- MENU -->
    <div id="menuOverlay">

        <div class="menuWindow">

            <div class="menuTitle">
                HANDLIGHT
            </div>

            <div class="menuSubtitle">
                ĐƯA NGÓN TRỎ ĐẾN MỘT ỨNG DỤNG
            </div>

            <div class="socialGrid">

                <button
                    class="socialButton facebook"
                    data-url="https://www.facebook.com">

                    <div class="socialIcon">
                        f
                    </div>

                    <div class="socialName">
                        FACEBOOK
                    </div>

                </button>

                <button
                    class="socialButton tiktok"
                    data-url="https://www.tiktok.com">

                    <div class="socialIcon">
                        ♪
                    </div>

                    <div class="socialName">
                        TIKTOK
                    </div>

                </button>

                <button
                    class="socialButton instagram"
                    data-url="https://www.instagram.com">

                    <div class="socialIcon">
                        ◎
                    </div>

                    <div class="socialName">
                        INSTAGRAM
                    </div>

                </button>

            </div>

            <button id="homeButton">
                HOME
            </button>

        </div>

    </div>

    <!-- START -->
    <div id="startScreen">

        <div class="startBox">

            <h1>
                HANDLIGHT
            </h1>

            <p>
                Đưa hai bàn tay vào camera.<br><br>

                Chạm ngón trỏ + ngón cái
                ở cả hai tay để tạo khung.<br><br>

                Út + cái ở cả hai tay
                để đổi màu.<br><br>

                Chỉ ngón trỏ lên trên
                để mở menu.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
"use strict";

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const filterName =
    document.getElementById("filterName");

const menuOverlay =
    document.getElementById("menuOverlay");

const gestureLoading =
    document.getElementById("gestureLoading");

const pointerDot =
    document.getElementById("pointerDot");

const homeButton =
    document.getElementById("homeButton");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(W * DPR);

    canvas.height =
        Math.round(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   BONES
===================================================== */

const BONES = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   FILTERS
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",
        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",
        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",
        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",
        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",
        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",
        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",
        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;

let lastFilterChange = 0;

const COLOR_COOLDOWN = 800;

let colorGestureHeld = false;


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;

const windowPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const targetPoints = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   SCREEN POINT
===================================================== */

function screenPoint(p){

    return {

        x:(1-p.x)*W,

        y:p.y*H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    return Math.max(
        distance(hand[0],hand[9]),
        0.0001
    );

}


/* =====================================================
   INDEX + THUMB
===================================================== */

function indexThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[8]
        )
        /
        getHandSize(hand)
    );

}

function indexThumbTouch(hand){

    return (
        indexThumbRatio(hand)
        < .82
    );

}


/* =====================================================
   PINKY + THUMB
===================================================== */

function pinkyThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[20]
        )
        /
        getHandSize(hand)
    );

}

function pinkyThumbTouch(hand){

    return (
        pinkyThumbRatio(hand)
        < 1.05
    );

}


/* =====================================================
   NEW GESTURE
   INDEX UP
===================================================== */

/*
    Kiểm tra ngón trỏ có hướng lên hay không.

    8 = đầu ngón trỏ
    6 = khớp giữa
    5 = gốc ngón trỏ
*/

function indexPointingUp(hand){

    const tip = hand[8];
    const pip = hand[6];
    const mcp = hand[5];

    const fingerVector = {

        x:tip.x-mcp.x,

        y:tip.y-mcp.y

    };

    const length =
        Math.hypot(
            fingerVector.x,
            fingerVector.y
        );

    if(length < .01)
        return false;

    const vertical =
        -fingerVector.y / length;

    const horizontal =
        Math.abs(
            fingerVector.x
        ) / length;

    /*
        Phải hướng lên tương đối thẳng.
    */

    const pointingUp =
        vertical > .78 &&
        horizontal < .62;

    /*
        Các ngón còn lại phải gập.
    */

    const middleFolded =
        distance(hand[12],hand[9])
        <
        getHandSize(hand)*.72;

    const ringFolded =
        distance(hand[16],hand[13])
        <
        getHandSize(hand)*.72;

    const pinkyFolded =
        distance(hand[20],hand[17])
        <
        getHandSize(hand)*.75;

    return (
        pointingUp &&
        middleFolded &&
        ringFolded &&
        pinkyFolded
    );

}


/* =====================================================
   SMOOTHING
===================================================== */

/*
    Adaptive smoothing:

    Tay chạy nhanh
    → bám nhanh hơn.

    Tay đứng yên
    → lọc rung mạnh hơn.
*/

function adaptiveSmooth(
    current,
    target,
    previousVelocity
){

    const dx =
        target.x-current.x;

    const dy =
        target.y-current.y;

    const speed =
        Math.hypot(dx,dy);

    let amount;

    if(speed > 70){

        amount = .72;

    }
    else if(speed > 30){

        amount = .56;

    }
    else if(speed > 10){

        amount = .42;

    }
    else{

        amount = .27;

    }

    current.x +=
        dx*amount;

    current.y +=
        dy*amount;

    return current;
}


/* =====================================================
   SET WINDOW TARGET
===================================================== */

function setWindowTargets(
    left,
    right
){

    targetPoints.tl =
        screenPoint(left[8]);

    targetPoints.tr =
        screenPoint(right[8]);

    targetPoints.br =
        screenPoint(right[4]);

    targetPoints.bl =
        screenPoint(left[4]);

}


/* =====================================================
   CREATE WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );

    windowPoints.tl =
        {...targetPoints.tl};

    windowPoints.tr =
        {...targetPoints.tr};

    windowPoints.br =
        {...targetPoints.br};

    windowPoints.bl =
        {...targetPoints.bl};

    windowOpen = true;

    filterName.textContent =
        FILTERS[filterIndex].name;

    filterName.style.opacity =
        "1";

}


/* =====================================================
   UPDATE WINDOW
===================================================== */

function updateWindow(
    left,
    right
){

    setWindowTargets(
        left,
        right
    );

    adaptiveSmooth(
        windowPoints.tl,
        targetPoints.tl
    );

    adaptiveSmooth(
        windowPoints.tr,
        targetPoints.tr
    );

    adaptiveSmooth(
        windowPoints.br,
        targetPoints.br
    );

    adaptiveSmooth(
        windowPoints.bl,
        targetPoints.bl
    );

}


/* =====================================================
   GRADIENT
===================================================== */

function rainbowGradient(){

    const p =
        windowPoints;

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;

    const gradient =
        ctx.createRadialGradient(
            cx-W*.20,
            cy-H*.20,
            0,
            cx,
            cy,
            Math.max(W,H)*.75
        );

    const colors =
        FILTERS[filterIndex].colors;

    colors.forEach(
        (color,i)=>{

            gradient.addColorStop(
                i/(colors.length-1),
                color
            );

        }
    );

    return gradient;

}


/* =====================================================
   MOVING GRADIENT
===================================================== */

function movingGradient(){

    const p =
        windowPoints;

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;

    const t =
        performance.now()*.00035;

    const mx =
        Math.cos(t)*W*.35;

    const my =
        Math.sin(t*1.25)*H*.35;

    const g =
        ctx.createLinearGradient(
            cx-W*.70+mx,
            cy-H*.70+my,
            cx+W*.70-mx,
            cy+H*.70-my
        );

    const colors =
        FILTERS[filterIndex].colors;

    colors.forEach(
        (color,i)=>{

            g.addColorStop(
                i/(colors.length-1),
                color
            );

        }
    );

    return g;

}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen)
        return;

    const p =
        windowPoints;

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .25;

    ctx.fillStyle =
        rainbowGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.globalAlpha =
        .20;

    ctx.fillStyle =
        movingGradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;

    const glass =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            Math.max(W,H)*.65
        );

    glass.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    glass.addColorStop(
        .45,
        "rgba(255,255,255,.035)"
    );

    glass.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.globalAlpha = 1;

    ctx.fillStyle =
        glass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.restore();


    /* BORDER */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.strokeStyle =
        rainbowGradient();

    ctx.lineWidth = 6;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur = 20;

    ctx.stroke();

    ctx.shadowBlur = 7;

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 1.4;

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   CHANGE FILTER
===================================================== */

function nextFilter(){

    const now =
        performance.now();

    if(
        now-lastFilterChange
        <
        COLOR_COOLDOWN
    )
        return;

    lastFilterChange =
        now;

    filterIndex++;

    if(
        filterIndex>=FILTERS.length
    ){

        filterIndex=0;

    }

    filterName.textContent =
        FILTERS[filterIndex].name;

    filterName.style.opacity =
        "1";

    clearTimeout(
        nextFilter.timer
    );

    nextFilter.timer =
        setTimeout(
            ()=>{
                filterName.style.opacity =
                    "0";
            },
            1200
        );

}


/* =====================================================
   HAND STABILITY
===================================================== */

let stableLeft = null;
let stableRight = null;

function chooseHands(
    detected,
    handedness
){

    if(detected.length < 2)
        return null;

    let left = null;
    let right = null;

    /*
        Ưu tiên handedness của MediaPipe.
    */

    if(
        handedness &&
        handedness.length >= 2
    ){

        for(
            let i=0;
            i<handedness.length;
            i++
        ){

            const label =
                handedness[i][0].label;

            if(label === "Left")
                left = detected[i];

            if(label === "Right")
                right = detected[i];

        }

    }

    /*
        Nếu MediaPipe chưa xác định
        thì dùng vị trí làm fallback.
    */

    if(!left || !right){

        const a =
            screenPoint(
                detected[0][9]
            ).x;

        const b =
            screenPoint(
                detected[1][9]
            ).x;

        if(a < b){

            left = detected[0];
            right = detected[1];

        }
        else{

            left = detected[1];
            right = detected[0];

        }

    }

    /*
        Chống đổi tay đột ngột.

        Nếu kết quả mới nhảy quá xa
        thì giữ assignment cũ.
    */

    if(
        stableLeft &&
        stableRight
    ){

        const newLeft =
            screenPoint(
                left[9]
            );

        const oldLeft =
            screenPoint(
                stableLeft[9]
            );

        const newRight =
            screenPoint(
                right[9]
            );

        const oldRight =
            screenPoint(
                stableRight[9]
            );

        const leftMove =
            distance(
                newLeft,
                oldLeft
            );

        const rightMove =
            distance(
                newRight,
                oldRight
            );

        if(
            leftMove > W*.45 ||
            rightMove > W*.45
        ){

            return {
                left:stableLeft,
                right:stableRight
            };

        }

    }

    stableLeft = left;
    stableRight = right;

    return {
        left,
        right
    };

}


/* =====================================================
   MENU STATE
===================================================== */

let menuOpen = false;

let loading = false;

let loadingTimer = null;

let lastPoint =
    {
        x:0,
        y:0
    };

let menuButtonHover =
    null;

let hoverStart =
    0;

let lastClickTime =
    0;


/* =====================================================
   OPEN MENU
===================================================== */

function startMenuLoading(){

    if(
        menuOpen ||
        loading
    )
        return;

    loading = true;

    gestureLoading.style.display =
        "flex";

    clearTimeout(
        loadingTimer
    );

    loadingTimer =
        setTimeout(
            ()=>{

                loading = false;

                gestureLoading.style.display =
                    "none";

                openMenu();

            },
            1300
        );

}


/* =====================================================
   OPEN MENU
===================================================== */

function openMenu(){

    menuOpen = true;

    menuOverlay.style.display =
        "flex";

    requestAnimationFrame(
        ()=>{

            menuOverlay.classList.add(
                "show"
            );

        }
    );

    pointerDot.style.display =
        "block";

}


/* =====================================================
   CLOSE MENU
===================================================== */

function closeMenu(){

    menuOpen = false;

    menuButtonHover =
        null;

    hoverStart = 0;

    menuOverlay.classList.remove(
        "show"
    );

    pointerDot.style.display =
        "none";

    setTimeout(
        ()=>{

            if(!menuOpen){

                menuOverlay.style.display =
                    "none";

            }

        },
        350
    );

}


/* =====================================================
   CHECK MENU BUTTON
===================================================== */

function checkMenuButton(
    x,
    y
){

    if(!menuOpen)
        return;

    const buttons =
        document.querySelectorAll(
            ".socialButton"
        );

    let current = null;

    buttons.forEach(
        button=>{

            const rect =
                button.getBoundingClientRect();

            const inside =
                x >= rect.left &&
                x <= rect.right &&
                y >= rect.top &&
                y <= rect.bottom;

            if(inside){

                current = button;

            }

        }
    );

    if(current !== menuButtonHover){

        menuButtonHover =
            current;

        hoverStart =
            performance.now();

        buttons.forEach(
            b=>{
                b.classList.remove(
                    "active"
                );
            }
        );

        if(current){

            current.classList.add(
                "active"
            );

        }

    }

    if(current){

        const elapsed =
            performance.now() -
            hoverStart;

        /*
            Chỉ cần ngón trỏ
            đứng/di chuyển nhẹ
            khoảng 350ms.
        */

        if(
            elapsed > 350 &&
            performance.now()-lastClickTime > 1000
        ){

            lastClickTime =
                performance.now();

            const url =
                current.dataset.url;

            window.open(
                url,
                "_blank"
            );

            menuButtonHover =
                null;

            hoverStart =
                0;

        }

    }

}


/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected,
    handedness
){

    /*
        Không có tay
    */

    if(
        detected.length === 0
    ){

        return;

    }


    /*
        NEW MENU GESTURE

        Nếu có ít nhất một tay
        chỉ ngón trỏ lên.
    */

    let pointingHand =
        null;

    for(
        const hand of detected
    ){

        if(
            indexPointingUp(hand)
        ){

            pointingHand =
                hand;

            break;

        }

    }


    /*
        Nếu đang menu,
        dùng ngón trỏ để điều khiển.
    */

    if(
        menuOpen &&
        pointingHand
    ){

        const p =
            screenPoint(
                pointingHand[8]
            );

        lastPoint.x = p.x;
        lastPoint.y = p.y;

        pointerDot.style.left =
            p.x + "px";

        pointerDot.style.top =
            p.y + "px";

        checkMenuButton(
            p.x,
            p.y
        );

    }


    /*
        Chỉ mở menu khi chưa mở.
    */

    if(
        !menuOpen &&
        !loading &&
        pointingHand
    ){

        startMenuLoading();

    }


    /*
        Window cũ
    */

    if(
        detected.length < 2
    )
        return;


    const hands =
        chooseHands(
            detected,
            handedness
        );

    if(!hands)
        return;

    const left =
        hands.left;

    const right =
        hands.right;


    /*
        Index + thumb
    */

    const leftIndex =
        indexThumbTouch(left);

    const rightIndex =
        indexThumbTouch(right);


    /*
        Pinky + thumb
    */

    const leftPinky =
        pinkyThumbTouch(left);

    const rightPinky =
        pinkyThumbTouch(right);


    /*
        OPEN WINDOW
    */

    if(!windowOpen){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );

        }

        return;

    }


    /*
        UPDATE WINDOW
    */

    updateWindow(
        left,
        right
    );


    /*
        COLOR
    */

    const bothPinky =
        leftPinky &&
        rightPinky;

    if(bothPinky){

        if(!colorGestureHeld){

            nextFilter();

            colorGestureHeld = true;

        }

    }
    else{

        colorGestureHeld = false;

    }

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(
    results
){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const detected =
        results.multiHandLandmarks
        || [];

    const handedness =
        results.multiHandedness
        || [];

    processHands(
        detected,
        handedness
    );

    drawWindow();

}


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;

async function startTracking(){

    if(!window.Hands){

        throw new Error(
            "Không tải được MediaPipe Hands."
        );

    }


    hands =
        new Hands({

            locateFile:
                function(file){

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                        +
                        file
                    );

                }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.60,

        minTrackingConfidence:.65

    });


    hands.onResults(
        onResults
    );


    tracking = true;

    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking)
        return;

    const now =
        performance.now();

    /*
        Khoảng 30 FPS.
    */

    if(
        now-lastSend >= 30 &&
        video.readyState >= 2
    ){

        lastSend =
            now;

        try{

            await hands.send({
                image:video
            });

        }
        catch(error){

            console.error(
                "MediaPipe:",
                error
            );

        }

    }

    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;

    errorBox.textContent =
        "";

    if(!window.isSecureContext){

        errorBox.textContent =
            "Hãy mở website bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ Camera."
            );

        }


        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:"user"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        resize();


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );

        errorBox.textContent =
            "Không mở được camera: "
            +
            (
                error.message ||
                "Unknown error"
            );

        startButton.disabled =
            false;

    }

}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   HOME
===================================================== */

homeButton.addEventListener(
    "click",
    function(){

        closeMenu();

    }
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        tracking = false;

        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );

        }

    }
);

</script>
