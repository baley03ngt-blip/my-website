<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<title>HANDLIGHT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#02040a;
}

/* ================= CAMERA ================= */

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    transform:scaleX(-1);

    z-index:1;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(1.08);
}

/* ================= HAND CANVAS ================= */

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}

/* ================= SPIDER MASK ================= */

#maskCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:15;

    pointer-events:none;
}

/* ================= START ================= */

#startScreen{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#02040a;
    color:white;

    text-align:center;
}

.startBox{
    width:min(88vw,420px);
}

.startBox h1{
    font-size:42px;
    letter-spacing:-.05em;
    margin-bottom:15px;
}

.startBox p{
    color:rgba(255,255,255,.65);
    font-size:14px;
    line-height:1.7;
}

#startButton{
    margin-top:25px;

    padding:16px 30px;

    border:none;
    border-radius:10px;

    background:white;
    color:#02040a;

    font-weight:800;
    font-size:11px;
    letter-spacing:.15em;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.95);
}

#error{
    margin-top:15px;
    color:#ff6578;
    font-size:12px;
}

/* ================= FILTER NAME ================= */

#filterName{
    position:absolute;

    left:50%;
    bottom:55px;

    transform:translateX(-50%);

    z-index:30;

    padding:8px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.5);

    border:1px solid rgba(255,255,255,.2);

    color:white;

    font:
        10px
        Consolas,
        monospace;

    letter-spacing:.15em;

    opacity:0;

    transition:opacity:.2s;

    pointer-events:none;
}

/* ================= INSTRUCTION ================= */

#instruction{
    position:absolute;

    left:0;
    right:0;
    bottom:18px;

    z-index:30;

    text-align:center;

    color:white;

    font-size:12px;

    text-shadow:
        0 2px 12px #000;

    pointer-events:none;
}

/* ================= SOCIAL MENU ================= */

#socialMenu{
    position:absolute;
    inset:0;

    z-index:80;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

#socialPanel{
    width:min(88vw,430px);

    padding:25px;

    border-radius:24px;

    background:
        rgba(10,12,20,.88);

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);

    text-align:center;

    color:white;
}

#socialTitle{
    font-size:24px;
    font-weight:800;
}

#socialSub{
    margin-top:7px;
    margin-bottom:22px;

    color:rgba(255,255,255,.5);

    font-size:12px;
}

.socialButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.socialButton{
    height:90px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.07);

    color:white;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.socialButton:active{
    transform:scale(.94);
}

.homeButton{
    width:100%;
    margin-top:15px;

    padding:13px;

    border:none;
    border-radius:12px;

    background:white;
    color:#02040a;

    font-weight:bold;
}

/* ================= SOCIAL PAGE ================= */

#socialPage{
    position:absolute;
    inset:0;

    z-index:90;

    display:none;

    background:
        rgba(0,0,0,.78);

    align-items:center;
    justify-content:center;

    color:white;
}

#socialPageBox{
    width:min(88vw,430px);

    text-align:center;
}

#socialPageTitle{
    font-size:30px;
    font-weight:900;

    margin-bottom:15px;
}

#socialBack{
    padding:13px 25px;

    border:none;
    border-radius:12px;

    background:white;
    color:#000;

    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .startBox h1{
        font-size:36px;
    }

    #socialPanel{
        width:90vw;
    }

    .socialButton{
        height:80px;
    }
}
</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <canvas id="maskCanvas"></canvas>

    <!-- START -->

    <div id="startScreen">

        <div class="startBox">

            <h1>HANDLIGHT</h1>

            <p>
                Đưa hai bàn tay vào camera.<br><br>

                Chạm ngón trỏ + ngón cái
                ở cả hai tay để mở khung.<br><br>

                Út + cái ở hai tay
                để đổi màu.<br><br>

                Chớp mắt 3 lần liên tục
                để bật mặt nạ.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <div id="error"></div>

        </div>

    </div>

    <div id="filterName">
        RAINBOW
    </div>

    <div id="instruction">
        ĐƯA HAI BÀN TAY VÀO CAMERA
    </div>

    <!-- SOCIAL -->

    <div id="socialMenu">

        <div id="socialPanel">

            <div id="socialTitle">
                HANDLIGHT
            </div>

            <div id="socialSub">
                ĐƯA NGÓN TRỎ TỚI NÚT ĐỂ CHỌN
            </div>

            <div class="socialButtons">

                <button
                    class="socialButton"
                    data-page="Facebook">
                    FACEBOOK
                </button>

                <button
                    class="socialButton"
                    data-page="TikTok">
                    TIKTOK
                </button>

                <button
                    class="socialButton"
                    data-page="Instagram">
                    INSTAGRAM
                </button>

            </div>

            <button
                class="homeButton"
                id="homeButton">
                HOME
            </button>

        </div>

    </div>

    <!-- SOCIAL PAGE -->

    <div id="socialPage">

        <div id="socialPageBox">

            <div id="socialPageTitle">
                HANDLIGHT
            </div>

            <p id="socialPageText">
                TRANG ĐANG ĐƯỢC CHỌN
            </p>

            <br>

            <button id="socialBack">
                ← QUAY LẠI HOME
            </button>

        </div>

    </div>

</div>


<!-- ================= MEDIAPIPE HANDS ================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<!-- ================= MEDIAPIPE FACE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>
"use strict";

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const maskCanvas =
    document.getElementById("maskCanvas");

const maskCtx =
    maskCanvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const filterName =
    document.getElementById("filterName");

const instruction =
    document.getElementById("instruction");

const socialMenu =
    document.getElementById("socialMenu");

const socialPage =
    document.getElementById("socialPage");

const socialPageText =
    document.getElementById("socialPageText");

const socialBack =
    document.getElementById("socialBack");

const homeButton =
    document.getElementById("homeButton");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    for(
        const c of [canvas,maskCanvas]
    ){

        c.width =
            Math.round(W * DPR);

        c.height =
            Math.round(H * DPR);

        c.style.width =
            W + "px";

        c.style.height =
            H + "px";

    }

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );

    maskCtx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   FILTERS
===================================================== */

const FILTERS = [

    {
        name:"RAINBOW",
        colors:[
            "#ff006e",
            "#ff4d00",
            "#ffe600",
            "#00ff88",
            "#00eaff",
            "#3867ff",
            "#b000ff"
        ]
    },

    {
        name:"AURORA",
        colors:[
            "#00fff0",
            "#00ff9d",
            "#70ff00",
            "#00aaff",
            "#7b00ff",
            "#ff00d4"
        ]
    },

    {
        name:"NEON DREAM",
        colors:[
            "#ff0080",
            "#ff00ff",
            "#8a00ff",
            "#0055ff",
            "#00eaff"
        ]
    },

    {
        name:"COSMIC",
        colors:[
            "#1600ff",
            "#5c00ff",
            "#b900ff",
            "#ff00aa",
            "#ff0055",
            "#00cfff"
        ]
    },

    {
        name:"SUNSET",
        colors:[
            "#ff003c",
            "#ff4800",
            "#ff9700",
            "#ffe000",
            "#ff00a8",
            "#7200ff"
        ]
    },

    {
        name:"OCEAN",
        colors:[
            "#001eff",
            "#006eff",
            "#00c8ff",
            "#00fff0",
            "#00ff9d",
            "#64ff00"
        ]
    },

    {
        name:"CRYSTAL",
        colors:[
            "#ffffff",
            "#9fffff",
            "#789dff",
            "#c78cff",
            "#ff9edb",
            "#ffffff"
        ]
    }

];

let filterIndex = 0;


/* =====================================================
   BASIC MATH
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function screenPoint(p){

    return {
        x:(1-p.x)*W,
        y:p.y*H
    };
}


function handSize(hand){

    return Math.max(
        distance(
            hand[0],
            hand[9]
        ),
        .0001
    );
}


/* =====================================================
   GESTURES
===================================================== */

function indexThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[8]
        )
        /
        handSize(hand)
    );
}


function pinkyThumbRatio(hand){

    return (
        distance(
            hand[4],
            hand[20]
        )
        /
        handSize(hand)
    );
}


function indexThumbTouch(hand){

    return (
        indexThumbRatio(hand) < .82
    );
}


function pinkyThumbTouch(hand){

    return (
        pinkyThumbRatio(hand) < 1.05
    );
}


/* =====================================================
   POINTING UP
===================================================== */

function pointingUp(hand){

    const wrist =
        hand[0];

    const index =
        hand[8];

    const middle =
        hand[12];

    const ring =
        hand[16];

    const pinky =
        hand[20];

    const indexUp =
        index.y <
        wrist.y - .12;

    const otherCurled =
        middle.y >
        wrist.y - .05 &&
        ring.y >
        wrist.y - .05 &&
        pinky.y >
        wrist.y - .05;

    return (
        indexUp &&
        otherCurled
    );
}


/* =====================================================
   WINDOW
===================================================== */

let windowOpen = false;

const target = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const current = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};


/* =====================================================
   STABLE HAND ASSIGNMENT

   Không cho tay trái/phải
   tự đảo khi di chuyển nhanh.
===================================================== */

let lockedLeft = null;
let lockedRight = null;

function assignHands(hands){

    if(hands.length < 2){

        return null;
    }

    const a = hands[0];
    const b = hands[1];

    const ax =
        screenPoint(a[9]).x;

    const bx =
        screenPoint(b[9]).x;

    if(
        lockedLeft === null
    ){

        if(ax < bx){

            lockedLeft = a;
            lockedRight = b;

        }else{

            lockedLeft = b;
            lockedRight = a;

        }

        return {
            left:lockedLeft,
            right:lockedRight
        };
    }

    /*
       Tìm hand gần vị trí cũ nhất.
       Không dựa đơn giản vào x.
    */

    const oldLX =
        screenPoint(
            lockedLeft[9]
        ).x;

    const oldRX =
        screenPoint(
            lockedRight[9]
        ).x;

    const costA =
        Math.abs(
            ax-oldLX
        ) +
        Math.abs(
            bx-oldRX
        );

    const costB =
        Math.abs(
            ax-oldRX
        ) +
        Math.abs(
            bx-oldLX
        );

    if(costA <= costB){

        lockedLeft = a;
        lockedRight = b;

    }else{

        lockedLeft = b;
        lockedRight = a;

    }

    return {
        left:lockedLeft,
        right:lockedRight
    };
}


/* =====================================================
   SET TARGET
===================================================== */

function setWindowTarget(
    left,
    right
){

    target.tl =
        screenPoint(
            left[8]
        );

    target.tr =
        screenPoint(
            right[8]
        );

    target.br =
        screenPoint(
            right[4]
        );

    target.bl =
        screenPoint(
            left[4]
        );
}


/* =====================================================
   OPEN WINDOW
===================================================== */

function createWindow(
    left,
    right
){

    setWindowTarget(
        left,
        right
    );

    current.tl =
        {...target.tl};

    current.tr =
        {...target.tr};

    current.br =
        {...target.br};

    current.bl =
        {...target.bl};

    windowOpen = true;

    instruction.textContent =
        "ÚT + CÁI 2 TAY = ĐỔI MÀU";
}


/* =====================================================
   ULTRA SMOOTH TRACKING
===================================================== */

/*
   Không dùng smoothing cố định quá cao.

   Khi tay chạy nhanh:
   -> smoothing tăng
   -> khung bắt kịp nhanh.

   Khi tay đứng:
   -> smoothing giảm
   -> khung cực mượt.
*/

function smoothPoint(
    p,
    t
){

    const dx =
        t.x-p.x;

    const dy =
        t.y-p.y;

    const speed =
        Math.hypot(dx,dy);

    let factor;

    if(speed > 100){

        factor = .82;

    }
    else if(speed > 50){

        factor = .68;

    }
    else if(speed > 20){

        factor = .52;

    }
    else{

        factor = .32;

    }

    p.x += dx * factor;
    p.y += dy * factor;
}


function updateWindow(
    left,
    right
){

    setWindowTarget(
        left,
        right
    );

    smoothPoint(
        current.tl,
        target.tl
    );

    smoothPoint(
        current.tr,
        target.tr
    );

    smoothPoint(
        current.br,
        target.br
    );

    smoothPoint(
        current.bl,
        target.bl
    );
}


/* =====================================================
   GRADIENT
===================================================== */

function gradient(){

    const colors =
        FILTERS[
            filterIndex
        ].colors;

    const cx =
        (
            current.tl.x+
            current.tr.x+
            current.br.x+
            current.bl.x
        )/4;

    const cy =
        (
            current.tl.y+
            current.tr.y+
            current.br.y+
            current.bl.y
        )/4;

    const g =
        ctx.createLinearGradient(
            cx-W*.7,
            cy-H*.7,
            cx+W*.7,
            cy+H*.7
        );

    for(
        let i=0;
        i<colors.length;
        i++
    ){

        g.addColorStop(
            i/(colors.length-1),
            colors[i]
        );

    }

    return g;
}


/* =====================================================
   DRAW WINDOW
===================================================== */

function drawWindow(){

    if(!windowOpen){
        return;
    }

    const p = current;

    /*
       SHAPE
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();

    /*
       GLASS
    */

    ctx.globalCompositeOperation =
        "screen";

    ctx.globalAlpha =
        .24;

    ctx.fillStyle =
        gradient();

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       LIGHT
    */

    const cx =
        (
            p.tl.x+
            p.tr.x+
            p.br.x+
            p.bl.x
        )/4;

    const cy =
        (
            p.tl.y+
            p.tr.y+
            p.br.y+
            p.bl.y
        )/4;

    const light =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            Math.max(W,H)*.7
        );

    light.addColorStop(
        0,
        "rgba(255,255,255,.12)"
    );

    light.addColorStop(
        .5,
        "rgba(255,255,255,.035)"
    );

    light.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.globalAlpha = 1;

    ctx.fillStyle = light;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.restore();


    /*
       BORDER
    */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.strokeStyle =
        gradient();

    ctx.lineWidth =
        5;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        "#00eaff";

    ctx.shadowBlur =
        18;

    ctx.stroke();

    ctx.shadowBlur =
        5;

    ctx.strokeStyle =
        "rgba(255,255,255,.8)";

    ctx.lineWidth =
        1.3;

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   CHANGE COLOR
===================================================== */

let colorHeld = false;
let lastColorChange = 0;

function nextFilter(){

    const now =
        performance.now();

    if(
        now-lastColorChange < 700
    ){
        return;
    }

    lastColorChange = now;

    filterIndex++;

    if(
        filterIndex >= FILTERS.length
    ){

        filterIndex = 0;
    }

    filterName.textContent =
        FILTERS[
            filterIndex
        ].name;

    filterName.style.opacity =
        "1";

    clearTimeout(
        nextFilter.timer
    );

    nextFilter.timer =
        setTimeout(
            ()=>{
                filterName.style.opacity =
                    "0";
            },
            1000
        );
}


/* =====================================================
   SOCIAL MENU
===================================================== */

let socialOpen = false;

function openSocial(){

    socialOpen = true;

    socialMenu.style.display =
        "flex";

    instruction.textContent =
        "ĐƯA NGÓN TRỎ TỚI NÚT ĐỂ CHỌN";
}


function closeSocial(){

    socialOpen = false;

    socialMenu.style.display =
        "none";

    socialPage.style.display =
        "none";

    instruction.textContent =
        "HANDLIGHT";
}


/* =====================================================
   POINTER CONTROL
===================================================== */

let pointerX = 0;
let pointerY = 0;

let pointerInside =
    false;

let lastPointerAction = 0;


function updatePointer(hand){

    if(!hand){
        pointerInside = false;
        return;
    }

    const p =
        screenPoint(
            hand[8]
        );

    pointerX = p.x;
    pointerY = p.y;

    pointerInside = true;

    if(!socialOpen){
        return;
    }

    const buttons =
        document.querySelectorAll(
            ".socialButton"
        );

    buttons.forEach(
        button=>{

            const r =
                button.getBoundingClientRect();

            const inside =
                pointerX >= r.left &&
                pointerX <= r.right &&
                pointerY >= r.top &&
                pointerY <= r.bottom;

            if(
                inside &&
                performance.now()-
                lastPointerAction >
                600
            ){

                lastPointerAction =
                    performance.now();

                openSocialPage(
                    button.dataset.page
                );

            }

        }
    );

    const hr =
        homeButton.getBoundingClientRect();

    if(
        pointerX >= hr.left &&
        pointerX <= hr.right &&
        pointerY >= hr.top &&
        pointerY <= hr.bottom
    ){

        if(
            performance.now()-
            lastPointerAction >
            600
        ){

            lastPointerAction =
                performance.now();

            closeSocial();
        }
    }
}


function openSocialPage(name){

    socialMenu.style.display =
        "none";

    socialPage.style.display =
        "flex";

    socialPageText.textContent =
        "BẠN ĐÃ CHỌN " +
        name.toUpperCase();
}

/* =====================================================
   PROCESS HANDS
===================================================== */

function processHands(
    detected
){

    if(
        detected.length === 0
    ){

        lockedLeft = null;
        lockedRight = null;

        return;
    }

    if(
        detected.length === 1
    ){

        updatePointer(
            detected[0]
        );

        return;
    }

    const pair =
        assignHands(
            detected
        );

    if(!pair){
        return;
    }

    const left =
        pair.left;

    const right =
        pair.right;


    /*
       SOCIAL GESTURE

       Hai ngón trỏ cùng chỉ lên.
    */

    const leftUp =
        pointingUp(left);

    const rightUp =
        pointingUp(right);

    if(
        leftUp &&
        rightUp &&
        !socialOpen
    ){

        openSocial();
    }


    /*
       INDEX + THUMB
       mở cửa sổ
    */

    const leftIndex =
        indexThumbTouch(left);

    const rightIndex =
        indexThumbTouch(right);


    /*
       MỞ KHUNG
    */

    if(
        !windowOpen
    ){

        if(
            leftIndex &&
            rightIndex
        ){

            createWindow(
                left,
                right
            );

        }

        return;
    }


    /*
       CẬP NHẬT KHUNG
    */

    updateWindow(
        left,
        right
    );


    /*
       POINTER SOCIAL
    */

    if(socialOpen){

        updatePointer(
            left
        );

    }


    /*
       ĐỔI MÀU
    */

    const bothPinky =
        pinkyThumbTouch(left) &&
        pinkyThumbTouch(right);

    if(
        bothPinky
    ){

        if(!colorHeld){

            nextFilter();

            colorHeld = true;
        }

    }
    else{

        colorHeld = false;
    }
}


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

let hands = null;

async function startHands(){

    hands =
        new Hands({

            locateFile:file=>
                "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:.55,

        minTrackingConfidence:.60

    });


    hands.onResults(
        onHandsResults
    );
}


/* =====================================================
   HAND RESULTS
===================================================== */

function onHandsResults(
    results
){

    /*
       Canvas chỉ vẽ khung.
       Không vẽ skeleton.
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const detected =
        results.multiHandLandmarks || [];

    processHands(
        detected
    );

    drawWindow();
}


/* =====================================================
   FACE MESH
===================================================== */

let faceMesh = null;

let faceLandmarks = null;

let maskVisible = false;

let blinkClosed = false;

let blinkTimes = [];

let lastBlink = 0;

const BLINK_GAP = 220;

const BLINK_WINDOW = 1800;


/* =====================================================
   FACE START
===================================================== */

async function startFace(){

    faceMesh =
        new FaceMesh({

            locateFile:file=>
                "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+file

        });


    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:.5,

        minTrackingConfidence:.5

    });


    faceMesh.onResults(
        processFace
    );
}


/* =====================================================
   EYE LANDMARKS
===================================================== */

function eyeRatio(
    upper,
    lower,
    left,
    right
){

    const vertical =
        distance(
            upper,
            lower
        );

    const horizontal =
        distance(
            left,
            right
        );

    return (
        vertical /
        Math.max(
            horizontal,
            .0001
        )
    );
}


/* =====================================================
   FACE PROCESS
===================================================== */

function processFace(
    results
){

    faceLandmarks =
        results.multiFaceLandmarks?.[0]
        || null;

    if(!faceLandmarks){
        return;
    }


    /*
       MediaPipe Face Mesh:

       Left eye:
       159 / 145
       33 / 133

       Right eye:
       386 / 374
       362 / 263
    */

    const L =
        eyeRatio(
            faceLandmarks[159],
            faceLandmarks[145],
            faceLandmarks[33],
            faceLandmarks[133]
        );

    const R =
        eyeRatio(
            faceLandmarks[386],
            faceLandmarks[374],
            faceLandmarks[362],
            faceLandmarks[263]
        );

    const eyeOpen =
        (L+R)/2;

    const closed =
        eyeOpen < .19;

    const now =
        performance.now();


    /*
       Chỉ tính một lần
       khi mắt chuyển OPEN -> CLOSED.
    */

    if(
        closed &&
        !blinkClosed &&
        now-lastBlink > BLINK_GAP
    ){

        lastBlink = now;

        blinkTimes.push(now);

        blinkTimes =
            blinkTimes.filter(
                t=>
                    now-t <
                    BLINK_WINDOW
            );


        /*
           3 lần chớp
        */

        if(
            blinkTimes.length >= 3
        ){

            maskVisible =
                !maskVisible;

            blinkTimes.length =
                0;
        }
    }

    blinkClosed =
        closed;
}


/* =====================================================
   SPIDER MASK
===================================================== */

function drawSpiderMask(){

    maskCtx.clearRect(
        0,
        0,
        W,
        H
    );

    if(
        !maskVisible ||
        !faceLandmarks
    ){

        return;
    }


    const leftEye =
        faceLandmarks[33];

    const rightEye =
        faceLandmarks[263];

    const nose =
        faceLandmarks[1];

    const chin =
        faceLandmarks[152];

    const forehead =
        faceLandmarks[10];


    /*
       Convert camera coordinates
       sang màn hình mirror.
    */

    const L =
        screenPoint(
            leftEye
        );

    const R =
        screenPoint(
            rightEye
        );

    const N =
        screenPoint(
            nose
        );

    const C =
        screenPoint(
            chin
        );

    const F =
        screenPoint(
            forehead
        );


    const cx =
        (L.x+R.x)/2;

    const cy =
        (F.y+C.y)/2;

    const faceW =
        Math.abs(
            R.x-L.x
        ) * 2.1;

    const faceH =
        Math.abs(
            C.y-F.y
        ) * 1.35;


    /*
       Độ nghiêng đầu
    */

    const angle =
        Math.atan2(
            R.y-L.y,
            R.x-L.x
        );


    maskCtx.save();

    maskCtx.translate(
        cx,
        cy
    );

    maskCtx.rotate(
        angle
    );


    /*
       MẶT NẠ
    */

    const grad =
        maskCtx.createLinearGradient(
            -faceW/2,
            -faceH/2,
            faceW/2,
            faceH/2
        );

    grad.addColorStop(
        0,
        "#250008"
    );

    grad.addColorStop(
        .5,
        "#090b12"
    );

    grad.addColorStop(
        1,
        "#35000b"
    );


    maskCtx.beginPath();

    /*
       Phần sau gáy
       và đỉnh đầu.
    */

    maskCtx.moveTo(
        -faceW*.48,
        -faceH*.15
    );

    maskCtx.quadraticCurveTo(
        -faceW*.62,
        -faceH*.65,
        0,
        -faceH*.76
    );

    maskCtx.quadraticCurveTo(
        faceW*.62,
        -faceH*.65,
        faceW*.48,
        -faceH*.15
    );

    maskCtx.quadraticCurveTo(
        faceW*.55,
        faceH*.25,
        faceW*.28,
        faceH*.58
    );

    maskCtx.quadraticCurveTo(
        0,
        faceH*.72,
        -faceW*.28,
        faceH*.58
    );

    maskCtx.quadraticCurveTo(
        -faceW*.55,
        faceH*.25,
        -faceW*.48,
        -faceH*.15
    );

    maskCtx.closePath();

    maskCtx.fillStyle =
        grad;

    maskCtx.shadowColor =
        "rgba(255,0,40,.5)";

    maskCtx.shadowBlur =
        25;

    maskCtx.fill();


    /*
       WEB PATTERN
    */

    maskCtx.shadowBlur = 0;

    maskCtx.strokeStyle =
        "rgba(255,255,255,.25)";

    maskCtx.lineWidth =
        Math.max(
            1,
            faceW*.007
        );


    for(
        let i=-4;
        i<=4;
        i++
    ){

        maskCtx.beginPath();

        maskCtx.moveTo(
            0,
            0
        );

        maskCtx.lineTo(
            i*faceW*.14,
            faceH*.65
        );

        maskCtx.stroke();
    }


    for(
        let i=1;
        i<=5;
        i++
    ){

        maskCtx.beginPath();

        maskCtx.ellipse(
            0,
            faceH*(i*.085),
            faceW*(.12+i*.035),
            faceH*.095,
            0,
            0,
            Math.PI*2
        );

        maskCtx.stroke();
    }


    /*
       MẮT NHỆN
    */

    function drawEye(x,y,flip){

        maskCtx.save();

        maskCtx.translate(
            x,
            y
        );

        maskCtx.scale(
            flip,
            1
        );

        maskCtx.beginPath();

        maskCtx.moveTo(
            -faceW*.17,
            0
        );

        maskCtx.quadraticCurveTo(
            -faceW*.05,
            -faceH*.12,
            faceW*.13,
            -faceH*.04
        );

        maskCtx.quadraticCurveTo(
            faceW*.06,
            faceH*.08,
            -faceW*.15,
            faceH*.10
        );

        maskCtx.closePath();

        maskCtx.fillStyle =
            "#05060a";

        maskCtx.strokeStyle =
            "rgba(255,255,255,.85)";

        maskCtx.lineWidth =
            Math.max(
                1,
                faceW*.008
            );

        maskCtx.fill();

        maskCtx.stroke();

        maskCtx.restore();
    }


    drawEye(
        -faceW*.22,
        -faceH*.03,
        1
    );

    drawEye(
        faceW*.22,
        -faceH*.03,
        -1
    );


    /*
       LOGO / CENTER
    */

    maskCtx.beginPath();

    maskCtx.arc(
        0,
        faceH*.20,
        faceW*.025,
        0,
        Math.PI*2
    );

    maskCtx.fillStyle =
        "rgba(255,255,255,.8)";

    maskCtx.fill();


    maskCtx.restore();
}


/* =====================================================
   CAMERA LOOP
===================================================== */

let tracking = false;

let lastSend = 0;

async function trackingLoop(){

    if(!tracking){
        return;
    }

    const now =
        performance.now();


    /*
       Hands tối đa khoảng 60 FPS
       nếu thiết bị đủ mạnh.
    */

    if(
        video.readyState >= 2 &&
        now-lastSend >= 16
    ){

        lastSend = now;

        try{

            await hands.send({
                image:video
            });

        }
        catch(e){

            console.warn(
                "Hands:",
                e
            );
        }

        /*
           Face chạy song song
           nhưng chậm hơn một chút
           để giảm lag.
        */

        if(
            faceMesh &&
            now-lastFaceSend >= 33
        ){

            lastFaceSend = now;

            try{

                await faceMesh.send({
                    image:video
                });

            }
            catch(e){

                console.warn(
                    "Face:",
                    e
                );
            }
        }
    }


    /*
       Render mask riêng
       để không phụ thuộc
       frame tracking.
    */

    drawSpiderMask();


    requestAnimationFrame(
        trackingLoop
    );
}


let lastFaceSend = 0;


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    startButton.disabled =
        true;

    errorBox.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorBox.textContent =
            "Hãy mở bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;
    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );
        }


        const stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:60,
                        max:60
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        /*
           Khởi tạo AI
        */

        await startHands();

        await startFace();


        tracking =
            true;


        startScreen.style.display =
            "none";


        instruction.textContent =
            "ĐƯA HAI BÀN TAY VÀO CAMERA";


        requestAnimationFrame(
            trackingLoop
        );

    }
    catch(error){

        console.error(
            error
        );

        errorBox.textContent =
            "Không mở được camera: "+
            (
                error.message ||
                "Lỗi không xác định"
            );

        startButton.disabled =
            false;
    }
}
