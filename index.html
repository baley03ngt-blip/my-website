<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05080d">

<title>HANDLIGHT V5</title>

<style>

:root{
    --bg:#05080d;
    --white:#ffffff;
    --muted:rgba(255,255,255,.55);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
}

body{
    font-family:Arial,sans-serif;
    color:white;
}

.stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:#05080d;
}

/* CAMERA */

#camera{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    filter:
        brightness(.78)
        contrast(1.06)
        saturate(.92);

    z-index:0;
}

/* CANVAS */

#effects{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

/* DARK OVERLAY */

.overlay{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.12) 65%,
            rgba(0,0,0,.55) 100%
        );
}

/* TOP */

.top{
    position:absolute;
    top:0;
    left:0;
    right:0;

    z-index:8;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        max(20px,env(safe-area-inset-top))
        20px
        15px;

    font:
        9px monospace;

    letter-spacing:.17em;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:0 0 12px #fff;
}

.status{
    color:var(--muted);
}

/* START */

.start{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    background:#05080d;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

.start.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-content{
    width:min(88vw,400px);
    text-align:center;
}

.camera-icon{
    width:68px;
    height:68px;

    margin:0 auto 25px;

    border:1px solid
        rgba(255,255,255,.35);

    border-radius:50%;

    display:grid;
    place-items:center;

    box-shadow:
        0 0 35px
        rgba(255,255,255,.08);
}

.camera-icon span{
    width:21px;
    height:29px;

    border:2px solid white;

    border-radius:
        13px 13px 8px 8px;
}

.eyebrow{
    margin:0 0 12px;

    color:
        rgba(255,255,255,.6);

    font:
        10px monospace;

    letter-spacing:.2em;
}

h1{
    margin:0;

    font-size:
        clamp(30px,8vw,44px);

    line-height:1.02;

    letter-spacing:-.04em;
}

.desc{
    max-width:320px;

    margin:
        18px auto 27px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.start-button{
    border:0;

    padding:
        16px 25px;

    background:white;

    color:#05080d;

    font:
        800 11px Arial;

    letter-spacing:.14em;

    cursor:pointer;

    box-shadow:
        0 0 30px
        rgba(255,255,255,.18);
}

.start-button:active{
    transform:scale(.96);
}

.error{
    display:none;

    margin-top:15px;

    color:
        rgba(255,255,255,.55);

    font-size:11px;

    line-height:1.5;
}

/* BOTTOM */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:8;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        15px 20px
        max(24px,env(safe-area-inset-bottom));

    color:
        rgba(255,255,255,.48);

    font:
        9px monospace;

    letter-spacing:.08em;
}

.hint{
    display:flex;
    align-items:center;
    gap:8px;
}

.line{
    width:23px;
    height:1px;

    background:white;

    box-shadow:
        0 0 8px white;
}

/* FLASH */

#flash{
    position:absolute;
    inset:0;

    z-index:15;

    background:white;

    opacity:0;

    pointer-events:none;
}

@media(min-width:700px){

    .stage{
        max-width:430px;
        margin:auto;

        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.08),

            0 30px 90px
            rgba(0,0,0,.5);
    }

}

</style>
</head>


<body>

<main class="stage">

<video
id="camera"
autoplay
muted
playsinline>
</video>

<canvas
id="effects">
</canvas>

<div class="overlay"></div>

<div id="flash"></div>


<header class="top">

<div class="logo">
<span class="logo-dot"></span>
HANDLIGHT
</div>

<div
id="status"
class="status">
CAMERA OFF
</div>

</header>


<!-- START SCREEN -->

<section
id="start"
class="start">

<div class="start-content">

<div class="camera-icon">
<span></span>
</div>

<p class="eyebrow">
HANDLIGHT V5
</p>

<h1>
Mở cửa sổ<br>
bằng đôi tay
</h1>

<p class="desc">
Chạm ngón trỏ và ngón cái
ở cả hai tay để tạo liên kết.
Sau đó di chuyển hai tay để điều khiển cửa sổ.
</p>

<button
id="startButton"
class="start-button">

BẬT CAMERA

</button>

<div
id="error"
class="error">
</div>

</div>

</section>


<div class="bottom">

<div class="hint">

<span class="line"></span>

<span id="hint">
CHỜ HAI BÀN TAY
</span>

</div>

<div id="gesture">
READY
</div>

</div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
crossorigin="anonymous">
</script>


<script>

(() => {

"use strict";


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("effects");

const ctx =
canvas.getContext("2d",{
    alpha:true
});

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const status =
document.getElementById("status");

const errorBox =
document.getElementById("error");

const hint =
document.getElementById("hint");

const gesture =
document.getElementById("gesture");

const flash =
document.getElementById("flash");


/* =====================================================
   SIZE
===================================================== */

let W = 0;
let H = 0;

function resize(){

    W =
    canvas.clientWidth;

    H =
    canvas.clientHeight;

    const dpr =
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    canvas.width =
    Math.floor(W*dpr);

    canvas.height =
    Math.floor(H*dpr);

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   CAMERA
===================================================== */

let stream = null;


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let tracking = false;

let lastSend = 0;


/* =====================================================
   WINDOW STATE
===================================================== */

let windowActive = false;

let lastSeenTime = 0;


/*
    Giữ cửa sổ trong thời gian ngắn
    nếu MediaPipe mất tay.
*/

const KEEP_ALIVE = 180;


/* =====================================================
   7 MÀU
===================================================== */

const colors = [

"#ff4d79",
"#ff8b42",
"#ffe45b",
"#59e889",
"#4de4ff",
"#6888ff",
"#c76cff"

];

let colorIndex = 0;

let lastColorChange = 0;


/* =====================================================
   4 CORNERS

   0 = trái trên
   1 = phải trên
   2 = phải dưới
   3 = trái dưới
===================================================== */

const current = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

const target = {

    tl:{x:0,y:0},
    tr:{x:0,y:0},
    br:{x:0,y:0},
    bl:{x:0,y:0}

};

let initialized = false;


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   MIRROR CAMERA
===================================================== */

function point(p){

    return {

        x:(1-p.x)*W,

        y:p.y*H

    };

}


/* =====================================================
   INDEX + THUMB CHẠM NHAU
===================================================== */

function indexThumbTouch(hand){

    return (
        distance(
            hand[4],
            hand[8]
        ) < .085
    );

}


/* =====================================================
   PINKY + THUMB
===================================================== */

function pinkyThumbTouch(hand){

    return (
        distance(
            hand[4],
            hand[20]
        ) < .09
    );

}


/* =====================================================
   LERP
===================================================== */

function smoothPoint(
    currentPoint,
    targetPoint
){

    const amount = .23;

    currentPoint.x +=
        (
            targetPoint.x -
            currentPoint.x
        ) * amount;

    currentPoint.y +=
        (
            targetPoint.y -
            currentPoint.y
        ) * amount;

}


/* =====================================================
   UPDATE CORNERS
===================================================== */

function updateCorners(
    left,
    right
){

    /*
        TRỎ TRÁI
        = góc trên trái
    */

    target.tl =
    point(left[8]);


    /*
        TRỎ PHẢI
        = góc trên phải
    */

    target.tr =
    point(right[8]);


    /*
        CÁI PHẢI
        = góc dưới phải
    */

    target.br =
    point(right[4]);


    /*
        CÁI TRÁI
        = góc dưới trái
    */

    target.bl =
    point(left[4]);


    /*
        Frame đầu tiên
        đặt trực tiếp.
    */

    if(!initialized){

        current.tl =
        {...target.tl};

        current.tr =
        {...target.tr};

        current.br =
        {...target.br};

        current.bl =
        {...target.bl};

        initialized = true;

    }

}


/* =====================================================
   SMOOTH CORNERS
===================================================== */

function smoothCorners(){

    smoothPoint(
        current.tl,
        target.tl
    );

    smoothPoint(
        current.tr,
        target.tr
    );

    smoothPoint(
        current.br,
        target.br
    );

    smoothPoint(
        current.bl,
        target.bl
    );

}


/* =====================================================
   ĐƯỜNG NỐI 4 NGÓN
===================================================== */

function drawFrame(){

    if(!windowActive)
        return;


    const p = current;

    const color =
        colors[colorIndex];


    ctx.save();


    /*
        GLOW NGOÀI
    */

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        7;

    ctx.lineJoin =
        "round";

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        22;

    ctx.stroke();


    /*
        ĐƯỜNG CHÍNH
    */

    ctx.shadowBlur =
        7;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        1.5;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   KÍNH BÊN TRONG

   KHÔNG PHẢI CỤC TRẮNG.

   Chỉ phủ một lớp cực nhẹ
   để vẫn nhìn thấy camera.
===================================================== */

function drawWindow(){

    if(!windowActive)
        return;


    const p = current;

    const color =
        colors[colorIndex];


    ctx.save();


    /*
        CẮT ĐÚNG THEO 4 GÓC
    */

    ctx.beginPath();

    ctx.moveTo(
        p.tl.x,
        p.tl.y
    );

    ctx.lineTo(
        p.tr.x,
        p.tr.y
    );

    ctx.lineTo(
        p.br.x,
        p.br.y
    );

    ctx.lineTo(
        p.bl.x,
        p.bl.y
    );

    ctx.closePath();

    ctx.clip();


    /*
        LỚP KÍNH RẤT MỎNG
    */

    const gradient =
    ctx.createLinearGradient(
        p.tl.x,
        p.tl.y,
        p.br.x,
        p.br.y
    );

    gradient.addColorStop(
        0,
        color+"18"
    );

    gradient.addColorStop(
        .5,
        color+"08"
    );

    gradient.addColorStop(
        1,
        color+"16"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        ÁNH SÁNG NHẸ
    */

    const glow =
    ctx.createRadialGradient(
        (p.tl.x+p.tr.x)/2,
        (p.tl.y+p.bl.y)/2,
        0,

        (p.tl.x+p.br.x)/2,
        (p.tl.y+p.br.y)/2,
        Math.max(W,H)*.5
    );

    glow.addColorStop(
        0,
        color+"0c"
    );

    glow.addColorStop(
        1,
        color+"00"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();

}


/* =====================================================
   4 ĐIỂM SÁNG NHỎ

   KHÔNG DÙNG GLOW TO.
===================================================== */

function drawCorners(){

    if(!windowActive)
        return;


    const color =
        colors[colorIndex];


    const points = [

        current.tl,
        current.tr,
        current.br,
        current.bl

    ];


    ctx.save();

    for(
        const p of points
    ){

        /*
            Vòng tròn nhỏ
            giống điểm tracking
            trong ảnh.
        */

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowColor =
            color;

        ctx.shadowBlur =
            9;

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            color;

        ctx.lineWidth =
            1.3;

        ctx.shadowBlur =
            0;

        ctx.stroke();

    }

    ctx.restore();

}


/* =====================================================
   ĐỔI MÀU
===================================================== */

function changeColor(){

    const now =
    performance.now();


    /*
        Không đổi liên tục
        khi đang giữ.
    */

    if(
        now-lastColorChange
        < 850
    ){

        return;

    }


    lastColorChange =
    now;


    colorIndex =
    (
        colorIndex+1
    ) % colors.length;


    flash.animate(

        [
            {opacity:0},
            {opacity:.08},
            {opacity:0}
        ],

        {
            duration:280,
            easing:"ease-out"
        }

    );

}


/* =====================================================
   XỬ LÝ 2 TAY
===================================================== */

function processHands(
    detected
){

    const now =
    performance.now();


    /*
        CHƯA ĐỦ 2 TAY
    */

    if(
        detected.length < 2
    ){

        /*
            Không xóa ngay.
        */

        if(
            windowActive &&
            now-lastSeenTime <
            KEEP_ALIVE
        ){

            return;

        }


        if(!windowActive){

            hint.textContent =
            "ĐƯA HAI BÀN TAY VÀO";

            gesture.textContent =
            "WAITING";

        }

        return;

    }


    /*
        Convert
    */

    const two =
    detected
    .slice(0,2)
    .map(
        hand =>
        hand.map(point)
    );


    /*
        Xác định trái phải
        theo vị trí trên màn hình.
    */

    two.sort(
        (a,b) =>
        a[9].x-b[9].x
    );


    const left =
    two[0];

    const right =
    two[1];


    /*
        Cập nhật thời gian
    */

    lastSeenTime =
    now;


    /*
        =========================================
        CHƯA MỞ
        =========================================
    */

    if(!windowActive){

        const leftTouch =
        indexThumbTouch(
            left
        );

        const rightTouch =
        indexThumbTouch(
            right
        );


        /*
            Hai tay cùng chạm
        */

        if(
            leftTouch &&
            rightTouch
        ){

            windowActive =
            true;

            initialized =
            false;

            updateCorners(
                left,
                right
            );


            hint.textContent =
            "CỬA SỔ ĐÃ MỞ";

            gesture.textContent =
            "HAND WINDOW";

        }
        else{

            hint.textContent =
            "TRỎ + CÁI Ở CẢ HAI TAY";

            gesture.textContent =
            "READY";

        }


        return;

    }


    /*
        =========================================
        CỬA SỔ ĐANG MỞ
        =========================================
    */


    /*
        CỰC KỲ QUAN TRỌNG:

        Mỗi frame đều lấy
        đúng 4 ngón làm 4 góc.
    */

    updateCorners(
        left,
        right
    );


    /*
        Đổi màu:
        út + cái trái
        VÀ
        út + cái phải
    */

    const leftColor =
    pinkyThumbTouch(
        left
    );

    const rightColor =
    pinkyThumbTouch(
        right
    );


    if(
        leftColor &&
        rightColor
    ){

        changeColor();

    }


    hint.textContent =
    "DI CHUYỂN HAI TAY ĐỂ ĐIỀU KHIỂN";

    gesture.textContent =
    "WINDOW ACTIVE";

}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onResults(result){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
    result.multiHandLandmarks || [];


    processHands(
        detected
    );


    /*
        Làm mượt 4 góc
    */

    smoothCorners();


    /*
        THỨ TỰ:

        1. kính
        2. viền
        3. điểm góc

        Không có cục glow trắng.
    */

    drawWindow();

    drawFrame();

    drawCorners();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

    if(!tracking)
        return;


    const now =
    performance.now();


    /*
        ~24 FPS
    */

    if(
        hands &&
        video.readyState >= 2 &&
        now-lastSend >= 42
    ){

        lastSend =
        now;


        try{

            await hands.send({
                image:video
            });

        }
        catch(err){

            console.log(err);

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    if(
        !window.Hands
    ){

        status.textContent =
        "CAMERA OK";

        return;

    }


    hands =
    new Hands({

        locateFile:
        file =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
        +file

    });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:0,

        minDetectionConfidence:.55,

        minTrackingConfidence:.55

    });


    hands.onResults(
        onResults
    );


    tracking =
    true;


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    text
){

    errorBox.style.display =
    "block";

    errorBox.textContent =
    text;

    startButton.disabled =
    false;

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
    true;

    status.textContent =
    "ĐANG XIN QUYỀN";


    if(
        !window.isSecureContext
    ){

        showError(
            "Hãy mở website bằng HTTPS hoặc GitHub Pages."
        );

        return;

    }


    try{

        stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            audio:false,

            video:{

                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                },

                frameRate:{
                    ideal:24,
                    max:30
                }

            }

        });


        video.srcObject =
        stream;


        await video.play();


        start.classList.add(
            "hide"
        );


        status.textContent =
        "HAND TRACKING";


        resize();


        await startTracking();

    }
    catch(err){

        console.log(err);

        status.textContent =
        "CAMERA ERROR";

        startButton.disabled =
        false;


        if(
            err.name ===
            "NotAllowedError"
        ){

            showError(
                "Camera đang bị chặn. Hãy cấp quyền Camera."
            );

        }
        else if(
            err.name ===
            "NotFoundError"
        ){

            showError(
                "Không tìm thấy Camera."
            );

        }
        else if(
            err.name ===
            "NotReadableError"
        ){

            showError(
                "Camera đang được ứng dụng khác sử dụng."
            );

        }
        else{

            showError(
                "Không thể mở Camera."
            );

        }

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        tracking =
        false;


        if(stream){

            stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        }

    }
);

})();

</script>
