<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<title>Hand Tracking TEST</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,sans-serif;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

#video{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    /*
       Camera selfie
    */
    transform:scaleX(-1);

    z-index:1;
}

#canvas{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}


/* ==============================
   START
============================== */

#startScreen{

    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#05080d;

    color:white;

    text-align:center;
}

#startBox{

    width:min(90%,420px);

}

#startBox h1{

    margin:0 0 15px;

    font-size:32px;

}

#startBox p{

    color:#aaa;

    line-height:1.6;

    font-size:14px;

}

#startButton{

    margin-top:15px;

    border:0;

    padding:15px 25px;

    background:white;

    color:#05080d;

    font-weight:bold;

    cursor:pointer;

}

#startButton:active{

    transform:scale(.96);

}


/* ==============================
   DEBUG PANEL
============================== */

#debug{

    position:absolute;

    top:15px;

    left:15px;

    z-index:10;

    width:260px;

    padding:13px;

    border-radius:10px;

    background:
        rgba(0,0,0,.72);

    border:
        1px solid
        rgba(255,255,255,.2);

    color:white;

    font-family:
        Consolas,
        monospace;

    font-size:13px;

    line-height:1.7;

    backdrop-filter:blur(8px);

}

.title{

    color:#4de4ff;

    font-weight:bold;

    margin-bottom:6px;

}

.ok{

    color:#59e889;

}

.no{

    color:#ff6b7a;

}


/* ==============================
   BOTTOM
============================== */

#instruction{

    position:absolute;

    bottom:20px;

    left:0;

    right:0;

    z-index:10;

    text-align:center;

    color:white;

    font-size:13px;

}

</style>
</head>


<body>


<div id="app">


    <!-- CAMERA -->

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>


    <!-- DRAWING -->

    <canvas
        id="canvas">
    </canvas>


    <!-- DEBUG -->

    <div id="debug">

        <div class="title">
            HAND TRACKING TEST
        </div>

        <div id="handsCount">
            Hai tay: ĐANG CHỜ...
        </div>

        <hr>

        <div id="leftInfo">
            TAY TRÁI: ---
        </div>

        <div id="rightInfo">
            TAY PHẢI: ---
        </div>

    </div>


    <!-- START -->

    <div id="startScreen">

        <div id="startBox">

            <h1>
                HAND TRACKING TEST
            </h1>

            <p>
                Bấm nút bên dưới để bật camera.
                Sau đó đưa cả hai bàn tay vào camera.
            </p>

            <button id="startButton">
                BẬT CAMERA
            </button>

            <p id="error"></p>

        </div>

    </div>


    <div id="instruction">

        Đưa hai bàn tay vào camera

    </div>


</div>


<!-- =====================================================
     MEDIAPIPE HANDS
===================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
</script>


<script>

"use strict";


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById(
    "video"
);

const canvas =
document.getElementById(
    "canvas"
);

const ctx =
canvas.getContext(
    "2d"
);

const startScreen =
document.getElementById(
    "startScreen"
);

const startButton =
document.getElementById(
    "startButton"
);

const errorText =
document.getElementById(
    "error"
);

const handsCount =
document.getElementById(
    "handsCount"
);

const leftInfo =
document.getElementById(
    "leftInfo"
);

const rightInfo =
document.getElementById(
    "rightInfo"
);

const instruction =
document.getElementById(
    "instruction"
);


/* =====================================================
   CANVAS SIZE
===================================================== */

let W = 0;

let H = 0;

let DPR = 1;


function resizeCanvas(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            W * DPR
        );

    canvas.height =
        Math.round(
            H * DPR
        );

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   MEDIAPIPE
===================================================== */

let hands = null;

let cameraRunning = false;


/* =====================================================
   HAND CONNECTIONS
===================================================== */

const connections = [

    /* thumb */

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    /* index */

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    /* middle */

    [0,9],
    [9,10],
    [10,11],
    [11,12],

    /* ring */

    [0,13],
    [13,14],
    [14,15],
    [15,16],

    /* pinky */

    [0,17],
    [17,18],
    [18,19],
    [19,20],

    /* palm */

    [5,9],
    [9,13],
    [13,17]

];


/* =====================================================
   POINT TO SCREEN
===================================================== */

function toScreen(point){

    /*
       Mirror giống camera.
    */

    return {

        x:
            (1 - point.x) * W,

        y:
            point.y * H

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =====================================================
   HAND SIZE
===================================================== */

function getHandSize(hand){

    /*
       Khoảng cách:

       cổ tay
       ↓
       khớp giữa ngón giữa

       dùng làm kích thước
       chuẩn của bàn tay.
    */

    return Math.max(

        distance(
            hand[0],
            hand[9]
        ),

        0.0001

    );

}


/* =====================================================
   THUMB - INDEX RATIO
===================================================== */

function getThumbIndexRatio(hand){

    const thumb =
        hand[4];

    const index =
        hand[8];

    const thumbIndexDistance =
        distance(
            thumb,
            index
        );

    const handSize =
        getHandSize(
            hand
        );

    return (
        thumbIndexDistance /
        handSize
    );

}


/* =====================================================
   DRAW HAND
===================================================== */

function drawHand(hand){

    const points =
        hand.map(
            toScreen
        );


    /*
       ==========================
       DRAW BONES
       ==========================
    */

    ctx.save();

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    for(
        const connection
        of connections
    ){

        const a =
            points[
                connection[0]
            ];

        const b =
            points[
                connection[1]
            ];


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.strokeStyle =
            "rgba(255,255,255,.75)";

        ctx.lineWidth =
            1.5;

        ctx.stroke();

    }


    /*
       ==========================
       DRAW 21 JOINTS
       ==========================
    */

    for(
        let i=0;
        i<points.length;
        i++
    ){

        const p =
            points[i];


        /*
           Đầu ngón tay lớn hơn.
        */

        const isTip =
            (
                i === 4 ||
                i === 8 ||
                i === 12 ||
                i === 16 ||
                i === 20
            );


        ctx.beginPath();

        ctx.arc(

            p.x,
            p.y,

            isTip
                ? 4
                : 2.5,

            0,
            Math.PI * 2

        );


        ctx.fillStyle =
            "white";

        ctx.shadowColor =
            "white";

        ctx.shadowBlur =
            isTip
                ? 8
                : 3;

        ctx.fill();

    }


    /*
       ==========================
       THUMB
       ==========================
    */

    drawSpecialPoint(
        points[4]
    );


    /*
       ==========================
       INDEX
       ==========================
    */

    drawSpecialPoint(
        points[8]
    );


    ctx.restore();

}


/* =====================================================
   SPECIAL POINT
===================================================== */

function drawSpecialPoint(p){

    ctx.save();


    ctx.beginPath();

    ctx.arc(

        p.x,
        p.y,

        8,

        0,
        Math.PI * 2

    );


    ctx.strokeStyle =
        "rgba(77,228,255,.8)";

    ctx.lineWidth =
        1.5;

    ctx.shadowColor =
        "#4de4ff";

    ctx.shadowBlur =
        10;

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   DRAW DISTANCE
===================================================== */

function drawDistance(
    hand
){

    const thumb =
        toScreen(
            hand[4]
        );

    const index =
        toScreen(
            hand[8]
        );


    /*
       Đường nối
       cái → trỏ
    */

    ctx.save();


    ctx.beginPath();

    ctx.moveTo(
        thumb.x,
        thumb.y
    );

    ctx.lineTo(
        index.x,
        index.y
    );


    ctx.strokeStyle =
        "#4de4ff";

    ctx.lineWidth =
        2;

    ctx.setLineDash([
        5,
        5
    ]);

    ctx.stroke();


    /*
       Tính khoảng cách
    */

    const ratio =
        getThumbIndexRatio(
            hand
        );


    /*
       Vị trí chữ
    */

    const centerX =
        (
            thumb.x +
            index.x
        ) / 2;

    const centerY =
        (
            thumb.y +
            index.y
        ) / 2;


    ctx.setLineDash([]);


    /*
       Background chữ
    */

    ctx.fillStyle =
        "rgba(0,0,0,.7)";

    ctx.fillRect(

        centerX - 45,
        centerY - 27,

        90,
        24

    );


    /*
       Số
    */

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 12px monospace";

    ctx.textAlign =
        "center";

    ctx.fillText(

        ratio.toFixed(3),

        centerX,
        centerY - 11

    );


    /*
       Trạng thái
    */

    const touch =
        ratio < 0.65;


    ctx.fillStyle =
        touch
            ? "#59e889"
            : "#ff6b7a";


    ctx.fillText(

        touch
            ? "TOUCH"
            : "OPEN",

        centerX,
        centerY + 5

    );


    ctx.restore();

}


/* =====================================================
   SORT LEFT / RIGHT
===================================================== */

function separateHands(
    detected
){

    if(
        detected.length < 2
    ){

        return null;

    }


    const first =
        detected[0];

    const second =
        detected[1];


    const firstScreen =
        toScreen(
            first[9]
        );

    const secondScreen =
        toScreen(
            second[9]
        );


    if(
        firstScreen.x <
        secondScreen.x
    ){

        return {

            left:first,
            right:second

        };

    }


    return {

        left:second,
        right:first

    };

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(
    results
){

    /*
       Xóa canvas
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const detected =
        results.multiHandLandmarks
        || [];


    /*
       ==========================
       KHÔNG CÓ TAY
       ==========================
    */

    if(
        detected.length === 0
    ){

        handsCount.innerHTML =
            "Hai tay: <span class='no'>0</span>";

        leftInfo.innerHTML =
            "TAY TRÁI: ---";

        rightInfo.innerHTML =
            "TAY PHẢI: ---";

        instruction.textContent =
            "Đưa hai bàn tay vào camera";

        return;

    }


    /*
       ==========================
       VẼ TẤT CẢ BÀN TAY
       ==========================
    */

    for(
        const hand
        of detected
    ){

        drawHand(
            hand
        );

    }


    /*
       ==========================
       1 TAY
       ==========================
    */

    if(
        detected.length === 1
    ){

        const ratio =
            getThumbIndexRatio(
                detected[0]
            );


        drawDistance(
            detected[0]
        );


        handsCount.innerHTML =
            "Hai tay: <span class='no'>1 / 2</span>";


        leftInfo.innerHTML =
            "TAY: "+
            ratio.toFixed(3);


        rightInfo.innerHTML =
            "TAY PHẢI: ---";


        instruction.textContent =
            "CẦN THÊM BÀN TAY THỨ HAI";

        return;

    }


    /*
       ==========================
       2 TAY
       ==========================
    */

    const separated =
        separateHands(
            detected
        );


    if(!separated){

        return;

    }


    const left =
        separated.left;

    const right =
        separated.right;


    /*
       Vẽ khoảng cách
    */

    drawDistance(
        left
    );

    drawDistance(
        right
    );


    /*
       Tính số
    */

    const leftRatio =
        getThumbIndexRatio(
            left
        );

    const rightRatio =
        getThumbIndexRatio(
            right
        );


    /*
       Chạm?
    */

    const leftTouch =
        leftRatio < 0.65;

    const rightTouch =
        rightRatio < 0.65;


    /*
       ==========================
       DEBUG
       ==========================
    */

    handsCount.innerHTML =

        "Hai tay: "+
        "<span class='ok'>2 / 2</span>";


    leftInfo.innerHTML =

        "TAY TRÁI: "+
        leftRatio.toFixed(3)+
        " → "+
        (
            leftTouch
                ? "<span class='ok'>TOUCH</span>"
                : "<span class='no'>OPEN</span>"
        );


    rightInfo.innerHTML =

        "TAY PHẢI: "+
        rightRatio.toFixed(3)+
        " → "+
        (
            rightTouch
                ? "<span class='ok'>TOUCH</span>"
                : "<span class='no'>OPEN</span>"
        );


    /*
       ==========================
       CẢ HAI CHẠM
       ==========================
    */

    if(
        leftTouch &&
        rightTouch
    ){

        instruction.textContent =
            "✅ CẢ HAI NGÓN TRỎ + NGÓN CÁI ĐANG CHẠM";

    }
    else if(
        leftTouch
    ){

        instruction.textContent =
            "TAY TRÁI ĐÃ CHẠM — TAY PHẢI CHƯA";

    }
    else if(
        rightTouch
    ){

        instruction.textContent =
            "TAY PHẢI ĐÃ CHẠM — TAY TRÁI CHƯA";

    }
    else{

        instruction.textContent =
            "Đưa ngón trỏ và ngón cái lại gần nhau";

    }

}


/* =====================================================
   START MEDIAPIPE
===================================================== */

async function startTracking(){

    hands =
        new Hands({

            locateFile:
            function(file){

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                    + file
                );

            }

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:1,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });


    hands.onResults(
        onResults
    );


    cameraRunning =
        true;


    trackingLoop();

}


/* =====================================================
   TRACKING LOOP
===================================================== */

let lastFrame =
    0;


async function trackingLoop(){

    if(
        !cameraRunning
    ){

        return;

    }


    const now =
        performance.now();


    /*
       Không gửi quá nhanh.
    */

    if(
        now-lastFrame >= 33 &&
        video.readyState >= 2
    ){

        lastFrame =
            now;


        try{

            await hands.send({

                image:video

            });

        }
        catch(error){

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        trackingLoop
    );

}


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

    startButton.disabled =
        true;


    errorText.textContent =
        "";


    if(
        !window.isSecureContext
    ){

        errorText.style.color =
            "#ff6b7a";

        errorText.textContent =
            "Website phải chạy bằng HTTPS hoặc GitHub Pages.";

        startButton.disabled =
            false;

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"user"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        instruction.textContent =
            "Camera OK — đưa 2 bàn tay vào";


        await startTracking();

    }
    catch(error){

        console.error(
            error
        );


        errorText.style.display =
            "block";

        errorText.style.color =
            "#ff6b7a";


        if(
            error.name ===
            "NotAllowedError"
        ){

            errorText.textContent =
                "Bạn chưa cấp quyền Camera.";

        }
        else if(
            error.name ===
            "NotFoundError"
        ){

            errorText.textContent =
                "Không tìm thấy Camera.";

        }
        else{

            errorText.textContent =
                "Không thể mở Camera: "+
                error.message;

        }


        startButton.disabled =
            false;

    }

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    openCamera
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        cameraRunning =
            false;


        if(
            video.srcObject
        ){

            video.srcObject
            .getTracks()
            .forEach(
                function(track){

                    track.stop();

                }
            );

        }

    }
);

</script>

</body>
</html>
